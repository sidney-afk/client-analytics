name: B1 Linear Incremental Refresh

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the plan. Leave off to measure a window read-only.'
        type: boolean
        default: true
      changed_since:
        description: 'ISO timestamp overriding the cursor — used to re-read a window a failed run skipped'
        default: ''
      mode:
        description: 'incremental (default) merges the batch parent map and can never CLEAR a stale entry. full loads every issue and replaces the map authoritatively — the only path that removes one. Manual only; never scheduled. Run it read-only first (apply off) to size the change.'
        type: choice
        default: incremental
        options:
          - incremental
          - full
      stray_catcher:
        description: 'SUPERSEDED at F1(video) — stray mode is now the STANDING mode for every run, scheduled or dispatched, and this checkbox is ignored. It remains only so saved dispatch presets keep working. Pre-flip history: stray mode used to be manual-only via this input; the cutover PR made it unconditional per FLIP_RUNBOOK §F1.'
        type: boolean
        default: false
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: b1-linear-incremental-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore last-known-good authority cache
        uses: actions/cache@v4
        with:
          path: .sync-ledger
          key: b1-prod-authority-${{ github.run_id }}
          restore-keys: |
            b1-prod-authority-

      - name: Require refresh secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$LINEAR_API_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY or LINEAR_API_KEY; refusing to report a green refresh."
            missing=1
          fi
          exit "$missing"

      - name: Prove public artifact projection
        run: node test/public-b1-artifact.js

      - name: Run incremental refresh
        shell: bash
        env:
          # Scheduled runs always apply. Manual runs may withhold --apply to
          # MEASURE a window read-only, which is how a suspected skipped span is
          # sized before anyone decides to re-read it.
          B1_APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
          B1_CHANGED_SINCE: ${{ inputs.changed_since }}
          # A scheduled run is ALWAYS incremental. `full` is reachable only by a
          # manual dispatch that asks for it by name, so no cron can ever take
          # the authoritative path by accident.
          B1_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'incremental' }}
          # F1(video) CUTOVER — stray mode is the STANDING mode (FLIP_RUNBOOK
          # §F1 step 1; owner rulings 2026-08-24, FLIP_BUG_LEDGER §0-5): after
          # the video flip nothing is Linear-authoritative, so the only job B1
          # has left is importing issues someone created in Linear anyway,
          # INSERT-ONLY. NOTE the runbook said to add this to the JOB env
          # block; that instruction predates this step-level key, which would
          # have shadowed a job-level value on every scheduled run and kept
          # stray mode silently off — the flag must be set HERE. Fail-closed
          # both ways: stray-on while a team is still Linear-authoritative
          # gates every stray write, and classic mode post-flip gates every
          # classic write — a mismatch imports nothing and pages nothing.
          B1_STRAY_CATCHER: '1'
        run: |
          mkdir -p artifacts .codex-tmp
          ARGS=(--page-delay-ms 500 --json-out artifacts/b1-linear-incremental-refresh.json)
          if [ "$B1_MODE" = "full" ]; then
            # The full path loads every issue and REPLACES linear_parent_ids, so
            # it is the only run that can clear a parent entry that no longer
            # exists in Linear (OPEN_REPAIRS item 14). The incremental path
            # merges by design — clearing by omission was the bug #1051 fixed —
            # which is exactly why a stale entry needs this lane instead.
            #
            # `--changed-since` is meaningless here (full loads everything) and
            # combining them would misreport what was covered, so refuse rather
            # than silently ignore it.
            if [ -n "$B1_CHANGED_SINCE" ]; then
              echo "::error::changed_since is incompatible with mode=full; full already loads every issue."
              exit 1
            fi
            echo "::notice::Running the FULL authoritative backfill. scripts/b1-linear-backfill.js refuses to apply unless a live flag read confirms BOTH teams are Linear-authoritative, so this lane is unavailable after F1 by construction."
          else
            ARGS+=(--incremental)
            if [ -n "$B1_CHANGED_SINCE" ]; then ARGS+=(--changed-since "$B1_CHANGED_SINCE"); fi
          fi
          if [ "$B1_APPLY" != "false" ]; then ARGS+=(--apply); fi
          if ! node scripts/b1-linear-backfill.js "${ARGS[@]}" > .codex-tmp/b1-private.log 2>&1; then
            echo "::error::B1 refresh failed. Detailed output was retained only in the ephemeral runner."
            exit 1
          fi
          echo "B1 refresh completed; only aggregate allowlisted JSON will be uploaded."
          node test/public-b1-artifact.js artifacts/b1-linear-incremental-refresh.json

      # Proves the lane still runs. Its `ok` flag is separate from the cursor:
      # only a successful terminal summary may advance that (see
      # scripts/b1-linear-backfill.js latestIncrementalEvent).
      - name: Record B1 refresh heartbeat
        if: always()
        env:
          SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
        run: node scripts/monitoring-watchdog.js --heartbeat=b1_incremental_refresh --ok=${{ job.status == 'success' }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: b1-linear-incremental-refresh
          path: artifacts/b1-linear-incremental-refresh.json
          if-no-files-found: ignore
          retention-days: 1
