name: Calendar E2E (nightly)

# Drives the REAL index.html in headless Chromium against the LIVE Supabase +
# n8n backend, exercising every calendar interaction across the SMM / Client /
# Kasper surfaces. Scoped to the test client `sidneylaruel`; every probe cleans
# up after itself (archives its cards, tombstones its comments). Because these
# write to the live backend and depend on network/realtime timing, they run on a
# schedule + on demand — NOT on every push. Each probe is retried (PROBE_ATTEMPTS)
# to absorb transient flakiness; the job is red only if a probe fails every try.
on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC nightly
  workflow_dispatch:
    inputs:
      probes:
        description: 'Optional space-separated probe names to run instead of the manifest (e.g. "p42_concurrent_components p46_pagination_fix")'
        required: false
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run headless probes (serves app, scoped to sidneylaruel)
        env:
          PROBE_ATTEMPTS: '3'
          # Each probe resolves the current TEST token in its own Node process,
          # keeps it local, and strips this issuer credential from Chromium.
          SYNCVIEW_STAFF_KEY: ${{ secrets.SYNCVIEW_STAFF_KEY }}
          # An ACTIVE admin/SMM roster name the staff key's role resolves to.
          # p96_description_image_upload binds the live writer to it and FAILS
          # without it; nothing else reads it. Never committed, secret only.
          SYNCVIEW_STAFF_ACTOR: ${{ secrets.SYNCVIEW_STAFF_ACTOR }}
          SYNCVIEW_NIGHTLY_PROBES: ${{ github.event.inputs.probes || '' }}
        run: node qa/run-probes.js
      # A red nightly must PAGE, not just email (owner directive 2026-07-17 —
      # the samples nightly sat red four nights with nobody consuming the
      # signal). Posts through the same SyncView Bot webhook the reconcile
      # pager uses; degrades to a warning if the secret is absent.
      - name: Page the SyncView Bot on scheduled failure
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
        run: |
          if [ -z "$SLACK_ALERT_WEBHOOK" ]; then
            echo "::warning::SLACK_ALERT_WEBHOOK not configured; failed-run email only."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' --data \
            "{\"text\":\"[SyncView watcher] ❌ Calendar E2E nightly FAILED on main — the practice robot found real trouble or needs care. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_ALERT_WEBHOOK"

      # The lane's liveness AND outcome, on the dead-man's switch (2026-08-08).
      #
      # This workflow has carried a "page on scheduled failure" step since
      # 2026-07-17, and it has never once delivered: 16 consecutive scheduled
      # failures produced zero Slack messages, because the step degrades to a
      # log-only warning when SLACK_ALERT_WEBHOOK is unset — a warning nobody
      # reads on a run nobody watches. The third alarm found this week that
      # existed on paper and nowhere else, after the unapplied pager transform
      # and the unmonitored shadow audit.
      #
      # The heartbeat routes the same two facts (did it run / did it pass)
      # through the monitoring watchdog and its relay, whose pages demonstrably
      # reach the owner. The webhook step above stays — if its secret ever gets
      # configured it is a useful second channel — but nothing depends on it.
      - name: Record calendar_e2e_nightly heartbeat
        if: always()
        env:
          SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/monitoring-watchdog.js --heartbeat=calendar_e2e_nightly --ok=${{ job.status == 'success' }}
