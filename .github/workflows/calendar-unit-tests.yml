name: Calendar unit tests

# Fast, dependency-free logic/wiring checks (test/*.js). Most are hermetic
# source/logic checks; F63 additionally exercises only a disposable PostgreSQL
# 16 service. No test in this job reaches a live backend or browser.
# `push` is restricted to main ON PURPOSE. With `branches: ['**']` a commit on
# an open pull request's branch matched BOTH triggers and ran this suite twice
# on the same source. Measured on fc068d15 (2026-08-26): run #3499 (push) passed
# and run #3500 (pull_request) failed — the second run's two jobs never left
# `queued`, so the red mark on that pull request carried no information about
# the code at all. Two runs of identical source doubled the cost and doubled the
# exposure to that. The pull_request trigger covers every branch under review;
# the push trigger covers what actually lands. See docs/ops/CI_GATE_AUDIT.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    # The expanded classified suite completed close to the ten-minute limit.
    # Keep a bounded margin for runner variance without changing any assertions.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      F63_REQUIRE_POSTGRES: '1'
      # The artifact projection proof executes the real thumbnail-revision
      # trigger against this same disposable PostgreSQL. Both attach defects it
      # covers are invisible to source-only assertions.
      ARTIFACT_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # truth-sync verifies freshness anchors resolve and are ancestors
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check index.html is exactly the assembled src/index/ fragments
        run: npm run check:index
      - name: Run unit suite (test/*.js)
        run: node test/run-all.js

  identity-exposure:
    # THIS REPOSITORY IS PUBLIC AND THE ROSTER IS IN IT. Measured 2026-09-02:
    # 45 of the 50 identifying terms on the live roster already appear in the
    # tree. This job is the only thing standing between that number and the
    # next one -- it scans what a pull request ADDS (added lines and added file
    # paths) for a client slug or a colleague's full name, and fails on any.
    #
    # WHY IT IS A SEPARATE JOB. The `unit` job above is documented as reaching
    # no live backend, and this needs the roster to know what an identity IS.
    # It reads exactly two columns (clients.slug, team_members.name) with the
    # browser publishable key that already ships in index.html, so it exposes
    # nothing a page load does not. Folding it into `unit` would have quietly
    # falsified that job's own contract.
    #
    # THE JOB NEVER PRINTS WHAT IT MATCHED, in either output mode -- a leak
    # detector whose CI log names the clients has made one more public copy of
    # exactly the thing it exists to bound. It reports counts and file paths.
    #
    # A ROSTER READ THAT FAILS IS NOT A RED BUILD. Exit 2 means the check could
    # not run (network, an outage); only exit 1 means a real finding, and a
    # forked pull request with no network gets exit 2 rather than a false green
    # or a false red. The tree-mode baseline in PRE_FLIP_HEALTH_CHECK.md is the
    # backstop for anything a skipped run would have missed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff scan needs the merge base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Does this change name a client or a colleague?
        run: |
          set +e
          node scripts/repo-identity-exposure-check.js --diff="origin/${{ github.base_ref }}"
          code=$?
          set -e
          if [[ $code -eq 1 ]]; then
            echo "::error::This change names a client or a colleague. See the file list above — the tool deliberately does not print what it matched; run the same command locally to see it."
            exit 1
          fi
          if [[ $code -eq 3 ]]; then
            echo "::error::identity exposure check could not CLASSIFY the roster (exit 3) — clients.kind returned a value the guard does not know is a person or not. This is not an availability failure: the read worked. Classify it in NON_PERSON_KINDS, or the gate is off for everyone."
            exit 1
          fi
          if [[ $code -ne 0 ]]; then
            echo "::warning::identity exposure check could not run (exit $code) — not a finding, and not a reason to block. The tree-mode baseline in PRE_FLIP_HEALTH_CHECK.md still covers this."
          fi
          exit 0

      # `git diff --check` is the whitespace gate, and .gitattributes makes it
      # blind to every `-text` pinned path -- 98 files on this branch, most of
      # them the exit installer's own executable code. Reproduced 2026-09-16: a
      # CRLF-to-LF flip on a pinned capture passed `git diff --check` with
      # exit 0 and no output. This closes that hole using the same pin list.
      - name: Did a byte-pinned file quietly change its line endings?
        run: |
          set +e
          node scripts/byte-pinned-line-ending-check.js --diff="origin/${{ github.base_ref }}"
          code=$?
          set -e
          if [[ $code -eq 1 ]]; then
            echo "::error::A byte-pinned (.gitattributes -text) file changed its line-ending composition. If the capture was deliberately re-taken, re-run with --accept-recapture=<path> and say so in the PR."
            exit 1
          fi
          if [[ $code -ne 0 ]]; then
            echo "::warning::byte-pinned line-ending check could not run (exit $code) — not a finding."
          fi
          exit 0

  module-check:
    # Phase C step C3 (docs/plans/2026-09-24-modularization-c3-plan.md). Proves
    # the src/index/ script fragments can be converted to ES modules one at a
    # time: each parses on its own, the assembled script parses as a module, no
    # new duplicate top-level name, and no code running at load uses a name a
    # later fragment declares. A separate job because it needs the acorn
    # parser and the `unit` job is dependency-free. package.json is
    # content-pinned (F27 closure, leave-evidence fingerprint), so acorn is
    # installed into a temp prefix at an exact version and never declared.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --against reads the base commit's index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the parser and scope analyser into a temp prefix (package.json untouched)
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/c3" acorn@8.15.0 eslint-scope@9.1.2
      - name: Module readiness checks
        env:
          NODE_PATH: ${{ runner.temp }}/c3/node_modules
        run: node scripts/check-modules.js --report
      # On-demand loading safety nets (docs/plans/2026-09-28-load-per-tab-plan.md):
      # the approve path stays in core, and no new button or typeof guard may
      # reach into another on-demand area without being recorded.
      - name: On-demand loading safety nets
        env:
          NODE_PATH: ${{ runner.temp }}/c3/node_modules
        run: node scripts/check-lazy-safety.js
      # An annotate-only step (imports/exports added, nothing moved) must leave
      # the served page byte-identical to the base branch. check:index cannot
      # prove that: it compares the build with the working tree and HEAD, and
      # the PR commits the regenerated page. Opt in with the label.
      - name: Served page is byte-identical to the base branch (label annotate-only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'annotate-only')
        env:
          NODE_PATH: ${{ runner.temp }}/c3/node_modules
        run: node scripts/check-modules.js --against="origin/${{ github.base_ref }}"

  entry-links-boot:
    # Every signed-out special entry link (?intake=1, ?onboarding=1,
    # ?onboarding=ai, #smm-weekly-report) must reach its own screen in a real
    # browser. On 2026-09-24 ?intake=1 hung on its skeleton because boot read a
    # later fragment's `let` before it initialised; moving fragments and making
    # them modules (phase C) changes exactly that load order, so this runs on
    # every pull request. Fully offline: every backend call is answered empty.
    # package.json is content-pinned, so Playwright goes into a temp prefix.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright into a temp prefix (package.json untouched)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Entry links reach their screens
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/entry-links-boot-browser.js
      - name: Every button's code exists (staff tabs, entry links, client link)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/inline-handlers-browser.js
      - name: Templates client page shows the client's social links
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/templates-social-links-browser.js
      - name: Saves outside the gateway report their refusals to the failed-saves log
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/failed-saves-beacon-browser.js
      - name: A Calendar Retry sends the status the person chose (mocked)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/lost-work-retry-intent-browser.js
      - name: Two people on one Calendar card get a notice, not an overwrite (mocked)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/lost-work-conflict-browser.js
      - name: Typed captions, notes, comments and descriptions survive a closed tab or a failed save (mocked)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/lost-work-drafts-browser.js
      - name: Urgent ping uses the stamp the database holds, and a refused ping can be refreshed
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/urgent-ping-fresh-round-browser.js
      - name: Client approve and request-changes requests are unchanged
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node test/client-review-requests-unchanged-browser.js
      - name: Split load, opt-out and on-demand areas (browser)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/split-load-browser.js
      - name: Client link accepts the split way-back key and still refuses every other key
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/client-link-split-key-browser.js
      - name: Client review link works on phones (approve + request change)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/client-phone-review-browser.js
      - name: Staff Calendar works on phones (Sheet, Review, Month, Week, dark and light)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/staff-calendar-phone-browser.js
      - name: Client link Analytics reads the database behind its flag, Sheets as fallback
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/analytics-mirror-read-browser.js
      - name: Kasper Clients tab is admin-only and read-only
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/clients-admin-browser.js
      - name: Kasper Clients profile shows onboarding checklist, resources and HubSpot state to admins only
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/clients-onboarding-browser.js
      - name: Quick jump opens a client on a tab from the keyboard
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/quick-jump-browser.js
      - name: Creatives open on their own work in Workload and SyncLinear
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/smart-defaults-browser.js
      - name: Samples keeps the caret in the same box across a hide and return
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/sxr-focus-return-browser.js
      - name: One shared client follows the client tabs; team tabs and client links ignore it
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node docs/syncview-design/tests/shared-client-browser.js
      # n8n exit (PRs 2 and 3): the Calendar write guard, the caption prompt read
      # and save, and the proof that the client approve and request-changes
      # requests are byte-identical to main. Fully mocked, no backend.
      - name: Calendar write guard (fresh flag read, hold, pause, zero n8n)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node test/calendar-write-guard-browser.js
      - name: Caption prompts read and save guard (table read, fallback, pause switch)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node test/caption-prompts-guard-browser.js
      - name: Client approve and request-changes always save through the function
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node test/calendar-client-approve-function-browser.js
      - name: Samples write guard (fresh flag read, hold, pause, zero n8n)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node test/samples-write-guard-browser.js
      - name: Samples client approve and request-changes always save through the function
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node test/samples-client-approve-function-browser.js
      # n8n exit phase 2, step D: the TikTok queue poll backs off when nothing changes.
      - name: TikTok queue poll backs off when quiet and resumes on a change
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node test/tiktok-poll-backoff-browser.js


  split-preview:
    # Plan docs/plans/2026-09-28-load-per-tab-plan.md, step 2. The split build
    # (scripts/index-split.js) is off in src/index/split.json, so nothing
    # served changes; this job builds it anyway, in the runner's checkout only,
    # and runs the browser gates against it: once as it would ship (staff get
    # the parts, everyone else the one full file) and once with everyone on the
    # parts. Nothing is committed from here.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright into a temp prefix (package.json untouched)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build the split version (runner checkout only)
        run: node scripts/build-index.js --force-split
      - name: Gates on the split version
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node docs/syncview-design/tests/split-load-browser.js
          node docs/syncview-design/tests/entry-links-boot-browser.js
          node docs/syncview-design/tests/client-phone-review-browser.js
          node docs/syncview-design/tests/inline-handlers-browser.js
          node docs/syncview-design/tests/tab-switch-boot-browser.js
          node docs/syncview-design/tests/prod-write-gateway-browser.js
          node qa/boot/client-entry-sequence.js
      - name: Build with everyone on the parts (runner checkout only)
        run: node scripts/build-index.js --force-split=parts
      - name: Gates with everyone on the parts
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node docs/syncview-design/tests/split-load-browser.js
          node docs/syncview-design/tests/entry-links-boot-browser.js
          node docs/syncview-design/tests/client-phone-review-browser.js
          node docs/syncview-design/tests/inline-handlers-browser.js
  f27-team-rollback-proof:
    if: contains(github.event.head_commit.message || '', 'F27') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Detect F27 proof source
        id: source
        run: |
          if [[ -f scripts/f27-team-rollback-proof.sql ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run isolated TEST transaction
        if: steps.source.outputs.present == 'true'
        run: |
          set -o pipefail
          mkdir -p f27-proof
          psql -X -v ON_ERROR_STOP=1 -f scripts/f27-team-rollback-proof.sql | tee f27-proof/terminal.txt
          sha256sum f27-proof/terminal.txt | tee f27-proof/terminal.sha256
      - name: Outside-n8n terminal observer
        if: steps.source.outputs.present == 'true'
        run: |
          grep -q "F27_PROOF_OK" f27-proof/terminal.txt
          {
            echo "## F27 isolated TEST proof"
            echo
            echo "- observer: GitHub Actions (outside n8n)"
            echo "- terminal: F27_PROOF_OK"
            echo "- receipt hash: $(cut -d' ' -f1 f27-proof/terminal.sha256)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.present == 'true'
        with:
          name: f27-team-rollback-proof
          path: f27-proof/
          retention-days: 30
