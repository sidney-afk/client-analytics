  calendar-ci-result:
    # The one check that sums this workflow up: red when any job failed or was
    # cancelled, green when every job passed or was not needed by this change.
    # Make this the required check, not the individual parts: a part a change
    # does not need is skipped, and its matrix names never appear.
    if: always()
    needs: [changes, unit, identity-exposure, module-check, entry-links-boot, browser-guards, review-stage-phones, repair-checkpoint, split-preview, staff-phone-rules, f27-team-rollback-proof, review-gauntlet-three]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was not needed by this change
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [[ -n "$bad" ]]; then
            echo "::error::Not green: $bad"
            exit 1
          fi
