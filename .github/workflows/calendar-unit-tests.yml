    # Plan docs/plans/2026-09-28-load-per-tab-plan.md, step 2. The split build
    # (scripts/index-split.js) is off in src/index/split.json, so nothing
    # served changes; this job builds it anyway, in the runner's checkout only,
    # and runs the browser gates against it: once as it would ship (staff get
    # the parts, everyone else the one full file) and once with everyone on the
    # parts. Nothing is committed from here.
    # Part 1 checks the split build as it would ship, part 2 with everyone on
    # the parts; they ran one after the other in one 13-minute job.
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    # One of the fourteen pull-request runner seats (see the top of this file).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-runner-seat-split-{0}', matrix.part) || format('calendar-unit-tests-{0}-split-preview-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build index.html and js/ from src/index/ (build output, not committed)
