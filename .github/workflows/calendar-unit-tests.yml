name: Calendar unit tests

# The unit lane checks source/logic with disposable PostgreSQL. Separate browser
# lanes exercise the generated UI against fictional transports. Staff phone
# matrices run only for staff phone/shared UI, harness or gate changes.
# `push` is restricted to main ON PURPOSE. With `branches: ['**']` a commit on
# an open pull request's branch matched BOTH triggers and ran this suite twice
# on the same source. Measured on fc068d15 (2026-08-26): run #3499 (push) passed
# and run #3500 (pull_request) failed — the second run's two jobs never left
# `queued`, so the red mark on that pull request carried no information about
# the code at all. Two runs of identical source doubled the cost and doubled the
# exposure to that. The pull_request trigger covers every branch under review;
# the push trigger covers what actually lands. See docs/ops/CI_GATE_AUDIT.md.
#
# Speed (2026-10-17, session Turbo): the slow browser jobs are split into
# parallel parts, a pull request runs only the suites its files can reach
# (the `changes` job), and a new push to a pull request cancels the run it
# replaces. Pushes to main are never cancelled and always run everything.
#
# Runner seats (2026-10-17, session Throttle). The account runs at most 20 jobs
# at once, shared with the production lanes on main that run every 5 minutes
# (the notification sender, the rename drain, the scans). After the split above
# one pull-request push started about 19 browser jobs at once, so a few open
# pull requests filled every runner and the production lanes queued behind them:
# over the 48 hours to 2026-10-17 15:20 UTC the account sat at 20 jobs for 936
# minutes, and a sender run waited up to 48 minutes for a runner.
# So on a pull request each slow job takes one of FOURTEEN named seats (phone
# parts 1-2 of each width, four seats; entry-links parts 1-3; browser-guards
# parts 1-2; split-preview parts 1-2; unit parts 1-3), and a seat runs one job at
# a time across every open pull request. `queue: max`
# makes later jobs wait in line (up to 100 per seat) instead of GitHub's default,
# which cancels an older waiting job: nothing here is ever cancelled for a seat,
# and a job's timeout counts only from when it starts. Pull-request work can
# therefore hold at most 14 heavy runners, leaving the rest for main and the
# production lanes. Pushes to main and manual runs get a group of their own per
# job, so they never wait for a seat. test/ci-runner-seats.js pins all of this.
#
# Lanes (2026-10-19, session Express). The seats were the right guard but the jobs
# in them were too long: a measured 3 days of pull-request runs (1,075 runs, 6,663
# jobs) showed every browser job running about 6 to 21 minutes yet WAITING up to
# 3.8 hours, because one pull request held a seat for 20 to 21 minutes (two phone
# widths on one seat; the 21 minute guards job alone on one seat) and eight open
# pull requests queued behind each other. The browser suites mostly wait on timers
# (a 128 s suite used 39 s of CPU), so each slow job now runs three of them side by
# side on its 4-CPU runner (scripts/ci-lanes.js; every suite still runs, in the
# same job family, and a red one no longer hides the ones after it). A pull request
# now holds about 90 runner-minutes instead of about 175, and no seat for longer
# than about 9 minutes. The seats also stay a fair queue now: each width of the
# phone matrix has its own seat, and the guards job is two parts, so no seat is
# loaded twice as long as another. To add a check, add a line to a lane step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: calendar-unit-tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # What this change can break (scripts/ci-changes.js). A pull request that
    # only touches docs, or Edge Functions no browser suite loads, skips the
    # browser jobs; page code, the build or the shared browser helpers run
    # everything. A push to main or a manual run always runs everything. A
    # skipped job reports success, and `calendar-ci-result` at the bottom is the
    # one check that sums the run up.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.files.outputs.browser }}
      phone: ${{ steps.files.outputs.phone }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-changes.js "$EVENT" "$PR_BASE" "$HEAD"

  staff-phone-rules:
    # Two parts per width, each running its checks three side by side (2026-10-19,
    # session Express; before that four parts per width, 2026-10-17 session Turbo:
    # one job per width took 37 minutes, 28 of them in the state inventory, which
    # runs in four quarters, --shard). Part 1 runs quarters 1 and 3, part 2 quarters
    # 2 and 4, and the other checks are split between them by measured time.
    # test/ci-shards-wired.js checks that nothing is dropped or run twice.
    needs: changes
    if: needs.changes.outputs.phone == 'true'
    runs-on: ubuntu-latest
    # One of the fourteen pull-request runner seats (see the top of this file).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-runner-seat-phone-{0}-{1}', matrix.width, matrix.part) || format('calendar-unit-tests-{0}-staff-phone-rules-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [390, 430]
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build index.html and js/ from src/index/ (build output, not committed)
        uses: ./.github/actions/build-index
      - name: Install the pinned browser harness
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Staff phone checks, three side by side (part 1 of 2)
        if: ${{ matrix.part == 1 }}
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node scripts/ci-lanes.js --lanes=3 <<'LANES'
          Existing staff phone state inventory with overlap and scroll checks (quarter 1 of 4)|node qa/staff-phone-final-pass.js --all-states --widths=${{ matrix.width }} --shard=1/4
          Existing staff phone state inventory with overlap and scroll checks (quarter 3 of 4)|node qa/staff-phone-final-pass.js --all-states --widths=${{ matrix.width }} --shard=3/4
          Phone rules on every staff screen and menu|node qa/staff-phone-rules-browser.js --widths=${{ matrix.width }}
          The same native-icon Tabs grid on every staff phone screen|node qa/staff-phone-tabs-grid.js --widths=${{ matrix.width }}
          Phone client selection, status colours and sheet dismissal|node qa/staff-phone-round-two.js --matrix --widths=${{ matrix.width }}
          Thumb phone Messages list, threads, drafts, composer and unread markers|node qa/staff-phone-messages.js --widths=${{ matrix.width }}
          LANES
      - name: Staff phone checks, three side by side (part 2 of 2)
        if: ${{ matrix.part == 2 }}
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node scripts/ci-lanes.js --lanes=3 <<'LANES'
          Existing staff phone state inventory with overlap and scroll checks (quarter 2 of 4)|node qa/staff-phone-final-pass.js --all-states --widths=${{ matrix.width }} --shard=2/4
          Existing staff phone state inventory with overlap and scroll checks (quarter 4 of 4)|node qa/staff-phone-final-pass.js --all-states --widths=${{ matrix.width }} --shard=4/4
          Every reviewer and admin state with overlap and scroll checks|node docs/syncview-design/tests/kasper-admin-expanded-browser.js --width=${{ matrix.width }}
          Phone responsiveness, refresh continuity and shared segments|node qa/staff-phone-responsiveness.js --widths=${{ matrix.width }}
          Thumb collection grid, detail, menus and native List continuity|node qa/staff-phone-collections.js --widths=${{ matrix.width }}
          Native card design, safe actions and media refresh|node qa/staff-phone-design-browser.js --widths=${{ matrix.width }}
          Thumb phone Workload agenda, queues, filters and native planning|node qa/staff-phone-workload.js --widths=${{ matrix.width }}
          LANES


  unit:
    runs-on: ubuntu-latest
    # One of the fourteen pull-request runner seats (see the top of this file).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-runner-seat-unit-{0}', matrix.shard) || format('calendar-unit-tests-{0}-unit-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    # The expanded classified suite completed close to the ten-minute limit.
    # Keep a bounded margin for runner variance without changing any assertions.
    timeout-minutes: 15
    # Three parts with their own disposable PostgreSQL (2026-10-17, session
    # Turbo): test/run-all.js runs every third suite per part (UNIT_SHARD), so
    # the three together run the whole classified list exactly once.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      F63_REQUIRE_POSTGRES: '1'
      # The artifact projection proof executes the real thumbnail-revision
      # trigger against this same disposable PostgreSQL. Both attach defects it
      # covers are invisible to source-only assertions.
      ARTIFACT_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # truth-sync verifies freshness anchors resolve and are ancestors
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build index.html and js/ from src/index/ (build output, not committed)
        uses: ./.github/actions/build-index
      - name: Check index.html is exactly the assembled src/index/ fragments
        run: npm run check:index
      - name: Run unit suite (test/*.js), one third per part
        env:
          UNIT_SHARD: ${{ matrix.shard }}/3
        run: node test/run-all.js

  identity-exposure:
    # THIS REPOSITORY IS PUBLIC AND THE ROSTER IS IN IT. Measured 2026-09-02:
    # 45 of the 50 identifying terms on the live roster already appear in the
    # tree. This job is the only thing standing between that number and the
    # next one -- it scans what a pull request ADDS (added lines and added file
    # paths) for a client slug or a colleague's full name, and fails on any.
    #
    # WHY IT IS A SEPARATE JOB. The `unit` job above is documented as reaching
    # no live backend, and this needs the roster to know what an identity IS.
    # It reads exactly two columns (clients.slug, team_members.name) with the
    # browser publishable key that already ships in index.html, so it exposes
    # nothing a page load does not. Folding it into `unit` would have quietly
    # falsified that job's own contract.
    #
    # THE JOB NEVER PRINTS WHAT IT MATCHED, in either output mode -- a leak
    # detector whose CI log names the clients has made one more public copy of
    # exactly the thing it exists to bound. It reports counts and file paths.
    #
    # A ROSTER READ THAT FAILS IS NOT A RED BUILD. Exit 2 means the check could
    # not run (network, an outage); only exit 1 means a real finding, and a
    # forked pull request with no network gets exit 2 rather than a false green
    # or a false red. The tree-mode baseline in PRE_FLIP_HEALTH_CHECK.md is the
    # backstop for anything a skipped run would have missed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff scan needs the merge base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build index.html and js/ from src/index/ (build output, not committed)
        uses: ./.github/actions/build-index
      - name: Does this change name a client or a colleague?
        run: |
          set +e
          node scripts/repo-identity-exposure-check.js --diff="origin/${{ github.base_ref }}"
          code=$?
          set -e
          if [[ $code -eq 1 ]]; then
            echo "::error::This change names a client or a colleague. See the file list above — the tool deliberately does not print what it matched; run the same command locally to see it."
            exit 1
          fi
          if [[ $code -eq 3 ]]; then
            echo "::error::identity exposure check could not CLASSIFY the roster (exit 3) — clients.kind returned a value the guard does not know is a person or not. This is not an availability failure: the read worked. Classify it in NON_PERSON_KINDS, or the gate is off for everyone."
            exit 1
          fi
          if [[ $code -ne 0 ]]; then
            echo "::warning::identity exposure check could not run (exit $code) — not a finding, and not a reason to block. The tree-mode baseline in PRE_FLIP_HEALTH_CHECK.md still covers this."
          fi
          exit 0

      # `git diff --check` is the whitespace gate, and .gitattributes makes it
      # blind to every `-text` pinned path -- 98 files on this branch, most of
      # them the exit installer's own executable code. Reproduced 2026-09-16: a
      # CRLF-to-LF flip on a pinned capture passed `git diff --check` with
      # exit 0 and no output. This closes that hole using the same pin list.
      - name: Did a byte-pinned file quietly change its line endings?
        run: |
          set +e
          node scripts/byte-pinned-line-ending-check.js --diff="origin/${{ github.base_ref }}"
          code=$?
          set -e
          if [[ $code -eq 1 ]]; then
            echo "::error::A byte-pinned (.gitattributes -text) file changed its line-ending composition. If the capture was deliberately re-taken, re-run with --accept-recapture=<path> and say so in the PR."
            exit 1
          fi
          if [[ $code -ne 0 ]]; then
            echo "::warning::byte-pinned line-ending check could not run (exit $code) — not a finding."
          fi
          exit 0

  module-check:
    # Phase C step C3 (docs/plans/2026-09-24-modularization-c3-plan.md). Proves
    # the src/index/ script fragments can be converted to ES modules one at a
    # time: each parses on its own, the assembled script parses as a module, no
    # new duplicate top-level name, and no code running at load uses a name a
    # later fragment declares. A separate job because it needs the acorn
    # parser and the `unit` job is dependency-free. package.json is
    # content-pinned (F27 closure, leave-evidence fingerprint), so acorn is
    # installed into a temp prefix at an exact version and never declared.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --against reads the base commit's index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build index.html and js/ from src/index/ (build output, not committed)
        uses: ./.github/actions/build-index
      - name: Install the parser and scope analyser into a temp prefix (package.json untouched)
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/c3" acorn@8.15.0 eslint-scope@9.1.2
      - name: Module readiness checks
        env:
          NODE_PATH: ${{ runner.temp }}/c3/node_modules
        run: node scripts/check-modules.js --report
      # On-demand loading safety nets (docs/plans/2026-09-28-load-per-tab-plan.md):
      # the approve path stays in core, and no new button or typeof guard may
      # reach into another on-demand area without being recorded.
      - name: On-demand loading safety nets
        env:
          NODE_PATH: ${{ runner.temp }}/c3/node_modules
        run: node scripts/check-lazy-safety.js
      # An annotate-only step (imports/exports added, nothing moved) must leave
      # the served page byte-identical to the base branch. check:index cannot
      # prove that: it compares the build with the working tree and HEAD, and
      # the PR commits the regenerated page. Opt in with the label.
      - name: Served page is byte-identical to the base branch (label annotate-only)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'annotate-only')
        env:
          NODE_PATH: ${{ runner.temp }}/c3/node_modules
        run: node scripts/check-modules.js --against="origin/${{ github.base_ref }}"

  entry-links-boot:
    # Every signed-out special entry link (?intake=1, ?onboarding=1,
    # ?onboarding=ai, #smm-weekly-report) must reach its own screen in a real
    # browser. On 2026-09-24 ?intake=1 hung on its skeleton because boot read a
    # later fragment's `let` before it initialised; moving fragments and making
    # them modules (phase C) changes exactly that load order, so this runs on
    # every pull request. Fully offline: every backend call is answered empty.
    # package.json is content-pinned, so Playwright goes into a temp prefix.
    # 40, not 25: the job grew to about 20 minutes on main by 2026-10-08 as
    # suites were added, so an ordinary slow runner crossed 25 and was cancelled
    # mid-suite with nothing failing (three times that day).
    #
    # Split into parallel parts (2026-10-17, session Turbo): as one job it took 31
    # minutes on a pull request and hit its 40-minute limit on main (cancelled four
    # times on 2026-10-16). Three parts since 2026-10-19 (session Express), each
    # running its suites three side by side (scripts/ci-lanes.js). Every suite runs
    # in exactly one part, chosen from measured times so the parts finish together;
    # test/ci-shards-wired.js fails if a suite has no part or a part is missing.
    # A suite runs even after an earlier one in its part failed, so one red run
    # names every broken suite.
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    # One of the fourteen pull-request runner seats (see the top of this file).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-runner-seat-entry-{0}', matrix.part) || format('calendar-unit-tests-{0}-entry-links-boot-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build index.html and js/ from src/index/ (build output, not committed)
        uses: ./.github/actions/build-index
      - name: Install Playwright into a temp prefix (package.json untouched)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Entry link and client browser checks, three side by side (part 1 of 3)
        if: ${{ matrix.part == 1 }}
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node scripts/ci-lanes.js --lanes=3 <<'LANES'
          Watch here viewer (Calendar card, SMM and Kasper review, desktop and phone, no button for clients)|node test/frameio-viewer-browser.js
          Client review link works on phones (approve + request change)|node docs/syncview-design/tests/client-phone-review-browser.js
          Kasper Clients profile shows onboarding checklist, resources and HubSpot state to admins only|node docs/syncview-design/tests/clients-onboarding-browser.js
          The boot flags read, the review switch read and the roster Sheets read retry once (mocked)|node test/boot-reads-retry-browser.js
          A note shows the moment it is sent and is never lost (slow server, error then retry, double click, refresh mid-send; desktop and phone) (mocked)|node docs/syncview-design/tests/note-send-outbox-browser.js
          A Calendar Retry sends the status the person chose (mocked)|node docs/syncview-design/tests/lost-work-retry-intent-browser.js
          Client Calendar Expanded layout, sections and dialogs|node docs/syncview-design/tests/client-calendar-expanded-browser.js
          TikTok queue poll backs off when quiet and resumes on a change|node test/tiktok-poll-backoff-browser.js
          Caption prompts read and save guard (table read, fallback, pause switch)|node test/caption-prompts-guard-browser.js
          Client approve and request-changes requests are unchanged|node test/client-review-requests-unchanged-browser.js
          A client link made with tab=review opens on the Review view (Calendar and Samples)|node docs/syncview-design/tests/client-link-review-tab-browser.js
          Notify client button and confirm box (Calendar and Samples, desktop and phone)|node docs/syncview-design/tests/notify-client-browser.js
          Client approve and request-changes always save through the function|node test/calendar-client-approve-function-browser.js
          Sheet loading skeleton has the loaded Sheet's shape (desktop light and dark, phone, first paint)|node test/calendar-sheet-skeleton-shape-browser.js
          Samples Sheet and Review loading skeletons have the loaded shape (desktop light and dark)|node test/samples-sheet-skeleton-shape-browser.js
          A click on a pop-up's backdrop never falls through to the page underneath|node docs/syncview-design/tests/backdrop-press-fallthrough-browser.js
          Messages chat day dividers follow the reader's day and read as dates|node docs/syncview-design/tests/messages-day-divider-browser.js
          Messages New and All switch, what counts as new, live badge (mocked)|node docs/syncview-design/tests/messages-new-view-browser.js
          Notes composer (comment / client / request change) and folding threads (mocked)|node docs/syncview-design/tests/notes-composer-threads-browser.js
          Calendar card "No video linked" warning stays clear of the button pile|node docs/syncview-design/tests/calendar-warn-pile-overlap-browser.js
          Templates client page shows the client's social links|node docs/syncview-design/tests/templates-social-links-browser.js
          Desktop parity read snapshots retain the write refusal|node docs/syncview-design/tests/desktop-parity-relay.js
          LANES
      - name: Entry link and client browser checks, three side by side (part 2 of 3)
        if: ${{ matrix.part == 2 }}
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node scripts/ci-lanes.js --lanes=3 <<'LANES'
          Every pop-up closes the same way (Escape, outside click, focus return, kept text, refresh)|node docs/syncview-design/tests/popup-behaviour-browser.js
          Typed captions, notes, comments and descriptions survive a closed tab or a failed save (mocked)|node docs/syncview-design/tests/lost-work-drafts-browser.js
          A background Calendar refresh keeps the card in view in place on every view|node docs/syncview-design/tests/calendar-refresh-scroll-browser.js
          Kasper Clients "New client" previews, creates and stays admin-only|node docs/syncview-design/tests/clients-create-browser.js
          Every pop-up closes the same way, part two (SyncLinear, Kasper, Workload, Analytics)|node docs/syncview-design/tests/popup-behaviour-areas-browser.js
          Split load, opt-out and on-demand areas (browser)|node docs/syncview-design/tests/split-load-browser.js
          Every button's code exists (staff tabs, entry links, client link)|node docs/syncview-design/tests/inline-handlers-browser.js
          Client link Analytics reads the database behind its flag, Sheets as fallback|node docs/syncview-design/tests/analytics-mirror-read-browser.js
          Expanded staff Calendar phone states in both themes|node docs/syncview-design/tests/staff-calendar-expanded-browser.js
          Samples write guard (fresh flag read, hold, pause, zero n8n)|node test/samples-write-guard-browser.js
          Client link Sheet loading skeleton has the client Sheet's shape (desktop and phone)|node test/client-sheet-skeleton-shape-browser.js
          A second status pick while the first is still saving reaches production-write (mocked)|node docs/syncview-design/tests/cal-status-pick-during-save-browser.js
          Samples keeps the caret in the same box across a hide and return|node docs/syncview-design/tests/sxr-focus-return-browser.js
          Creatives open on their own work in Workload and SyncLinear|node docs/syncview-design/tests/smart-defaults-browser.js
          Expanded staff Selection and Samples phone states|node docs/syncview-design/tests/staff-selection-samples-browser.js
          Calendar work item hover card and per-card files menu|node docs/syncview-design/tests/calendar-hover-files-browser.js
          Samples client approve and request-changes always save through the function|node test/samples-client-approve-function-browser.js
          Top bar keeps flat tabs on a page with no tab of its own (Messages)|node docs/syncview-design/tests/header-nav-no-active-tab-browser.js
          Entry links reach their screens|node docs/syncview-design/tests/entry-links-boot-browser.js
          A reply under an old round-0 comment saves with no round, never a 500 (mocked)|node docs/syncview-design/tests/comment-round-zero-browser.js
          Calendar status filter (Show only / Hide) on desktop and phone|node docs/syncview-design/tests/calendar-card-status-filter-browser.js
          Instagram Calendar cover stays with the client it was picked for|node test/instagram-cover-client-switch-browser.js
          The client link shows staff notes as the team and never receives a staff name (mocked)|node docs/syncview-design/tests/note-author-client-browser.js
          LANES
      - name: Entry link and client browser checks, three side by side (part 3 of 3)
        if: ${{ matrix.part == 3 }}
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node scripts/ci-lanes.js --lanes=3 <<'LANES'
          Caption helper (call to action, platform, note, title ideas, hashtags, redo; desktop and phone, light and dark)|node test/caption-helper-browser.js
          Two people on one Calendar card get a notice, not an overwrite (mocked)|node docs/syncview-design/tests/lost-work-conflict-browser.js
          One shared client follows the client tabs; team tabs and client links ignore it|node docs/syncview-design/tests/shared-client-browser.js
          Urgent ping uses the stamp the database holds, and a refused ping can be refreshed|node docs/syncview-design/tests/urgent-ping-fresh-round-browser.js
