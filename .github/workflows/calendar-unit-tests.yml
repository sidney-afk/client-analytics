name: Calendar unit tests

# Fast, dependency-free logic/wiring checks (test/*.js). Most are hermetic
# source/logic checks; database lanes, including native Workload, use only the
# disposable PostgreSQL 16 service. No test reaches a live backend or browser.
# `push` is restricted to main ON PURPOSE. With `branches: ['**']` a commit on
# an open pull request's branch matched BOTH triggers and ran this suite twice
# on the same source. Measured on fc068d15 (2026-08-26): run #3499 (push) passed
# and run #3500 (pull_request) failed — the second run's two jobs never left
# `queued`, so the red mark on that pull request carried no information about
# the code at all. Two runs of identical source doubled the cost and doubled the
# exposure to that. The pull_request trigger covers every branch under review;
# the push trigger covers what actually lands. See docs/ops/CI_GATE_AUDIT.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    # Bound the full suite plus required disposable SQL rehearsals. The expanded
    # local integration already exceeds ten minutes; individual SQL calls also
    # retain their shorter process/query timeouts. No retry or failure bypass.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      F63_REQUIRE_POSTGRES: '1'
      # The artifact projection proof executes the real thumbnail-revision
      # trigger against this same disposable PostgreSQL. Both attach defects it
      # covers are invisible to source-only assertions.
      ARTIFACT_REQUIRE_POSTGRES: '1'
      # Explicitly opt the discovered Calendar recovery integration proof into
      # this disposable service; its wrapper refuses an unbound CI invocation.
      CALENDAR_RECOVERY_INTEGRATED: LOCAL_DISPOSABLE_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # truth-sync verifies freshness anchors resolve and are ancestors
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit suite (test/*.js)
        run: node test/run-all.js
      - name: Install PostgreSQL snapshot client for history proof
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Rehearse private card history in disposable PostgreSQL
        env:
          CARD_HISTORY_TEST_CONFIRM: LOCAL_DISPOSABLE_ONLY
          CARD_HISTORY_PGHOST: 127.0.0.1
          CARD_HISTORY_PGPORT: '5432'
          CARD_HISTORY_PGUSER: postgres
          CARD_HISTORY_PGPASSWORD: postgres
        run: node scripts/card-change-journal-rehearsal.js
      - name: Read pinned unmerged manifest prerequisite for local history backup proof
        shell: bash
        run: |
          git fetch --no-tags origin 5418ab5618595d9469f0527bd94623e9229a637e
          git show 5418ab5618595d9469f0527bd94623e9229a637e:migrations/2026-09-05-native-intake-root-manifest.sql > "$RUNNER_TEMP/card-history-manifest.sql"
      - name: Prove full private history corpus in disposable PostgreSQL
        env:
          CARD_HISTORY_TEST_CONFIRM: LOCAL_DISPOSABLE_ONLY
          CARD_HISTORY_PGHOST: 127.0.0.1
          CARD_HISTORY_PGPORT: '5432'
          CARD_HISTORY_PGUSER: postgres
          CARD_HISTORY_PGPASSWORD: postgres
          CARD_HISTORY_MANIFEST_SQL: ${{ runner.temp }}/card-history-manifest.sql
        run: node scripts/card-history-backup-rehearsal.js
      - name: Prove closed history corpus against real dependency DDL locally
        env:
          CARD_HISTORY_TEST_CONFIRM: LOCAL_DISPOSABLE_ONLY
          CARD_HISTORY_PGHOST: 127.0.0.1
          CARD_HISTORY_PGPORT: '5432'
          CARD_HISTORY_PGUSER: postgres
          CARD_HISTORY_PGPASSWORD: postgres
          CARD_HISTORY_MANIFEST_SQL: ${{ runner.temp }}/card-history-manifest.sql
        run: node scripts/card-history-closed-corpus-rehearsal.js
      - name: Restore native Workload plans with combined recording and recovery tables
        env:
          CARD_HISTORY_TEST_CONFIRM: LOCAL_DISPOSABLE_ONLY
          CARD_HISTORY_PGHOST: 127.0.0.1
          CARD_HISTORY_PGPORT: '5432'
          CARD_HISTORY_PGUSER: postgres
          CARD_HISTORY_PGPASSWORD: postgres
          CARD_HISTORY_PSQL: /usr/lib/postgresql/17/bin/psql
          CARD_HISTORY_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
          CARD_HISTORY_WORKLOAD_OUTPUT: ${{ runner.temp }}/workload-history-private
        run: node test/workload-history-integrated.js
      - name: Prove native Workload snapshot and plan aliases against disposable SQL
        env:
          WORKLOAD_TEST_REQUIRE: '1'
          WORKLOAD_TEST_CONFIRM: LOCAL_DISPOSABLE_ONLY
          WORKLOAD_TEST_PORT: '5432'
          # Synthetic credential for this job's existing loopback service only.
          WORKLOAD_TEST_PASSWORD: postgres
        run: |
          set -euo pipefail
          workload_psql="$(command -v psql)"
          test -x "$workload_psql"
          WORKLOAD_TEST_PSQL="$workload_psql" node test/workload-native-postgres.js

  identity-exposure:
    # THIS REPOSITORY IS PUBLIC AND THE ROSTER IS IN IT. Measured 2026-09-02:
    # 45 of the 50 identifying terms on the live roster already appear in the
    # tree. This job is the only thing standing between that number and the
    # next one -- it scans what a pull request ADDS (added lines and added file
    # paths) for a client slug or a colleague's full name, and fails on any.
    #
    # WHY IT IS A SEPARATE JOB. The `unit` job above is documented as reaching
    # no live backend, and this needs the roster to know what an identity IS.
    # It reads exactly two columns (clients.slug, team_members.name) with the
    # browser publishable key that already ships in index.html, so it exposes
    # nothing a page load does not. Folding it into `unit` would have quietly
    # falsified that job's own contract.
    #
    # THE JOB NEVER PRINTS WHAT IT MATCHED, in either output mode -- a leak
    # detector whose CI log names the clients has made one more public copy of
    # exactly the thing it exists to bound. It reports counts and file paths.
    #
    # A ROSTER READ THAT FAILS IS NOT A RED BUILD. Exit 2 means the check could
    # not run (network, an outage); only exit 1 means a real finding, and a
    # forked pull request with no network gets exit 2 rather than a false green
    # or a false red. The tree-mode baseline in PRE_FLIP_HEALTH_CHECK.md is the
    # backstop for anything a skipped run would have missed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff scan needs the merge base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Does this change name a client or a colleague?
        run: |
          set +e
          node scripts/repo-identity-exposure-check.js --diff="origin/${{ github.base_ref }}"
          code=$?
          set -e
          if [[ $code -eq 1 ]]; then
            echo "::error::This change names a client or a colleague. See the file list above — the tool deliberately does not print what it matched; run the same command locally to see it."
            exit 1
          fi
          if [[ $code -eq 3 ]]; then
            echo "::error::identity exposure check could not CLASSIFY the roster (exit 3) — clients.kind returned a value the guard does not know is a person or not. This is not an availability failure: the read worked. Classify it in NON_PERSON_KINDS, or the gate is off for everyone."
            exit 1
          fi
          if [[ $code -ne 0 ]]; then
            echo "::warning::identity exposure check could not run (exit $code) — not a finding, and not a reason to block. The tree-mode baseline in PRE_FLIP_HEALTH_CHECK.md still covers this."
          fi
          exit 0

  f27-team-rollback-proof:
    if: contains(github.event.head_commit.message || '', 'F27') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Detect F27 proof source
        id: source
        run: |
          if [[ -f scripts/f27-team-rollback-proof.sql ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run isolated TEST transaction
        if: steps.source.outputs.present == 'true'
        run: |
          set -o pipefail
          mkdir -p f27-proof
          psql -X -v ON_ERROR_STOP=1 -f scripts/f27-team-rollback-proof.sql | tee f27-proof/terminal.txt
          sha256sum f27-proof/terminal.txt | tee f27-proof/terminal.sha256
      - name: Outside-n8n terminal observer
        if: steps.source.outputs.present == 'true'
        run: |
          grep -q "F27_PROOF_OK" f27-proof/terminal.txt
          {
            echo "## F27 isolated TEST proof"
            echo
            echo "- observer: GitHub Actions (outside n8n)"
            echo "- terminal: F27_PROOF_OK"
            echo "- receipt hash: $(cut -d' ' -f1 f27-proof/terminal.sha256)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.present == 'true'
        with:
          name: f27-team-rollback-proof
          path: f27-proof/
          retention-days: 30
