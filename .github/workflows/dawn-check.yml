name: Dawn check (weekday mornings)

# The morning check (skill: /dawn-check, script: qa/dawn/dawn-check.js).
# Drives the REAL index.html in headless Chromium against the LIVE backend on
# the test client `sidneylaruel` only: client approve, client request changes,
# staff card save, card rename (sub-issue follows, then restored), and the
# Workload / SyncLinear / Analytics open times against the 2026-09-23 speed
# map. Every seed is archived and verified; the rename is put back.
on:
  schedule:
    - cron: '30 11 * * 1-5'   # 11:30 UTC Mon-Fri = 07:30 New York (EDT) / 06:30 (EST)
  workflow_dispatch:

concurrency:
  group: dawn-check
  cancel-in-progress: false

jobs:
  dawn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the dawn check (serves app, scoped to sidneylaruel)
        env:
          SXR_COURIER: '0'
          SYNCVIEW_STAFF_KEY: ${{ secrets.SYNCVIEW_STAFF_KEY }}
          # Optional staff ROLE key: role-gated reads (Workload) refuse the key above.
          SYNCVIEW_ROLE_KEY: ${{ secrets.SYNCVIEW_ROLE_KEY }}
        run: node qa/dawn/dawn-check.js
      - name: Publish the report to the run summary
        if: always()
        run: cat qa/dawn/out/DAWN_REPORT.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report written." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dawn-check-${{ github.run_id }}
          path: qa/dawn/out/
          retention-days: 14
      - name: Page the SyncView Bot on scheduled failure
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
        run: |
          if [ -z "$SLACK_ALERT_WEBHOOK" ]; then echo "::warning::SLACK_ALERT_WEBHOOK not configured."; exit 0; fi
          curl -sS -X POST -H 'Content-Type: application/json' --data \
            "{\"text\":\"[SyncView dawn check] ❌ A morning flow failed on the test client. Report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_ALERT_WEBHOOK"
