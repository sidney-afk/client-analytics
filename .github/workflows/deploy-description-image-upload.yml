name: Deploy description image upload

# Auto-deploys the description-image-upload Edge Function on main. It is a
# brand-new function outside the F27 Section 4 closure set, so no sealed
# capture is owed: the first deploy creates it, later ones replace it. The
# storage bucket and ledger table it writes come from
# migrations/2026-09-05-description-images.sql, which the owner applies in
# the SQL Editor before (or right after) the first deploy; until the
# migration is applied the function answers 503 and the browser leaves the
# description unchanged.
# The Actions token stays in the managed secret store, never here.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/description-image-upload/**'
      - 'supabase/functions/_shared/staff-role-auth.ts'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-description-image-upload.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let an older checkout finish after and overwrite a newer deploy.
concurrency:
  group: deploy-description-image-upload
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uzltbbrjidmjwwfakwve
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Verify deploy credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Deploy description-image-upload
        shell: bash
        run: |
          echo "Deploying description-image-upload…"
          supabase functions deploy description-image-upload --project-ref "$PROJECT_REF" --no-verify-jwt
