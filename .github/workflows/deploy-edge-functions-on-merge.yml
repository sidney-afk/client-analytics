name: Deploy Edge Functions on merge
run-name: ${{ github.workflow }} (${{ github.event_name == 'workflow_dispatch' && 'manual' || 'merge' }} ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }})

# Every Edge Function whose folder, or anything it imports, changed in a merge
# to main goes live automatically, in the required order, with the same safety
# the manual lanes use. Runbook: docs/ops/EF_AUTO_DEPLOY.md. Policy (what is
# held, what stays manual, the order): scripts/ef-auto-deploy-plan.js.
#
# RELEASE ORDER IS LOAD-BEARING, exactly as in deploy-onboarding-edge-functions.yml:
#   1. Validate FIRST from the trusted default branch, with no secret in scope
#      and no script of the requested commit run: the commit must be on main.
#   2. Only then check that commit out. The plan runs with no secret.
#   3. The gate reads live state (read only): drift guard, the database
#      readbacks the manual lanes run, migration probes. Token in that step only.
#   4. Deploy in order, verify_jwt off (every attested function is JWT-off and
#      authenticates itself), one function at a time; stop at the first failure.
#      production-write, deliverable-write and batch-write are NEVER deployed by
#      this job: it dispatches the Section 4 lane, which seals the live source
#      into its rollback bundle, deploys and attests, and waits for it.
#   5. Attest every function deployed here against the commit (fingerprint and
#      verify_jwt=false). No always(): no attestation after a failed gate.
#   6. Report in the run summary, and page the owner relay when anything failed
#      or is held.
# The job runs in the `production` Environment, so a branch copy of this file
# cannot reach the production secret.
#
# A merge that adds a migration file holds its functions until the migration is
# applied (unless the file says the functions cope without it, or says how to
# tell it is applied; see the runbook). Then run this workflow by hand:
# commit_sha = that merge, migrations_applied = true.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'migrations/**'
      - 'supabase/migrations/**'
      - 'scripts/ef-auto-deploy-plan.js'
      - 'scripts/ef-fingerprint.js'
      - '.github/workflows/deploy-edge-functions-on-merge.yml'
      - '.github/workflows/deploy-f27-section4-closures.yml'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA on main to deploy (normally the merge that was held)
        required: true
        type: string
      functions:
        description: 'Optional: comma-separated functions to deploy. Empty = the ones that merge changed'
        required: false
        type: string
        default: ''
      migrations_applied:
        description: 'The migration(s) that merge added are applied and read back'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # dispatch and watch the Section 4 lane; read earlier runs of this lane

# One at a time, never cancelled midway. GitHub keeps only the newest pending
# run, so the plan starts from the last run that really ran (see "Validate"),
# never only from the push's own `before`: nothing a skipped run held is lost.
concurrency:
  group: deploy-edge-functions-on-merge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    env:
      PROJECT_REF: uzltbbrjidmjwwfakwve
      DEPLOY_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
    steps:
      - name: Check out the trusted default branch for validation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the commit is on main and find where this run starts
        id: range
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be one exact 40-character lowercase SHA"
            exit 1
          fi
          git fetch -q origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$DEPLOY_COMMIT" origin/main; then
            echo "::error::The commit is not on origin/main"
            exit 1
          fi
          if ! git cat-file -e "$DEPLOY_COMMIT:scripts/ef-fingerprint.js" 2>/dev/null \
            || ! git cat-file -e "$DEPLOY_COMMIT:scripts/ef-auto-deploy-plan.js" 2>/dev/null; then
            echo "::error::The commit predates the fingerprint attestor or the auto-deploy plan"
            exit 1
          fi
          base=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            base="$(git rev-parse "$DEPLOY_COMMIT^1")"
          else
            # The head of the newest earlier merge run of this lane that ran to
            # an end (success or failure); a cancelled or skipped run deployed
            # nothing, so its changes are still ahead of that point.
            prev="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-edge-functions-on-merge.yml/runs?branch=main&event=push&status=completed&per_page=30" \
              --jq '[.workflow_runs[] | select(.id != '"$GITHUB_RUN_ID"') | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""' 2>/dev/null || true)"
            if [[ "$prev" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$prev" "$DEPLOY_COMMIT" && [ "$prev" != "$DEPLOY_COMMIT" ]; then
              base="$prev"
            elif [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              base="$PUSH_BEFORE"
              echo "::warning::No earlier finished run of this lane was found; planning from the push's own before ($PUSH_BEFORE)."
            else
              base="$(git rev-parse "$DEPLOY_COMMIT^1")"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          {
            echo "## Edge Functions on merge"
            echo
            echo "- Commit (on main): \`$DEPLOY_COMMIT\`"
            echo "- Changes counted since: \`$base\`"
            echo "- Started by: \`$GITHUB_EVENT_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Plan (no secret)
        id: plan
        shell: bash
        env:
          BASE: ${{ steps.range.outputs.base }}
          CHOSEN: ${{ github.event_name == 'workflow_dispatch' && inputs.functions || '' }}
          APPLIED: ${{ github.event_name == 'workflow_dispatch' && inputs.migrations_applied || false }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT"
          dir="$RUNNER_TEMP/ef-auto"; mkdir -p "$dir"
          args=(plan "--base=$BASE" "--head=$DEPLOY_COMMIT" "--out=$dir/plan.json")
          if [ -n "$CHOSEN" ]; then
            if ! [[ "$CHOSEN" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then echo "::error::functions must be a comma-separated list of function names"; exit 1; fi
            args+=("--functions=$CHOSEN")
          fi
          if [ "$APPLIED" = "true" ]; then args+=(--migrations-applied); fi
          node scripts/ef-auto-deploy-plan.js "${args[@]}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "any=$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.functions.length?"true":"false")' "$dir/plan.json")" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.plan.outputs.any == 'true'
        with:
          version: latest

      - name: Gate on live state (read only)
        if: steps.plan.outputs.any == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PTO_SCHEMA_CONTRACT: ${{ vars.PTO_SCHEMA_CONTRACT }}
          DIR: ${{ steps.plan.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in the production Environment."
            exit 1
          fi
          extra=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then extra+=(--dispatch); fi
          node scripts/ef-auto-deploy-plan.js gate "--plan=$DIR/plan.json" "--out=$DIR/final.json" "${extra[@]}"
          node scripts/ef-auto-deploy-plan.js units "--plan=$DIR/final.json" > "$DIR/units.txt"
          echo "Deploy order: $(tr '\n' ' ' < "$DIR/units.txt")"

      - name: Deploy in order (functions one by one; the Section 4 three through their own lane)
        id: deploy_units
        if: steps.plan.outputs.any == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ steps.plan.outputs.dir }}
        run: |
          set -uo pipefail
          echo '{}' > "$DIR/results.json"
          record() { node -e 'const f=process.argv[1],r=require(f);r[process.argv[2]]=process.argv[3];require("fs").writeFileSync(f,JSON.stringify(r))' "$DIR/results.json" "$1" "$2"; }
          deployed=()
          while IFS= read -r unit; do
            [ -n "$unit" ] || continue
            case "$unit" in
              production-write|deliverable-write|batch-write|calendar-upsert|sample-review-upsert|linear-inbound|linear-outbound|client-token-verify)
                # Defense in depth: the plan never lists these as units.
                echo "::error::Refused: $unit is never deployed by this job"
                record "$unit" refused; exit 1 ;;
              @f27-section4)
                if ! bash scripts/ef-auto-deploy-f27.sh; then record "$unit" failed; exit 1; fi
                record "$unit" released ;;
              *)
                echo "Deploying $unit..."
                # --use-api: bundled on Supabase's side (no image pull from
                # ghcr.io, whose rate limit failed deploy-single-function twice).
                # The attestation below still proves live source == committed bytes.
                if ! supabase functions deploy "$unit" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api; then
                  echo "::error::Deploying $unit failed; nothing after it in the order was deployed."
                  record "$unit" failed; exit 1
                fi
                record "$unit" deployed
                deployed+=("$unit") ;;
            esac
          done < "$DIR/units.txt"
          (IFS=,; echo "deployed=${deployed[*]:-}" >> "$GITHUB_OUTPUT")

      - name: Attest every function this job deployed
        # No always(): an attestation is produced only after the gate and every deploy passed.
        if: steps.plan.outputs.any == 'true' && steps.deploy_units.outputs.deployed != ''
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEPLOYED: ${{ steps.deploy_units.outputs.deployed }}
        run: |
          set -euo pipefail
          receipt="$(node scripts/ef-fingerprint.js "$DEPLOY_COMMIT" --slugs="$DEPLOYED" --format=json)"
          node -e 'const r=JSON.parse(process.argv[1]);const want=process.env.DEPLOYED.split(",");if(r.pinned_sha!==process.env.DEPLOY_COMMIT||r.results.length!==want.length||r.results.some(x=>!want.includes(x.slug)||x.result!=="PASS"||x.verify_jwt!==false))process.exit(1)' "$receipt"
          node scripts/ef-fingerprint.js "$DEPLOY_COMMIT" --slugs="$DEPLOYED" --format=markdown >> "$GITHUB_STEP_SUMMARY"
          echo "- Live source and JWT posture of $DEPLOYED: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Report, and page the owner relay when something failed or waits
        if: always() && steps.plan.outputs.dir != ''
        shell: bash
        env:
          DIR: ${{ steps.plan.outputs.dir }}
          JOB_STATUS: ${{ job.status }}
          SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -uo pipefail
          plan="$DIR/final.json"; [ -f "$plan" ] || plan="$DIR/plan.json"
          node scripts/ef-auto-deploy-plan.js summary "--plan=$plan" "--results=$DIR/results.json" >> "$GITHUB_STEP_SUMMARY"
          node scripts/ef-auto-deploy-plan.js summary "--plan=$plan" "--results=$DIR/results.json" --exit-code > /dev/null; waits=$?
          node -e 'const p=require(process.argv[1]);for(const r of p.functions.filter(r=>r.decision==="manual"))console.log(`::warning::${r.slug} changed but is manual only: ${r.reason}`)' "$plan"
          if [ "$JOB_STATUS" != "success" ] || [ "$waits" != 0 ]; then
            node scripts/ef-auto-deploy-notice.js "--plan=$plan" "--results=$DIR/results.json" "--job-status=$JOB_STATUS" || echo "::warning::The owner relay page could not be sent; the red run is the notice."
          fi
          # A held function is merged but NOT live: that waits on a person, so the run is red.
          if [ "$waits" != 0 ]; then
            echo "::error::At least one changed Edge Function is not live (held or failed). The table in the summary says why and how to release it."
            exit 1
          fi
