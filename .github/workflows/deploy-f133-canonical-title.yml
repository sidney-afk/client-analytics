            || !/^[0-9]+$/.test(String(priorRow.captured_version))
            || Number(row.version) <= Number(priorRow.captured_version)) throw new Error(`${slug} exact provider readback mismatch`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- \`${slug}\` deploy/readback: PASS; prior version \`${priorRow.captured_version}\`; active version \`${row.version}\`; source \`${row.live_fingerprint}\`; entrypoint/JWT/status: PASS\n`);
          NODE

