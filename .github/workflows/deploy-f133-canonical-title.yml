      - name: Restore and verify exactly three in reverse dependency order
        if: inputs.operation == 'restore-captured-prior-three'
        shell: bash
        working-directory: operator
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Supabase token absent"; exit 1; fi
          export PROJECT_REF="$F133_PROJECT_REF"
          node - "$F133_PRIOR_THREE_BUNDLE" "$ROLLBACK_BUNDLE_SHA256" \
            > "$F133_PRIVATE_DIR/restore-receipt.json" \
            2> "$F133_PRIVATE_DIR/restore-error.log" <<'NODE'
          const fs = require('fs');
          const { loadCapture, restoreFunctions } = require('./scripts/f27-edge-source-rollback-lib.js');
          const { createAdapter } = require('./scripts/f27-edge-source-rollback-supabase-adapter.js');
          const [bundle, expectedHash] = process.argv.slice(2);
          const capture = loadCapture(bundle, { expectedBundleSha256: expectedHash });
          const bySlug = new Map(capture.functions.map(item => [item.slug, item]));
          if (capture.functions.length !== 3 || bySlug.size !== 3
            || !bySlug.has('linear-inbound') || !bySlug.has('linear-outbound') || !bySlug.has('production-write')) {
            throw new Error('sealed restore set is not exactly the reviewed F133 three');
          }
          const adapter = createAdapter();
          async function restoreExact(slug) {
            const result = await restoreFunctions({
              adapter,
              capture: { ...capture, functions: [bySlug.get(slug)] },
              expectedBundleSha256: expectedHash,
            });
            const row = (result.functions || [])[0] || {};
            if (result.result !== 'PASS' || result.operation !== 'restore'
              || result.function_count !== 1 || result.deployed_source_readback !== 'PASS'
              || result.sealed_bundle_sha256 !== expectedHash || row.slug !== slug
              || row.deployed_source_readback !== 'PASS' || !/^[0-9]+$/.test(String(row.restored_active_version))
              || typeof row.verify_jwt !== 'boolean'
              || row.source_closure_sha256 !== bySlug.get(slug).manifest.source_closure_sha256
              || row.entrypoint_sha256 !== require('crypto').createHash('sha256')
                .update(bySlug.get(slug).manifest.entrypoint_path, 'utf8').digest('hex')) {
              throw new Error(`${slug} exact restore/readback mismatch`);
            }
            return row;
          }
          (async () => {
            // Fixed reverse-dependency order. Each awaited call deploys and
            // independently reads back before the next function can start.
            const inbound = await restoreExact('linear-inbound');
            const production = await restoreExact('production-write');
            const outbound = await restoreExact('linear-outbound');
            process.stdout.write(JSON.stringify({
              result: 'PASS', operation: 'restore-captured-prior-three',
              sealed_bundle_sha256: expectedHash,
              restore_order: ['linear-inbound', 'production-write', 'linear-outbound'],
              functions: [inbound, production, outbound],
            }));
          })().catch(error => { process.stderr.write(String(error && error.message || error)); process.exitCode = 1; });
          NODE
          node - "$F133_PRIVATE_DIR/restore-receipt.json" <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = ['linear-inbound', 'production-write', 'linear-outbound'];
          const rows = Array.isArray(receipt.functions) ? receipt.functions : [];
          if (receipt.result !== 'PASS' || receipt.operation !== 'restore-captured-prior-three'
            || receipt.sealed_bundle_sha256 !== process.env.ROLLBACK_BUNDLE_SHA256
            || JSON.stringify(receipt.restore_order) !== JSON.stringify(expected)
            || rows.length !== 3 || rows.some((row, i) => row.slug !== expected[i]
              || row.deployed_source_readback !== 'PASS')) {
            throw new Error('F133 exact-three restore receipt mismatch');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '- Exact prior-three restore/readback: PASS',
            '- Restore order: `linear-inbound` -> `production-write` -> `linear-outbound`',
            ...rows.map(row => `- Restored \`${row.slug}\`: prior version \`${row.captured_version}\`, active version \`${row.restored_active_version}\`, source \`${row.source_closure_sha256}\`, entrypoint \`${row.entrypoint_sha256}\`, JWT \`verify_jwt=${row.verify_jwt}\``),
            '',
          ].join('\n'));
          NODE

      - name: Delete private source and raw receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${F133_PRIVATE_DIR:-}" ]; then exit 0; fi
          case "$F133_PRIVATE_DIR" in
            "$RUNNER_TEMP"/f133-closures.*) rm -rf -- "$F133_PRIVATE_DIR" ;;
            *) echo "::error::Refusing cleanup outside the bounded F133 temporary directory"; exit 1 ;;
          esac
