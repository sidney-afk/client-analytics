            "$F133_PRIVATE_DIR/linear-outbound-live.json" <<'NODE'
          const crypto = require('crypto'); const fs = require('fs');
          const [slug, priorFile, candidateFile, captureFile, liveFile] = process.argv.slice(2);
          const prior = JSON.parse(fs.readFileSync(priorFile, 'utf8'));
          const candidate = JSON.parse(fs.readFileSync(candidateFile, 'utf8'));
          const capture = JSON.parse(fs.readFileSync(captureFile, 'utf8'));
          const live = JSON.parse(fs.readFileSync(liveFile, 'utf8'));
          const priorRow = (prior.functions || []).find(row => row.slug === slug) || {};
          const expected = candidate.results.find(row => row.slug === slug) || {};
          const captured = (capture.functions || [])[0] || {}; const row = (live.results || [])[0] || {};
