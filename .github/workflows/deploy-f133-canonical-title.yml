            || captured.entrypoint_sha256 !== entryHash || captured.verify_jwt !== false
            || live.mode !== 'live-read-only' || live.results.length !== 1 || row.slug !== slug
            || row.result !== 'PASS' || row.status !== 'ACTIVE' || row.verify_jwt !== false
            || row.live_fingerprint !== expected.expected_fingerprint
            || row.live_entrypoint !== expected.expected_entrypoint || row.entrypoint_match !== true
