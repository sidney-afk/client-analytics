name: Deploy F27 Section 4 closures
run-name: ${{ github.workflow }} (${{ inputs.operation }}${{ inputs.request_id && format(' {0}', inputs.request_id) || '' }})

# This is the reviewed F27 Section 4 forward/restore lane. It never runs on a
# push or pull request and it never deploys linear-inbound, either frozen
# client writer, or the production comment/archive readers. The prior three
# provider-source/JWT captures remain the separate Section 1 pre-DDL step; both
# operations below require that sealed bundle to be present and independently
# verified before any function deployment starts.
#
# THE CAPTURE RUNS HERE (since 2026-10-16). Pass `capture` as both bundle
# inputs and the lane seals the live three into the rollback bundle itself, in
# this run, minutes before it deploys: the same script and format the owner's
# Windows capture used (scripts/f27-edge-source-rollback.js capture), cross-
# checked against an independent live fingerprint read, stored content-
# addressed in the same F27 Shared Drive root with an independent readback
# (scripts/f27-private-snapshot-store.js), and then fetched back and verified
# by exactly the steps below that always verified the owner's upload. The
# sealed SHA-256 and byte length are printed in the run summary: they are the
# two values a later `restore-captured-prior-three` needs. A merge that changes
# these functions dispatches this lane that way from
# deploy-edge-functions-on-merge.yml. A bundle captured elsewhere still works:
# pass its two values instead of `capture`. `capture-only` is the dry run:
# capture, seal, store, fetch back, inspect, and deploy nothing.
#
# B2 Slice 8 (2026-09-24): both the RELEASE set and the PRIOR set are three
# functions (production-write, deliverable-write, batch-write). linear-outbound
# is deleted live (B2 Slice 8, 2026-09-24): it is no longer deployed, verified,
# captured or restored here.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed install release SHA; forward must equal current main
        required: true
        type: string
      operation:
        description: Deploy the reviewed closures or restore the sealed prior three
        required: true
        type: choice
        options:
          - deploy-reviewed-release
          - restore-captured-prior-three
          - capture-only
      confirm:
        description: Exact operation-specific confirmation from the F27 runbook
        required: true
        type: string
      rollback_bundle_sha256:
        description: '`capture` = this run seals the live three itself (deploy and capture-only); or the SHA-256 of a sealed capture (required for restore)'
        required: true
        type: string
        default: capture
      rollback_bundle_byte_length:
        description: '`capture`, or the byte length of that sealed capture'
        required: true
        type: string
        default: capture
      request_id:
        description: 'Optional label shown in the run name (the merge lane uses it to find this run)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: f27-section4-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      BATCH_WRITE_ENTRYPOINT_SHA256: 15a369f856a363f5c2926b3f251b1e154da805d5489d31432d07bfde145e8cf5
      BATCH_WRITE_FILE_COUNT: '2'
      BATCH_WRITE_SOURCE_SHA256: 86f9f187b39e187512886c0d33f4702ce3a766ee0cb4b0777d665917b3d83d6a
      DELIVERABLE_WRITE_ENTRYPOINT_SHA256: 74da8449a9f753a09cdf00326449df31664d18449c866b81923725aa6bad1e68
      DELIVERABLE_WRITE_FILE_COUNT: '2'
      DELIVERABLE_WRITE_SOURCE_SHA256: 78df060b7dd5b611e77b5427d7ab9a6cab1d0a18664f2e15562e098880074575
      DEPLOY_COMMIT: ${{ inputs.commit_sha }}
      EXPECTED_CLI_VERSION: 2.109.0
      # The Edge Runtime image CLI 2.109.0 bundles with under --use-docker (its
      # built-in "edge-runtime" default, pulled from public.ecr.aws with no
      # retry and no mirror). The pre-pull step below proves the installed CLI
      # still names exactly this tag, so a CLI bump that moves it fails closed
      # there; re-derive with:
      #   grep -ao '"edge-runtime":"[0-9][0-9.]*"' "$(command -v supabase)"
      EXPECTED_EDGE_RUNTIME_TAG: v1.73.13
      # Its linux/amd64 image manifest, identical on public.ecr.aws and ghcr.io
      # (read from both registries' v1.73.13 index on 2026-10-16). Pulling by
      # this digest makes either registry give byte-identical bundler bytes.
      EXPECTED_EDGE_RUNTIME_AMD64_DIGEST: sha256:e8ddc7b0f4888818159d4b665e922de667948e2864c895ed62acdfd29e7c6c80
      EXPECTED_F27_SHARED_DRIVE_ROOT_ID_SHA256: 9d1480048b17bcd038650c4d3191e12cb94b65938374ab335b955a9cab2df042
      # linear-outbound pins removed in B2 Slice 8: it is no longer in the release
      # set. Its re-pin history is in git history of this file.
      OPERATION: ${{ inputs.operation }}
      OPERATION_CONFIRMATION: ${{ inputs.confirm }}
      PRODUCTION_WRITE_ENTRYPOINT_SHA256: 7a3136a65709c21c4b07d9b18873f8eb6732766fdd9b5c5c0677a4f69f849de5
      PRODUCTION_WRITE_FILE_COUNT: '10'
      # Re-pinned 2026-08-14 (fifth release): production-write gains the client
      # comment FRONT DOOR — clientCommentFrontDoorTargetAllowed admits
      # calendar-surface and unlinked-samples client comments under the
      # slug/origin/team binding (the real repair behind PR #1064's routing
      # stopgap; frontend routing to it is gated on the
      # client_comment_gateway_enabled runtime flag, flipped only AFTER this
      # deploy). Supersedes the 2026-08-07 fourth release (batch parents
      # declare `status: "todo"`), which superseded 50970ca2 (intake
      # attribution stamp and asset-probe failure reason, 2026-08-05), which
      # superseded b974e809, the native-create key set. The value below was
      # last re-pinned 2026-08-17 for the retired AI thumbnail brief and the
      # Thumbnail child title, and is the closure now live.
      # In the sixth release only linear-outbound moves (see its note above);
      # production-write, batch-write and deliverable-write are byte-identical
      # to the previously reviewed pins and are deployed unchanged so the
      # four-function lane stays a single operation. Regenerate with:
      #   node scripts/ef-fingerprint.js <main-head-sha> \
      #     --slugs=production-write,deliverable-write,batch-write \
      #     --expected-only
      # ENTRYPOINT_SHA256 is sha256 of the entrypoint PATH string, not the file
      # bytes, so it does not move when the source changes.
      #
      # Re-pinned 2026-08-19 (deploy #15): the append route validates the batch
      # parent against the team that OWNS it, not the team asking. One Linear
      # issue serves every team a card has, and the parent map stamps
      # owner_team for exactly this purpose -- validating against the asker
      # refused every thumbnail append to a batch whose only parent is a video
      # issue. Supersedes 07664530 (deploy #14, the append planner/modes).
      # Re-pinned 2026-08-20 (ninth release): SUBMIT-TAB THUMBNAIL TEXT restored,
      # narrowed. The owner retired the AI graphics brief on 2026-08-17 after it
      # invented art direction about a real client from an EMPTY filming plan;
      # he restored it 2026-08-20 scoped to "when someone submits it through the
      # submit tab", never the parent issue and never a video issue. The
      # unconditional generator is DELETED; submissionThumbnailText replaces it
      # behind eight gates (submit surface only, new batches only, graphics
      # children with no human brief, a server-resolved filming plan, a
      # substantive plan, output grounded in that plan's own words, thumbnail
      # length, and no throw path so it can never fail a submission). The
      # instruction moved out of the GRAPHIC_TITLE_PROMPT secret into the
      # reviewable source, because the retired prompt had silently drifted from
      # short thumbnail titles to art-direction sentences where nobody could see
      # it. File count is unchanged, so the closure membership did not move.
      # Re-pinned 2026-08-24 (thirteenth release): the Create Post editor picker.
      # autoAssigneeForIntake balances on OPEN video work only (todo/in_progress/
      # tweak) rather than every non-duplicate row ever written, and a VIDEO
      # assignee may now be chosen by the caller, validated through the same
      # assertEligibleAssignee as every other assignee write; graphics still
      # refuses an override outright. File count unchanged at 5, so closure
      # membership did not move.
      # Re-pinned 2026-08-27 (seventeenth release): the freest-editor parent
      # read moves from the deliverables table to the browser view, the only
      # relation that actually has raw_issue_parent_id — the table read was a
      # 42703 the by-design degradation swallowed, leaving the sixteenth
      # release's correction silently inert. File count unchanged at 5.
      # Re-pinned 2026-08-31 (eighteenth release): a VIDEO deliverable may carry
      # a canonical artifact. Both artifact guards test one shared ARTIFACT_TEAMS
      # set instead of two hand-written graphics comparisons, the mirrored
      # attachment title names the row's own team, and policy lets a creative
      # attach on their own team — the team match that confines them is
      # untouched, so a designer still cannot write a video row. Requires
      # migrations/2026-08-30-artifact-video-projection.sql, which teaches
      # production_artifact_write to project a video artifact onto
      # calendar_posts.asset_url keyed on video_deliverable_id; without it the
      # widened guards fall through to artifact_card_projection_scope_invalid
      # and every attach rolls back. Applied by the owner 2026-08-30 before this
      # pin. File count unchanged at 5, so closure membership did not move.
      #
      # This pin was MISSED when the source landed (PR #1182): the change shipped
      # to main and test/f27-section4-deploy-lane.js went red on main, because a
      # pinned-closure lane cannot deploy a source it has not reviewed. The lane
      # failing closed is the design working; the miss was not re-pinning in the
      # same commit that moved the closure.
      # Re-pinned 2026-08-31 (nineteenth release): raw footage and the frame
      # folder become editable. New `batch_asset` operation on the batch entity,
      # staff-only, writing footage_folder_url / delivery_folder_url through
