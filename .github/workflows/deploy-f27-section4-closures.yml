          export PROJECT_REF="$project_ref"
          if ! node scripts/f27-edge-source-rollback.js capture \
            --slugs=linear-outbound,production-write,deliverable-write,batch-write \
            --bundle="$F27_PRIVATE_DIR/final-four-live.sourcebundle" \
            > "$F27_PRIVATE_DIR/final-four-capture.json" \
            2> "$F27_PRIVATE_DIR/final-four-capture.error"; then
            public_failure "$F27_PRIVATE_DIR/final-four-capture.error"
            echo "::error::The final exact four-function version-stable capture failed"
            exit 1
          fi
          if ! node scripts/ef-fingerprint.js "$DEPLOY_COMMIT" \
            --slugs=linear-outbound,production-write,deliverable-write,batch-write \
            --format=json \
            > "$F27_PRIVATE_DIR/final-four-fingerprint.json" \
            2> "$F27_PRIVATE_DIR/final-four-fingerprint.error"; then
            public_failure "$F27_PRIVATE_DIR/final-four-fingerprint.error"
            echo "::error::The final exact four-function provider comparison failed"
            exit 1
          fi
          node - "$F27_PRIVATE_DIR/final-four-capture.json" \
            "$F27_PRIVATE_DIR/final-four-fingerprint.json" <<'NODE'
          const fs = require('fs');
          const finalCapture = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const receipt = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const expected = new Map([
            ['batch-write', [process.env.BATCH_WRITE_SOURCE_SHA256, process.env.BATCH_WRITE_FILE_COUNT, process.env.BATCH_WRITE_ENTRYPOINT_SHA256]],
            ['deliverable-write', [process.env.DELIVERABLE_WRITE_SOURCE_SHA256, process.env.DELIVERABLE_WRITE_FILE_COUNT, process.env.DELIVERABLE_WRITE_ENTRYPOINT_SHA256]],
            ['linear-outbound', [process.env.LINEAR_OUTBOUND_SOURCE_SHA256, process.env.LINEAR_OUTBOUND_FILE_COUNT, process.env.LINEAR_OUTBOUND_ENTRYPOINT_SHA256]],
            ['production-write', [process.env.PRODUCTION_WRITE_SOURCE_SHA256, process.env.PRODUCTION_WRITE_FILE_COUNT, process.env.PRODUCTION_WRITE_ENTRYPOINT_SHA256]],
          ]);
          const finalCaptureRows = new Map((finalCapture.functions || []).map(row => [row.slug, row]));
          const rows = Array.isArray(receipt.results) ? receipt.results : [];
          if (finalCapture.result !== 'PASS' || finalCapture.operation !== 'capture'
            || finalCapture.function_count !== 4 || finalCaptureRows.size !== 4
            || receipt.mode !== 'live-read-only'
            || receipt.pinned_sha !== process.env.DEPLOY_COMMIT
            || rows.length !== 4
            || receipt.summary.pass !== 4 || receipt.summary.fail !== 0 || receipt.summary.error !== 0
            || receipt.summary.jwt_ok !== 4 || receipt.summary.jwt_flagged !== 0
            || receipt.summary.entrypoint_ok !== 4 || receipt.summary.entrypoint_flagged !== 0) {
            throw new Error('final four-function fingerprint envelope mismatch');
          }
          for (const row of rows) {
            const contract = expected.get(row.slug);
            const finalCaptured = finalCaptureRows.get(row.slug);
            const stepCapture = JSON.parse(fs.readFileSync(
              `${process.env.F27_PRIVATE_DIR}/${row.slug}-capture.json`, 'utf8',
            ));
            const stepFingerprint = JSON.parse(fs.readFileSync(
              `${process.env.F27_PRIVATE_DIR}/${row.slug}-fingerprint.json`, 'utf8',
            ));
            const stepCaptured = (stepCapture.functions || [])[0] || {};
            const stepLive = (stepFingerprint.results || [])[0] || {};
