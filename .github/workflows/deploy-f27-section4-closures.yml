name: Deploy F27 Section 4 closures

# This is the reviewed F27 Section 4 forward/restore lane. It never runs on a
# push or pull request and it never deploys linear-inbound, either frozen
# client writer, or the production comment/archive readers. The prior four
# provider-source/JWT captures remain the separate Section 1 pre-DDL step; both
# operations below require that sealed bundle to be present and independently
# verified before any function deployment starts.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed install release SHA; forward must equal current main
        required: true
        type: string
      operation:
        description: Deploy the reviewed closures or restore the sealed prior four
        required: true
        type: choice
        options:
          - deploy-reviewed-release
          - restore-captured-prior-four
      confirm:
        description: Exact operation-specific confirmation from the F27 runbook
        required: true
        type: string
      rollback_bundle_sha256:
        description: SHA-256 from the sealed pre-DDL four-function capture
        required: true
        type: string
      rollback_bundle_byte_length:
        description: Byte length from the sealed pre-DDL four-function capture
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: f27-section4-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      BATCH_WRITE_ENTRYPOINT_SHA256: 15a369f856a363f5c2926b3f251b1e154da805d5489d31432d07bfde145e8cf5
      BATCH_WRITE_FILE_COUNT: '2'
      BATCH_WRITE_SOURCE_SHA256: 86f9f187b39e187512886c0d33f4702ce3a766ee0cb4b0777d665917b3d83d6a
      DELIVERABLE_WRITE_ENTRYPOINT_SHA256: 74da8449a9f753a09cdf00326449df31664d18449c866b81923725aa6bad1e68
      DELIVERABLE_WRITE_FILE_COUNT: '2'
      DELIVERABLE_WRITE_SOURCE_SHA256: 78df060b7dd5b611e77b5427d7ab9a6cab1d0a18664f2e15562e098880074575
      DEPLOY_COMMIT: ${{ inputs.commit_sha }}
      EXPECTED_CLI_VERSION: 2.109.0
      EXPECTED_F27_SHARED_DRIVE_ROOT_ID_SHA256: 9d1480048b17bcd038650c4d3191e12cb94b65938374ab335b955a9cab2df042
      LINEAR_OUTBOUND_ENTRYPOINT_SHA256: 606628504ec4614a22e9d16c7671dc5d9ef73bfc57b69ecaa08065a5d14f3684
      LINEAR_OUTBOUND_FILE_COUNT: '5'
      # Re-pinned 2026-08-19 (ninth release): THE MIRROR STOPS VETOING ITS OWN
      # WRITES. The stale guard read the issue clock our OWN just-delivered
      # comment had bumped as "a human edited Linear" and dropped the paired
      # status row (81/81 audited drops carried a veto clock byte-identical to
      # an own written row's acknowledged updated_at; Kasper's GRA-6808 tweak
      # was stranded 20 hours). decideConflict now discounts an issue clock at
      # or before our own latest acknowledged write to the same issue; field
      # clocks and genuinely newer issue clocks veto exactly as before.
      # Supersedes eff38b69 (eighth release, ONE PARENT PER CARD), which
      # superseded ff0fc693, 5d8bf7dc (targeted-drain reclaim) and ef89adbf.
      # File count is unchanged, so the closure membership did not move.
      LINEAR_OUTBOUND_SOURCE_SHA256: 1489a4c276ca343554df2f4840c4f4b8ac77c33914098ee59a5d8b5cdec6ce39
      OPERATION: ${{ inputs.operation }}
      OPERATION_CONFIRMATION: ${{ inputs.confirm }}
      PRODUCTION_WRITE_ENTRYPOINT_SHA256: 7a3136a65709c21c4b07d9b18873f8eb6732766fdd9b5c5c0677a4f69f849de5
      PRODUCTION_WRITE_FILE_COUNT: '5'
      # Re-pinned 2026-08-14 (fifth release): production-write gains the client
      # comment FRONT DOOR — clientCommentFrontDoorTargetAllowed admits
      # calendar-surface and unlinked-samples client comments under the
      # slug/origin/team binding (the real repair behind PR #1064's routing
      # stopgap; frontend routing to it is gated on the
      # client_comment_gateway_enabled runtime flag, flipped only AFTER this
      # deploy). Supersedes the 2026-08-07 fourth release (batch parents
      # declare `status: "todo"`), which superseded 50970ca2 (intake
      # attribution stamp and asset-probe failure reason, 2026-08-05), which
      # superseded b974e809, the native-create key set. The value below was
      # last re-pinned 2026-08-17 for the retired AI thumbnail brief and the
      # Thumbnail child title, and is the closure now live.
      # In the sixth release only linear-outbound moves (see its note above);
      # production-write, batch-write and deliverable-write are byte-identical
      # to the previously reviewed pins and are deployed unchanged so the
      # four-function lane stays a single operation. Regenerate with:
      #   node scripts/ef-fingerprint.js <main-head-sha> \
      #     --slugs=linear-outbound,production-write,deliverable-write,batch-write \
      #     --expected-only
      # ENTRYPOINT_SHA256 is sha256 of the entrypoint PATH string, not the file
      # bytes, so it does not move when the source changes.
      #
      # Re-pinned 2026-08-19 (deploy #15): the append route validates the batch
      # parent against the team that OWNS it, not the team asking. One Linear
      # issue serves every team a card has, and the parent map stamps
      # owner_team for exactly this purpose -- validating against the asker
      # refused every thumbnail append to a batch whose only parent is a video
      # issue. Supersedes 07664530 (deploy #14, the append planner/modes).
      # Re-pinned 2026-08-20 (ninth release): SUBMIT-TAB THUMBNAIL TEXT restored,
      # narrowed. The owner retired the AI graphics brief on 2026-08-17 after it
      # invented art direction about a real client from an EMPTY filming plan;
      # he restored it 2026-08-20 scoped to "when someone submits it through the
      # submit tab", never the parent issue and never a video issue. The
      # unconditional generator is DELETED; submissionThumbnailText replaces it
      # behind eight gates (submit surface only, new batches only, graphics
      # children with no human brief, a server-resolved filming plan, a
      # substantive plan, output grounded in that plan's own words, thumbnail
      # length, and no throw path so it can never fail a submission). The
      # instruction moved out of the GRAPHIC_TITLE_PROMPT secret into the
      # reviewable source, because the retired prompt had silently drifted from
      # short thumbnail titles to art-direction sentences where nobody could see
      # it. File count is unchanged, so the closure membership did not move.
      # Re-pinned 2026-08-24 (thirteenth release): the Create Post editor picker.
      # autoAssigneeForIntake balances on OPEN video work only (todo/in_progress/
      # tweak) rather than every non-duplicate row ever written, and a VIDEO
      # assignee may now be chosen by the caller, validated through the same
      # assertEligibleAssignee as every other assignee write; graphics still
      # refuses an override outright. File count unchanged at 5, so closure
      # membership did not move.
      # Re-pinned 2026-08-27 (seventeenth release): the freest-editor parent
      # read moves from the deliverables table to the browser view, the only
      # relation that actually has raw_issue_parent_id — the table read was a
      # 42703 the by-design degradation swallowed, leaving the sixteenth
      # release's correction silently inert. File count unchanged at 5.
      # Re-pinned 2026-08-31 (eighteenth release): a VIDEO deliverable may carry
      # a canonical artifact. Both artifact guards test one shared ARTIFACT_TEAMS
      # set instead of two hand-written graphics comparisons, the mirrored
      # attachment title names the row's own team, and policy lets a creative
      # attach on their own team — the team match that confines them is
      # untouched, so a designer still cannot write a video row. Requires
      # migrations/2026-08-30-artifact-video-projection.sql, which teaches
      # production_artifact_write to project a video artifact onto
      # calendar_posts.asset_url keyed on video_deliverable_id; without it the
      # widened guards fall through to artifact_card_projection_scope_invalid
      # and every attach rolls back. Applied by the owner 2026-08-30 before this
      # pin. File count unchanged at 5, so closure membership did not move.
      #
      # This pin was MISSED when the source landed (PR #1182): the change shipped
      # to main and test/f27-section4-deploy-lane.js went red on main, because a
      # pinned-closure lane cannot deploy a source it has not reviewed. The lane
      # failing closed is the design working; the miss was not re-pinning in the
      # same commit that moved the closure.
      # Re-pinned 2026-08-31 (nineteenth release): raw footage and the frame
      # folder become editable. New `batch_asset` operation on the batch entity,
      # staff-only, writing footage_folder_url / delivery_folder_url through
      # public.production_batch_asset_write; filming_doc_url is absent from the
      # whitelist at every layer and stays unwritable. It is the one operation
      # where a creative is not confined to their own team, because a batch is
      # one shoot with one set of files worked by both teams; every other
      # operation keeps the confinement. Requires
      # migrations/2026-08-31-batch-asset-write.sql, without which the operation
      # answers 500 write_failed. File count unchanged at 5, so closure
      # membership did not move.
      # Re-pinned 2026-08-31 (twentieth release, folded into the nineteenth
      # before either shipped): two protected READS join batch_asset. The asset
      # snapshot falls back to the link on the card BOUND to a deliverable when
      # it carries no canonical file of its own, and reports which surface that
      # came from; and batch_files_read answers the file links behind the
      # sub-issue pills for a whole batch in one request, without probing. Both
      # are staff-only, authenticate the declared scope before resolving any id,
      # and require the card binding in both directions. No new import, so file
      # count is unchanged at 5.
      # Re-pinned 2026-08-31 (twenty-first release): asset_access_read now
      # announces ASSET_READ_CAPABILITIES, so a browser newer than this deploy
      # asks only for reads it has been offered. Without it the page called
      # batch_files_read against a gateway that had never heard of it and drew a
      # 400 on every parent open. Read-only addition; file count unchanged at 5.
      # Re-pinned 2026-08-31 (twenty-second release): batch_files_read resolves
      # the bound-card fallback with ONE query per surface instead of awaiting a
      # per-row lookup in sequence. Fourteen sequential round-trips to draw a
      # row of pills was the exact cost this read was written to avoid. Same
      # binding rule, same refusal on a failed lookup; only the query count
      # moves. File count unchanged at 5.
      # Re-pinned 2026-09-01 (twenty-fifth release): ASSET ACCESS OPENS ACROSS
      # TEAMS. staffAssetReadAllowed no longer requires a creative's team to
      # match the row's, and `attachment` moves above the team match beside
      # `batch_asset`. Owner ruling the same day, after his only graphics
      # designer opened the VIDEO parent post her thumbnail work hangs off and
      # got neither the description nor the assets, while an admin saw both:
      # "I want anyone, graphic, video, social media manager, or admin to be
      # able to edit assets, except for the filming plan ... on any parent
      # issue or sub-issue". The FILMING PLAN is untouched and stays refused in
      # three independent places. Client principals are refused before either
      # function is reached, and the client scope is still enforced by the
      # caller-declared slug, so this widened WHICH TEAM a staff member may
      # reach and nothing else. File count unchanged at 5. Amended before merge
      # for a review finding: the comment above
      # CREATIVE_ASSIGNEE_BOUND_OPERATIONS still said attachment stays
      # team-bound, sitting directly above the set it describes, and ROLLBACK.md
      # told an operator the boundary backwards in BOTH directions -- naming
      # batch_description as cross-team when a creative cannot perform it at
      # all, and claiming every other operation stays confined when attachment
      # no longer is. The policy.mjs half is comment-only, but a comment is
      # inside the closure and moves its hash, so the pin moves with it. File
      # count still 5.
      # Re-pinned 2026-09-01 (TWENTY-SIXTH release): THE FILMING PLAN SLOT
      # ANSWERS FROM THE CLIENT when the batch carries no copy of its own.
      # `batches.filming_doc_url` is written in exactly one place -- the intake
      # create path, which copies the client's plan onto the batch at creation
      # -- and nothing ever re-reads it, so a batch made any other way printed
      # `Missing` for a plan the client demonstrably has. Owner, the same day:
      # "I thought the asset ... for the filming plan takes the filming plan
      # from that client from Supabase, which she does have one, so isn't that
      # how it's working?" assetSnapshot now falls back to the SAME service-side
      # helper the intake path uses, reusing the client_slug the batch row
      # already selects. READ-ONLY: no new write path, no migration, and the
      # filming plan stays refused by all three write layers -- deriving it is
      # safe precisely because no seat could have typed a different answer. The
      # batch column still wins when set and is never back-filled from this. The
      # derived case reports source "client_plan"; the ordinary case reports
      # nothing. No new import: file count unchanged at 5.
      #
      # Previous (twenty-third release): a POST'S OWN DESCRIPTION
      # becomes writable. New batch_description operation calling
      # production_batch_description_write -- deliberately its own operation
      # rather than `description` with entity=batch, so it cannot acquire the
      # outbox and fingerprint machinery a write with no Linear counterpart has
      # no use for, and its event carries NO `outbound` key for the same reason
      # the batch_asset event does not. Owner request: "any parent issue should
      # be able to ... the description should be editable ... like linear, so
      # there's a description for the parent issue, and then there is the
      # description for all of the sub-issues". Additive: no existing operation
      # changes. File count unchanged at 5 (policy.mjs gains the operation name
      # and the role rule; no new module).
      # Re-pinned 2026-09-01 (twenty-seventh release): THREE STAFF REPORTS in
      # one morning, all of them the Production tab telling somebody something
      # untrue. (a) A post parent showed four `Missing` asset slots while its
      # own sub-issue showed the filming plan: the parent is a B1 mirror row on
      # a `b1_b_` batch with no asset columns while its children sit on the
      # native `bat_` batch that carries the links -- 5,729 of 6,230 live
      # deliverables measured on a `b1_b_` batch, so this is the estate's normal
      # shape. assetSnapshot now borrows the three POST-level links from a
      # child's batch when its own carries none, pinned to the same client,
      # bounded at 50 children, reached only on rows blank today. Never
      # `deliverable_file`, which is per-row. (b) `raw_footage` and
      # `delivery_folder` accept a FILE as well as a folder -- owner: "the raw
      # footage says invalid but I want to remove that, even if it is a dropbox
      # it should work. And it does work." A Dropbox share of one recording is
      # `/scl/fi/...`, a file, so a working link was painted red on a row nobody
      # could repair. Same widening deliverable_file got on 2026-08-16, same
      # reason; the HOST allowlist is untouched, so a Google Doc is still
      # refused. READ-ONLY plus one write-shape widening: no migration, and the
      # filming plan stays unwritable at all three layers. No new import: file
      # count unchanged at 5. Amended before merge for a review P1: the child
      # lookup asked the `deliverables` TABLE for raw_issue_parent_id, which
      # production_deliverables_browser_v1 DERIVES and the table does not carry.
      # PostgREST answers 42703, and the swallow that stops a lookup blip from
      # 503-ing the asset panel turned that into "this parent has no children",
      # so the borrow would have deployed doing nothing on the exact rows it
      # repairs. Third occurrence of this column mistake in this file; the
      # second killed the B1 import lane on 2026-08-27. Now reads the view --
      # which is also the projection the sub-issues themselves are drawn from --
      # and test/deliverables-view-only-columns.js fails any base-table query
      # naming one of the six view-derived columns.
      # Re-pinned 2026-09-02 (twenty-eighth release): THE COMMENT LOOKUPS STOP
      # CONFLATING "no such row" WITH "two rows". All three production_comments
      # identifier lookups in this function ran
      # `.or(id.eq.X,native_comment_id.eq.X).limit(2)` and then tested
      # `length !== 1`, a test that cannot tell a missing parent from an
      # ambiguous one. Live on 2026-09-02: a staff reply to a client root that
      # had taken the legacy transport (broken card/deliverable crosswalk, so
      # the root has no production_comments row at all) found ZERO rows and was
      # answered 409 comment_parent_ambiguous -- a code index.html classes in
      # the `reload` bucket, so the operator was told to reload a page that can
      # never produce the row, and the reply text was discarded. Zero rows now
      # answers a distinct 409 comment_parent_not_found; a genuine two-row
      # result is resolved by the exact primary key first -- the same ordered
      # fallback production_comment_upsert has always used (id ->
      # linear_comment_id -> native_comment_id -> idempotency_key, first hit
      # wins, migrations/2026-07-12-production-comments.sql) -- and only a
      # result still not one row after that tie-break is called ambiguous. The
      # comment LIFECYCLE lane gets the same tie-break and NOTHING else: its
      # 403 comment_forbidden stays, and stays non-enumerating, because the
      # status there must not disclose whether a row exists. One shared
      # resolveCommentByRef replaces the three copies. Refusal-taxonomy change
      # only: no migration, no schema, no new import -- file count unchanged
      # at 5. Ships with index.html's guidance for the new code in the same
      # commit, which test/write-ui-failure-messages.js requires.
      # Integration candidate on captured main 99d31; source only, NOT deployed.
      # Includes native intake/eligibility/editor projection. Native SQL must
      # precede this gateway even while all native admission epochs are disabled.
      PRODUCTION_WRITE_SOURCE_SHA256: 6f5b55e112c8f478f0d14d221079d2fd50d4ec4df7a74d657184f16caec938b5
      ROLLBACK_BUNDLE_BYTE_LENGTH: ${{ inputs.rollback_bundle_byte_length }}
      ROLLBACK_BUNDLE_SHA256: ${{ inputs.rollback_bundle_sha256 }}
    steps:
      # Validate only with trusted default-branch workflow bytes. No production
      # secret or script from the requested release is available before this.
      - name: Check out the trusted workflow SHA for validation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: operator
          persist-credentials: false

      - name: Validate the reviewed Section 4 release and operation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::The F27 Section 4 lane is workflow_dispatch only"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "::error::The F27 Section 4 lane must be dispatched from the default branch"
            exit 1
          fi
          actual_operator_sha="$(git -C operator rev-parse HEAD)"
          if [ "$actual_operator_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Trusted operator checkout does not match the workflow SHA"
            exit 1
          fi
          git -C operator fetch origin \
            "${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          current_main_sha="$(git -C operator rev-parse "origin/${{ github.event.repository.default_branch }}")"
          if [ "$GITHUB_SHA" != "$current_main_sha" ]; then
            echo "::error::The workflow SHA is not the current default-branch head"
            exit 1
          fi
          if ! [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          case "$OPERATION" in
            deploy-reviewed-release)
              if [ "$DEPLOY_COMMIT" != "$GITHUB_SHA" ]; then
                echo "::error::Forward commit_sha must equal the reviewed current-main workflow SHA"
                exit 1
              fi
              expected_confirmation='DEPLOY_REVIEWED_F27_SECTION4_CLOSURES'
              ;;
            restore-captured-prior-four)
              if ! git -C operator cat-file -e "$DEPLOY_COMMIT^{commit}" 2>/dev/null \
                || ! git -C operator merge-base --is-ancestor "$DEPLOY_COMMIT" "$GITHUB_SHA"; then
                echo "::error::Restore commit_sha must be the recorded reviewed release on current main"
                exit 1
              fi
              expected_confirmation='RESTORE_CAPTURED_F27_SECTION4_CLOSURES'
              ;;
            *)
              echo "::error::Unsupported F27 Section 4 operation"
              exit 1
              ;;
          esac
          for required in \
            supabase/config.toml \
            supabase/functions/linear-outbound/index.ts \
            supabase/functions/production-write/index.ts \
            supabase/functions/deliverable-write/index.ts \
            supabase/functions/batch-write/index.ts \
            supabase/functions/_shared/b4-write.ts \
            scripts/ef-fingerprint.js \
            scripts/f27-edge-source-rollback.js \
            scripts/f27-edge-source-rollback-lib.js \
            scripts/f27-edge-source-rollback-supabase-adapter.js \
            scripts/f27-private-snapshot-fetch.js; do
            if ! git -C operator cat-file -e "$DEPLOY_COMMIT:$required" 2>/dev/null; then
              echo "::error::The reviewed release is missing a required Section 4 source or attestor"
              exit 1
            fi
          done
          config="$(git -C operator show "$DEPLOY_COMMIT:supabase/config.toml")"
          project_ref="$(printf '%s\n' "$config" | sed -n 's/^project_id = "\([a-z0-9]\{20\}\)"$/\1/p')"
          project_ref_count="$(printf '%s\n' "$config" | grep -Ec '^project_id = "[a-z0-9]{20}"$' || true)"
          if ! [[ "$project_ref" =~ ^[a-z0-9]{20}$ ]] \
            || [ "$project_ref_count" -ne 1 ]; then
            echo "::error::The reviewed release does not contain one exact project target"
            exit 1
          fi
          echo "::add-mask::$project_ref"
          echo "F27_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
          if [ "$OPERATION_CONFIRMATION" != "$expected_confirmation" ]; then
            echo "::error::The operation-specific confirmation does not match"
            exit 1
          fi
          if ! [[ "$ROLLBACK_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::rollback_bundle_sha256 must be exactly 64 lowercase hexadecimal characters"
            exit 1
          fi
          if ! [[ "$ROLLBACK_BUNDLE_BYTE_LENGTH" =~ ^[1-9][0-9]{0,8}$ ]] \
            || [ "$ROLLBACK_BUNDLE_BYTE_LENGTH" -gt 134217728 ]; then
            echo "::error::rollback_bundle_byte_length is outside the private source-bundle limit"
            exit 1
          fi
          {
            echo "## F27 Section 4 closure lane"
            echo
            echo "- Dispatch-only gate: PASS"
            echo "- Reviewed release SHA: \`$DEPLOY_COMMIT\`"
            echo "- Operation: \`$OPERATION\`"
            echo "- Prior source bundle SHA-256: \`$ROLLBACK_BUNDLE_SHA256\`"
            echo "- Prior source bundle bytes: \`$ROLLBACK_BUNDLE_BYTE_LENGTH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # F27 artifacts live at the root of the "SyncView Backups" Shared Drive,
      # not in its "track-b-backups" weekly-snapshot child.
      - name: Fetch and independently verify the sealed prior-four source
        shell: bash
        env:
          F27_PRIVATE_SHARED_DRIVE_ROOT_ID: ${{ secrets.F27_PRIVATE_SHARED_DRIVE_ROOT_ID }}
          TRACK_B_BACKUP_GOOGLE_CREDENTIALS_JSON: ${{ secrets.TRACK_B_BACKUP_GOOGLE_CREDENTIALS_JSON }}
          F27_CONFIRM_PRIVATE_SNAPSHOT_FETCH: FETCH_PRIVATE_EDGE_SOURCE:${{ inputs.rollback_bundle_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$F27_PRIVATE_SHARED_DRIVE_ROOT_ID" ] \
            || [ -z "$TRACK_B_BACKUP_GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error::The protected F27 Shared Drive root and credential secrets are not both configured"
            exit 1
          fi
          private_dir="$(mktemp -d "$RUNNER_TEMP/f27-section4.XXXXXX")"
          chmod 700 "$private_dir"
          echo "F27_PRIVATE_DIR=$private_dir" >> "$GITHUB_ENV"
          bundle="$private_dir/prior-four.sourcebundle"
          echo "F27_PRIOR_FOUR_BUNDLE=$bundle" >> "$GITHUB_ENV"
          if ! node operator/scripts/f27-private-snapshot-fetch.js \
            --artifact-kind edge-source \
            --destination "$bundle" \
            --expected-sha256 "$ROLLBACK_BUNDLE_SHA256" \
            --expected-byte-length "$ROLLBACK_BUNDLE_BYTE_LENGTH" \
            > "$private_dir/fetch-receipt.json"; then
            echo "::error::The sealed prior-four private fetch or independent round-trip failed"
            exit 1
          fi
          node - "$private_dir/fetch-receipt.json" <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (receipt.status !== 'PASS'
            || receipt.artifact_kind !== 'edge-source'
            || receipt.source_bundle_sha256 !== process.env.ROLLBACK_BUNDLE_SHA256
            || String(receipt.byte_length) !== process.env.ROLLBACK_BUNDLE_BYTE_LENGTH
            || receipt.folder_id_sha256 !== process.env.EXPECTED_F27_SHARED_DRIVE_ROOT_ID_SHA256
            || receipt.independent_private_readback !== 'PASS'
            || receipt.local_private_readback !== 'PASS') {
            throw new Error('private prior-four source receipt mismatch');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '- Sealed prior-four private fetch: PASS',
            `- F27 Shared Drive root ID SHA-256: \`${receipt.folder_id_sha256}\``,
            '',
          ].join('\n'));
          NODE

      - name: Inspect the exact sealed prior-four rollback set
        shell: bash
        working-directory: operator
        run: |
          set -euo pipefail
          # The reason, in the run log.
          #
          # Every provider readback below already writes its stderr to a file
          # under the private directory, and that directory is destroyed by the
          # cleanup step. On 2026-08-07 the final four-function verification
          # failed and the ONLY line published was "the capture failed" — the
          # cause went into the file and died with it, which cost an entire
          # diagnosis cycle against a production state that turned out correct.
          #
