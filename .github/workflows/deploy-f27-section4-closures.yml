            echo "::error::The reviewed batch-write deployment failed or was ambiguous"
            exit 1
          fi
          if grep -Eiq 'Docker is not running|server-side' "$F27_PRIVATE_DIR/batch-write-deploy.log"; then
            echo "::error::The batch-write deploy receipt did not prove local Docker bundling"
            exit 1
          fi
          export PROJECT_REF="$project_ref"
          if ! node scripts/f27-edge-source-rollback.js capture \
            --slugs=batch-write \
            --bundle="$F27_PRIVATE_DIR/batch-write-live.sourcebundle" \
            > "$F27_PRIVATE_DIR/batch-write-capture.json" \
            2> "$F27_PRIVATE_DIR/batch-write-capture.error"; then
            public_failure "$F27_PRIVATE_DIR/batch-write-capture.error"
            echo "::error::The batch-write provider source readback failed"
            exit 1
          fi
          if ! node scripts/ef-fingerprint.js "$DEPLOY_COMMIT" \
            --slugs=batch-write --format=json \
            > "$F27_PRIVATE_DIR/batch-write-fingerprint.json" \
            2> "$F27_PRIVATE_DIR/batch-write-fingerprint.error"; then
            public_failure "$F27_PRIVATE_DIR/batch-write-fingerprint.error"
            echo "::error::The batch-write candidate comparison failed"
            exit 1
          fi
          node - "$F27_PRIVATE_DIR/candidate-fingerprint.json" \
            "$F27_PRIVATE_DIR/batch-write-capture.json" \
            "$F27_PRIVATE_DIR/batch-write-fingerprint.json" <<'NODE'
          const fs = require('fs');
          const [candidate, capture, live] = process.argv.slice(2).map(file => JSON.parse(fs.readFileSync(file, 'utf8')));
          const candidateRow = candidate.results.find(row => row.slug === 'batch-write') || {};
          const captureRow = (capture.functions || [])[0] || {};
          const liveRow = (live.results || [])[0] || {};
          if (capture.result !== 'PASS' || capture.operation !== 'capture' || capture.function_count !== 1
            || captureRow.slug !== 'batch-write'
            || captureRow.source_closure_sha256 !== process.env.BATCH_WRITE_SOURCE_SHA256
            || captureRow.entrypoint_sha256 !== process.env.BATCH_WRITE_ENTRYPOINT_SHA256
            || String(captureRow.file_count) !== process.env.BATCH_WRITE_FILE_COUNT
            || captureRow.verify_jwt !== false
            || live.mode !== 'live-read-only' || live.pinned_sha !== process.env.DEPLOY_COMMIT
            || live.results.length !== 1 || liveRow.slug !== 'batch-write'
            || liveRow.result !== 'PASS' || liveRow.status !== 'ACTIVE'
            || String(liveRow.version) !== String(captureRow.captured_version)
            || !/^[0-9]+$/.test(String(captureRow.captured_version))
            || liveRow.verify_jwt !== false || liveRow.entrypoint_match !== true
            || liveRow.expected_entrypoint !== 'functions/batch-write/index.ts'
            || liveRow.live_entrypoint !== liveRow.expected_entrypoint
            || candidateRow.expected_fingerprint !== process.env.BATCH_WRITE_SOURCE_SHA256
            || liveRow.expected_fingerprint !== candidateRow.expected_fingerprint
            || liveRow.live_fingerprint !== candidateRow.expected_fingerprint
            || String(liveRow.expected_files) !== process.env.BATCH_WRITE_FILE_COUNT
            || String(liveRow.live_files) !== process.env.BATCH_WRITE_FILE_COUNT
            || !/^[0-9a-f]{64}$/.test(String(liveRow.bundle_fingerprint))) {
            throw new Error('batch-write source/entrypoint/JWT readback mismatch');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '- `batch-write` deploy/readback: PASS',
            `  - Active version: \`${captureRow.captured_version}\``,
            `  - Source closure SHA-256: \`${captureRow.source_closure_sha256}\``,
            `  - Entrypoint SHA-256: \`${captureRow.entrypoint_sha256}\``,
            `  - Provider bundle SHA-256: \`${liveRow.bundle_fingerprint}\``,
            '  - JWT posture: `verify_jwt=false`',
          ].join('\n') + '\n');
          NODE

      - name: Verify the final exact three-function release
        if: inputs.operation == 'deploy-reviewed-release'
        shell: bash
        working-directory: release
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # The reason, in the run log.
          #
          # Every provider readback below already writes its stderr to a file
          # under the private directory, and that directory is destroyed by the
          # cleanup step. On 2026-08-07 the final four-function verification
          # failed and the ONLY line published was "the capture failed" — the
          # cause went into the file and died with it, which cost an entire
          # diagnosis cycle against a production state that turned out correct.
          #
          # Both scripts prefix their own failures with a fixed formatter
          # (f27-edge-source-rollback: CODE: message, ef-fingerprint: message)
          # over an allowlisted vocabulary. Only those lines are echoed, capped
          # in length and count, so nothing else in the file can reach the log.
          public_failure() {
            [ -f "$1" ] || return 0
            grep -aoE '^(f27-edge-source-rollback|ef-fingerprint): .{0,200}' "$1" | head -3 || true
          }
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The protected production Supabase access token is not configured"
            exit 1
          fi
          project_ref="$F27_PROJECT_REF"
          export PROJECT_REF="$project_ref"
          if ! node scripts/f27-edge-source-rollback.js capture \
            --slugs=production-write,deliverable-write,batch-write \
            --bundle="$F27_PRIVATE_DIR/final-release-live.sourcebundle" \
            > "$F27_PRIVATE_DIR/final-release-capture.json" \
            2> "$F27_PRIVATE_DIR/final-release-capture.error"; then
            public_failure "$F27_PRIVATE_DIR/final-release-capture.error"
            echo "::error::The final exact three-function version-stable capture failed"
            exit 1
          fi
          if ! node scripts/ef-fingerprint.js "$DEPLOY_COMMIT" \
            --slugs=production-write,deliverable-write,batch-write \
            --format=json \
            > "$F27_PRIVATE_DIR/final-release-fingerprint.json" \
            2> "$F27_PRIVATE_DIR/final-release-fingerprint.error"; then
            public_failure "$F27_PRIVATE_DIR/final-release-fingerprint.error"
            echo "::error::The final exact three-function provider comparison failed"
            exit 1
          fi
          node - "$F27_PRIVATE_DIR/final-release-capture.json" \
            "$F27_PRIVATE_DIR/final-release-fingerprint.json" <<'NODE'
          const fs = require('fs');
          const finalCapture = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const receipt = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const expected = new Map([
            ['batch-write', [process.env.BATCH_WRITE_SOURCE_SHA256, process.env.BATCH_WRITE_FILE_COUNT, process.env.BATCH_WRITE_ENTRYPOINT_SHA256]],
            ['deliverable-write', [process.env.DELIVERABLE_WRITE_SOURCE_SHA256, process.env.DELIVERABLE_WRITE_FILE_COUNT, process.env.DELIVERABLE_WRITE_ENTRYPOINT_SHA256]],
            ['production-write', [process.env.PRODUCTION_WRITE_SOURCE_SHA256, process.env.PRODUCTION_WRITE_FILE_COUNT, process.env.PRODUCTION_WRITE_ENTRYPOINT_SHA256]],
          ]);
          const finalCaptureRows = new Map((finalCapture.functions || []).map(row => [row.slug, row]));
          const rows = Array.isArray(receipt.results) ? receipt.results : [];
          if (finalCapture.result !== 'PASS' || finalCapture.operation !== 'capture'
            || finalCapture.function_count !== 3 || finalCaptureRows.size !== 3
            || receipt.mode !== 'live-read-only'
            || receipt.pinned_sha !== process.env.DEPLOY_COMMIT
            || rows.length !== 3
            || receipt.summary.pass !== 3 || receipt.summary.fail !== 0 || receipt.summary.error !== 0
            || receipt.summary.jwt_ok !== 3 || receipt.summary.jwt_flagged !== 0
            || receipt.summary.entrypoint_ok !== 3 || receipt.summary.entrypoint_flagged !== 0) {
            throw new Error('final three-function fingerprint envelope mismatch');
          }
          for (const row of rows) {
            const contract = expected.get(row.slug);
            const finalCaptured = finalCaptureRows.get(row.slug);
            const stepCapture = JSON.parse(fs.readFileSync(
              `${process.env.F27_PRIVATE_DIR}/${row.slug}-capture.json`, 'utf8',
            ));
            const stepFingerprint = JSON.parse(fs.readFileSync(
              `${process.env.F27_PRIVATE_DIR}/${row.slug}-fingerprint.json`, 'utf8',
            ));
            const stepCaptured = (stepCapture.functions || [])[0] || {};
            const stepLive = (stepFingerprint.results || [])[0] || {};
            if (!contract || row.result !== 'PASS' || row.status !== 'ACTIVE'
              || row.verify_jwt !== false || row.entrypoint_match !== true
              || row.expected_entrypoint !== `functions/${row.slug}/index.ts`
              || row.live_entrypoint !== row.expected_entrypoint
              || row.expected_fingerprint !== contract[0] || row.live_fingerprint !== contract[0]
              || String(row.expected_files) !== contract[1] || String(row.live_files) !== contract[1]
              || !/^[0-9]+$/.test(String(row.version))
              || !finalCaptured
              || finalCaptured.source_closure_sha256 !== contract[0]
              || String(finalCaptured.file_count) !== contract[1]
              || finalCaptured.entrypoint_sha256 !== contract[2]
              || finalCaptured.verify_jwt !== false
              || String(finalCaptured.captured_version) !== String(row.version)
              || String(stepCaptured.captured_version) !== String(row.version)
              || String(stepLive.version) !== String(row.version)
              || !/^[0-9a-f]{64}$/.test(String(row.bundle_fingerprint))
              || stepLive.bundle_fingerprint !== row.bundle_fingerprint) {
              throw new Error(`final fingerprint mismatch for ${row.slug}`);
            }
          }
          /*
           * WHAT IS RUNNING, not merely THAT IT PASSED.
           *
           * This receipt used to end at "PASS" for all four. The restore path
           * has always printed its per-slug versions and hashes; the forward
           * path did not, so after a deploy nothing in the repository or the
           * run log attested which version of each function was live.
           *
           * That is F51, and on 2026-08-05 it cost two full diagnosis cycles:
           * a stale `production-write` was assumed to match the repository, and
           * two separate defects (an unfollowed 303 on the artifact probe, and
           * an attribution stamp that turned out to be absent rather than
           * partial) were each investigated against source that was not the
           * source running. Both are the same missing fact.
           *
           * Every value below is public-safe: slug, integer version, source
           * closure hash, entrypoint hash, JWT posture, provider bundle hash.
           * Copy the ATTESTATION block into EXECUTION_LOG.md after the run.
           */
          const attestation = rows.map(row => ({
            slug: row.slug,
            active_version: String(row.version),
            source_closure_sha256: row.live_fingerprint,
            entrypoint_sha256: (expected.get(row.slug) || [])[2],
            provider_bundle_sha256: row.bundle_fingerprint,
            verify_jwt: row.verify_jwt,
          })).sort((a, b) => a.slug.localeCompare(b.slug));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '',
            '- Forward deployment: PASS',
            '- Deployed function count: `3`',
            '- Strict serial provider readbacks: PASS',
            '- Final three-function source/entrypoint/JWT/version/provider comparison: PASS',
            '',
            '### Deployed versions — record these in `EXECUTION_LOG.md`',
            '',
            '| function | active version | source closure SHA-256 | JWT |',
            '|---|---:|---|---|',
            ...attestation.map(row => `| \`${row.slug}\` | \`${row.active_version}\` | \`${row.source_closure_sha256}\` | \`verify_jwt=${row.verify_jwt}\` |`),
            '',
            `Deployed from commit \`${process.env.DEPLOY_COMMIT}\`.`,
            '',
            '```json',
            JSON.stringify({
              schema: 'syncview_f27_section4_deployed_versions_v1',
              deploy_commit: process.env.DEPLOY_COMMIT,
              github_run_id: process.env.GITHUB_RUN_ID,
              functions: attestation,
            }, null, 2),
            '```',
            '',
            'Any failed or ambiguous forward response must never be retried. Use the separately confirmed captured-prior restore operation.',
          ].join('\n') + '\n');
          NODE

      - name: Restore the exact captured prior three
        if: inputs.operation == 'restore-captured-prior-three'
        shell: bash
        working-directory: operator
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          F27_EDGE_ROLLBACK_CONFIRM: RESTORE_CAPTURED_SOURCE_SET:batch-write,deliverable-write,production-write
        run: |
          set -euo pipefail
          # The reason, in the run log.
          #
          # Every provider readback below already writes its stderr to a file
          # under the private directory, and that directory is destroyed by the
          # cleanup step. On 2026-08-07 the final four-function verification
          # failed and the ONLY line published was "the capture failed" — the
          # cause went into the file and died with it, which cost an entire
          # diagnosis cycle against a production state that turned out correct.
          #
          # Both scripts prefix their own failures with a fixed formatter
          # (f27-edge-source-rollback: CODE: message, ef-fingerprint: message)
          # over an allowlisted vocabulary. Only those lines are echoed, capped
          # in length and count, so nothing else in the file can reach the log.
          public_failure() {
            [ -f "$1" ] || return 0
            grep -aoE '^(f27-edge-source-rollback|ef-fingerprint): .{0,200}' "$1" | head -3 || true
          }
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The protected production Supabase access token is not configured"
            exit 1
          fi
          project_ref="$F27_PROJECT_REF"
          export PROJECT_REF="$project_ref"
          if ! node scripts/f27-edge-source-rollback.js restore \
            --slugs=production-write,deliverable-write,batch-write \
            --bundle="$F27_PRIOR_THREE_BUNDLE" \
            --expected-bundle-sha256="$ROLLBACK_BUNDLE_SHA256" \
            --apply \
            > "$F27_PRIVATE_DIR/restore-receipt.json" \
            2> "$F27_PRIVATE_DIR/restore-error.log"; then
            echo "::error::The captured-prior restore or a serial provider readback failed"
            exit 1
          fi
          if ! node scripts/f27-edge-source-rollback.js capture \
            --slugs=production-write,deliverable-write,batch-write \
            --bundle="$F27_PRIVATE_DIR/final-restored-three.sourcebundle" \
            > "$F27_PRIVATE_DIR/final-restored-three-capture.json" \
            2> "$F27_PRIVATE_DIR/final-restored-three-capture.error"; then
            public_failure "$F27_PRIVATE_DIR/final-restored-three-capture.error"
            echo "::error::The final restored three-function provider capture failed"
            exit 1
          fi
          node - "$F27_PRIVATE_DIR/prior-inspect.json" \
            "$F27_PRIVATE_DIR/restore-receipt.json" \
            "$F27_PRIVATE_DIR/final-restored-three-capture.json" <<'NODE'
          const fs = require('fs');
          const prior = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const restored = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const finalCapture = JSON.parse(fs.readFileSync(process.argv[4], 'utf8'));
          const priorRows = new Map((prior.functions || []).map(row => [row.slug, row]));
          const rows = Array.isArray(restored.functions) ? restored.functions : [];
          const finalRows = new Map((finalCapture.functions || []).map(row => [row.slug, row]));
          if (restored.result !== 'PASS'
            || restored.operation !== 'restore'
            || restored.rollback_standard !== 'source-exact-readback'
            || restored.function_count !== 3
            || restored.sealed_bundle_sha256 !== process.env.ROLLBACK_BUNDLE_SHA256
            || restored.deployed_source_readback !== 'PASS'
            || rows.length !== 3
            || finalCapture.result !== 'PASS' || finalCapture.operation !== 'capture'
            || finalCapture.function_count !== 3 || finalRows.size !== 3
            || finalCapture.aggregate_source_sha256 !== prior.aggregate_source_sha256) {
            throw new Error('captured-prior restore receipt mismatch');
          }
          for (const row of rows) {
            const captured = priorRows.get(row.slug);
            const finalRow = finalRows.get(row.slug);
            if (!captured
              || !finalRow
              || String(row.captured_version) !== String(captured.captured_version)
              || row.verify_jwt !== captured.verify_jwt
              || row.source_closure_sha256 !== captured.source_closure_sha256
              || row.entrypoint_sha256 !== captured.entrypoint_sha256
              || row.function_manifest_sha256 !== captured.function_manifest_sha256
              || row.file_count !== captured.file_count
              || row.provider_source_file_count !== captured.provider_source_file_count
              || row.deployed_source_readback !== 'PASS'
              || !/^[0-9]+$/.test(String(row.restored_active_version))
              || String(finalRow.captured_version) !== String(row.restored_active_version)
              || finalRow.verify_jwt !== captured.verify_jwt
              || finalRow.source_closure_sha256 !== captured.source_closure_sha256
              || finalRow.entrypoint_sha256 !== captured.entrypoint_sha256
              || finalRow.file_count !== captured.file_count
              || finalRow.provider_source_file_count !== captured.provider_source_file_count) {
              throw new Error(`captured-prior restore mismatch for ${row.slug}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '- Captured-prior source-exact restore: PASS',
            '- Restored function count: `3`',
            ...rows.map(row => `- Restored \`${row.slug}\`: prior version \`${row.captured_version}\`, new active version \`${row.restored_active_version}\`, source \`${row.source_closure_sha256}\`, entrypoint hash \`${row.entrypoint_sha256}\`, JWT \`verify_jwt=${row.verify_jwt}\``),
            '- Serial provider source/entrypoint/JWT readback: PASS',
            '- Final three-function restored-version/source/entrypoint/JWT capture: PASS',
            '',
          ].join('\n'));
          NODE

      # This is the only always() step. It deletes private source/log material;
      # no receipt or attestation may run after a failed gate.
      - name: Delete private source and raw receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${F27_PRIVATE_DIR:-}" ]; then
            exit 0
          fi
          case "$F27_PRIVATE_DIR" in
            "$RUNNER_TEMP"/f27-section4.*)
              if [ -d "$F27_PRIVATE_DIR" ]; then
                rm -rf -- "$F27_PRIVATE_DIR"
              fi
              ;;
            *)
              echo "::error::Private cleanup target escaped the runner temporary directory"
              exit 1
              ;;
          esac
