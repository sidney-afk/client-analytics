      # sub-issue pills for a whole batch in one request, without probing. Both
      # are staff-only, authenticate the declared scope before resolving any id,
      # and require the card binding in both directions. No new import, so file
      # count is unchanged at 5.
      # Re-pinned 2026-08-31 (twenty-first release): asset_access_read now
      # announces ASSET_READ_CAPABILITIES, so a browser newer than this deploy
      # asks only for reads it has been offered. Without it the page called
      # batch_files_read against a gateway that had never heard of it and drew a
      # 400 on every parent open. Read-only addition; file count unchanged at 5.
      # Re-pinned 2026-08-31 (twenty-second release): batch_files_read resolves
      # the bound-card fallback with ONE query per surface instead of awaiting a
      # per-row lookup in sequence. Fourteen sequential round-trips to draw a
      # row of pills was the exact cost this read was written to avoid. Same
