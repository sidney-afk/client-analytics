      # (Previous pin: 192c9aa1b3... -- production-write, files=10, 2026-09-25.)
      # Re-pinned 2026-10-15 (OPEN_REPAIRS 421, note outbox): the Slack sender
      # wake after an ordinary comment or status write runs after the answer
      # (EdgeRuntime.waitUntil) instead of holding it. Regenerated with
      # scripts/ef-fingerprint.js --slugs=production-write --expected-only;
      # entrypoint and file count (10) unchanged.
      # (Previous pin: 692b5c473b... -- production-write, files=10, 2026-10-08.)
      PRODUCTION_WRITE_SOURCE_SHA256: 07677a1f0b62271710df7b63aff8a7eb7c732473f00c796d5e34c384c56387d2
      # The two bundle values are exported to GITHUB_ENV as ROLLBACK_BUNDLE_SHA256
      # and ROLLBACK_BUNDLE_BYTE_LENGTH by the validation step (given) or the
      # capture step (sealed in this run); a job-level value would shadow those.
      INPUT_BUNDLE_BYTE_LENGTH: ${{ inputs.rollback_bundle_byte_length }}
      INPUT_BUNDLE_SHA256: ${{ inputs.rollback_bundle_sha256 }}
    steps:
      # Validate only with trusted default-branch workflow bytes. No production
      # secret or script from the requested release is available before this.
      - name: Check out the trusted workflow SHA for validation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: operator
          persist-credentials: false

      - name: Validate the reviewed Section 4 release and operation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::The F27 Section 4 lane is workflow_dispatch only"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "::error::The F27 Section 4 lane must be dispatched from the default branch"
            exit 1
          fi
          actual_operator_sha="$(git -C operator rev-parse HEAD)"
          if [ "$actual_operator_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Trusted operator checkout does not match the workflow SHA"
            exit 1
          fi
          git -C operator fetch origin \
            "${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          current_main_sha="$(git -C operator rev-parse "origin/${{ github.event.repository.default_branch }}")"
          if [ "$GITHUB_SHA" != "$current_main_sha" ]; then
            echo "::error::The workflow SHA is not the current default-branch head"
            exit 1
          fi
          if ! [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          case "$OPERATION" in
            deploy-reviewed-release)
              if [ "$DEPLOY_COMMIT" != "$GITHUB_SHA" ]; then
                echo "::error::Forward commit_sha must equal the reviewed current-main workflow SHA"
                exit 1
              fi
              expected_confirmation='DEPLOY_REVIEWED_F27_SECTION4_CLOSURES'
              ;;
            capture-only)
              if [ "$DEPLOY_COMMIT" != "$GITHUB_SHA" ]; then
                echo "::error::capture-only commit_sha must equal the current-main workflow SHA"
                exit 1
              fi
              expected_confirmation='CAPTURE_F27_SECTION4_PRIOR_THREE'
              ;;
            restore-captured-prior-three)
              if ! git -C operator cat-file -e "$DEPLOY_COMMIT^{commit}" 2>/dev/null \
                || ! git -C operator merge-base --is-ancestor "$DEPLOY_COMMIT" "$GITHUB_SHA"; then
                echo "::error::Restore commit_sha must be the recorded reviewed release on current main"
                exit 1
              fi
              expected_confirmation='RESTORE_CAPTURED_F27_SECTION4_CLOSURES'
              ;;
            *)
              echo "::error::Unsupported F27 Section 4 operation"
              exit 1
              ;;
          esac
          for required in \
            supabase/config.toml \
            supabase/functions/production-write/index.ts \
            supabase/functions/deliverable-write/index.ts \
            supabase/functions/batch-write/index.ts \
            supabase/functions/_shared/b4-write.ts \
            scripts/ef-fingerprint.js \
            scripts/f27-edge-source-rollback.js \
            scripts/f27-edge-source-rollback-lib.js \
            scripts/f27-edge-source-rollback-supabase-adapter.js \
            scripts/f27-private-snapshot-store.js \
            scripts/f27-private-snapshot-fetch.js; do
            if ! git -C operator cat-file -e "$DEPLOY_COMMIT:$required" 2>/dev/null; then
              echo "::error::The reviewed release is missing a required Section 4 source or attestor"
              exit 1
            fi
          done
          config="$(git -C operator show "$DEPLOY_COMMIT:supabase/config.toml")"
          project_ref="$(printf '%s\n' "$config" | sed -n 's/^project_id = "\([a-z0-9]\{20\}\)"$/\1/p')"
          project_ref_count="$(printf '%s\n' "$config" | grep -Ec '^project_id = "[a-z0-9]{20}"$' || true)"
          if ! [[ "$project_ref" =~ ^[a-z0-9]{20}$ ]] \
            || [ "$project_ref_count" -ne 1 ]; then
            echo "::error::The reviewed release does not contain one exact project target"
            exit 1
          fi
          echo "::add-mask::$project_ref"
          echo "F27_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"
          if [ "$OPERATION_CONFIRMATION" != "$expected_confirmation" ]; then
            echo "::error::The operation-specific confirmation does not match"
            exit 1
          fi
          # `capture` (both inputs): this run seals the live three itself in the
          # next steps. A restore never captures: it needs the recorded values.
          if [ "$INPUT_BUNDLE_SHA256" = "capture" ] || [ "$INPUT_BUNDLE_BYTE_LENGTH" = "capture" ]; then
            if [ "$INPUT_BUNDLE_SHA256" != "capture" ] || [ "$INPUT_BUNDLE_BYTE_LENGTH" != "capture" ]; then
              echo "::error::Pass capture as BOTH bundle inputs, or two sealed values"
              exit 1
            fi
            if [ "$OPERATION" = "restore-captured-prior-three" ]; then
              echo "::error::A restore needs the recorded sealed bundle values, never a new capture"
              exit 1
            fi
            echo "F27_CAPTURE_IN_RUN=true" >> "$GITHUB_ENV"
            bundle_summary="sealed in this run (next steps)"
          else
            if [ "$OPERATION" = "capture-only" ]; then
              echo "::error::capture-only seals a new bundle; pass capture as both bundle inputs"
              exit 1
            fi
            if ! [[ "$INPUT_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::rollback_bundle_sha256 must be exactly 64 lowercase hexadecimal characters"
              exit 1
            fi
            if ! [[ "$INPUT_BUNDLE_BYTE_LENGTH" =~ ^[1-9][0-9]{0,8}$ ]] \
              || [ "$INPUT_BUNDLE_BYTE_LENGTH" -gt 134217728 ]; then
              echo "::error::rollback_bundle_byte_length is outside the private source-bundle limit"
              exit 1
            fi
            echo "F27_CAPTURE_IN_RUN=false" >> "$GITHUB_ENV"
            echo "ROLLBACK_BUNDLE_SHA256=$INPUT_BUNDLE_SHA256" >> "$GITHUB_ENV"
            echo "ROLLBACK_BUNDLE_BYTE_LENGTH=$INPUT_BUNDLE_BYTE_LENGTH" >> "$GITHUB_ENV"
            bundle_summary="\`$INPUT_BUNDLE_SHA256\` / \`$INPUT_BUNDLE_BYTE_LENGTH\` bytes (given)"
          fi
          {
            echo "## F27 Section 4 closure lane"
            echo
            echo "- Dispatch-only gate: PASS"
            echo "- Reviewed release SHA: \`$DEPLOY_COMMIT\`"
            echo "- Operation: \`$OPERATION\`"
            echo "- Prior source bundle: $bundle_summary"
          } >> "$GITHUB_STEP_SUMMARY"

      # IN-RUN CAPTURE (replaces the owner's Windows capture and drag-and-drop).
      # Same script, same format, same seal: the receipt's sealed_bundle_sha256
      # and sealed_bundle_byte_length are exactly the two values the owner used
      # to paste, and every check after this block is unchanged.
      - name: Install exact Supabase CLI for the capture
        if: env.F27_CAPTURE_IN_RUN == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Capture and seal the live prior three (read only)
        if: env.F27_CAPTURE_IN_RUN == 'true'
        shell: bash
        working-directory: operator
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The protected production Supabase access token is not configured"
            exit 1
          fi
          public_failure() {
            [ -f "$1" ] || return 0
            grep -aoE '^(f27-edge-source-rollback|ef-fingerprint): .{0,200}' "$1" | head -3 || true
          }
          private_dir="$(mktemp -d "$RUNNER_TEMP/f27-section4.XXXXXX")"
          chmod 700 "$private_dir"
          echo "F27_PRIVATE_DIR=$private_dir" >> "$GITHUB_ENV"
          mkdir -m 700 "$private_dir/capture"
          bundle="$private_dir/capture/prior-three-$(date -u +%Y%m%d-%H%M%S).sourcebundle"
          echo "F27_CAPTURED_BUNDLE=$bundle" >> "$GITHUB_ENV"
          export PROJECT_REF="$F27_PROJECT_REF"
          if ! node scripts/f27-edge-source-rollback.js capture \
            --slugs=production-write,deliverable-write,batch-write \
            --bundle="$bundle" \
            > "$private_dir/capture-receipt.json" \
            2> "$private_dir/capture.error"; then
            public_failure "$private_dir/capture.error"
            echo "::error::The live prior-three capture failed; nothing was stored or deployed"
            exit 1
          fi
          # An independent second read of the live set: the attestor's own live
          # fingerprints must equal the closures the capture sealed.
          node scripts/ef-fingerprint.js "$DEPLOY_COMMIT" \
            --slugs=production-write,deliverable-write,batch-write --format=json --report-only \
            > "$private_dir/capture-live.json" 2> "$private_dir/capture-live.error" || true
          node - "$private_dir/capture-receipt.json" "$private_dir/capture-live.json" "$bundle" <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          let live = {};
          try { live = JSON.parse(fs.readFileSync(process.argv[3], 'utf8')); } catch (_) { throw new Error('independent live fingerprint read failed'); }
          const expected = ['batch-write', 'deliverable-write', 'production-write'];
          const rows = Array.isArray(receipt.functions) ? receipt.functions : [];
          if (receipt.result !== 'PASS'
            || receipt.operation !== 'capture'
            || receipt.provider_contract !== 'PASS'
            || receipt.provider_source_exactness !== 'PASS'
            || receipt.rollback_standard !== 'source-exact-readback'
            || receipt.function_count !== 3
            || !/^[0-9a-f]{64}$/.test(String(receipt.sealed_bundle_sha256))
            || !Number.isSafeInteger(receipt.sealed_bundle_byte_length)
            || receipt.sealed_bundle_byte_length < 1
            || receipt.sealed_bundle_byte_length > 134217728
            || receipt.sealed_bundle_byte_length !== fs.statSync(process.argv[4]).size
            || rows.length !== 3) {
            throw new Error('live prior-three capture receipt mismatch');
          }
          const liveBySlug = new Map((live.results || []).map(row => [row.slug, row]));
          for (let index = 0; index < expected.length; index += 1) {
            const row = rows[index] || {};
            const independent = liveBySlug.get(expected[index]) || {};
            if (row.slug !== expected[index]
              || typeof row.verify_jwt !== 'boolean'
              || !/^[0-9a-f]{64}$/.test(String(row.source_closure_sha256))
              || independent.live_fingerprint !== row.source_closure_sha256
              || String(independent.version) !== String(row.captured_version)) {
              throw new Error(`live prior-three capture disagrees with the independent live read for ${expected[index]}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `ROLLBACK_BUNDLE_SHA256=${receipt.sealed_bundle_sha256}`,
            `ROLLBACK_BUNDLE_BYTE_LENGTH=${receipt.sealed_bundle_byte_length}`,
            '',
          ].join('\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '- Live prior-three capture in this run: PASS (provider contract, source exactness, independent live read agree)',
            `- **Sealed bundle SHA-256: \`${receipt.sealed_bundle_sha256}\`**`,
            `- **Sealed bundle bytes: \`${receipt.sealed_bundle_byte_length}\`**`,
            '- Those two values restore this exact live set with `restore-captured-prior-three`.',
            ...rows.map(row => `- Captured \`${row.slug}\`: version \`${row.captured_version}\`, source \`${row.source_closure_sha256}\``),
            '',
          ].join('\n'));
          NODE

      # F27 artifacts live at the root of the "SyncView Backups" Shared Drive.
      - name: Store the sealed bundle in the F27 Shared Drive root (independent readback)
        if: env.F27_CAPTURE_IN_RUN == 'true'
        shell: bash
        env:
          F27_CONFIRM_PRIVATE_SNAPSHOT_UPLOAD: "1"
          TRACK_B_BACKUP_DRIVE_FOLDER_ID: ${{ secrets.F27_PRIVATE_SHARED_DRIVE_ROOT_ID }}
          TRACK_B_BACKUP_GOOGLE_CREDENTIALS_JSON: ${{ secrets.TRACK_B_BACKUP_GOOGLE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$TRACK_B_BACKUP_DRIVE_FOLDER_ID" ] \
            || [ -z "$TRACK_B_BACKUP_GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error::The protected F27 Shared Drive root and credential secrets are not both configured"
            exit 1
          fi
          root_hash="$(node -e "process.stdout.write(require('node:crypto').createHash('sha256').update(process.env.TRACK_B_BACKUP_DRIVE_FOLDER_ID, 'utf8').digest('hex'))")"
          if [ "$root_hash" != "$EXPECTED_F27_SHARED_DRIVE_ROOT_ID_SHA256" ]; then
            echo "::error::The F27 Shared Drive root secret is not the reviewed root"
            exit 1
          fi
          if ! node operator/scripts/f27-private-snapshot-store.js \
            --artifact-kind edge-source \
            --source "$F27_CAPTURED_BUNDLE" \
            --expected-sha256 "$ROLLBACK_BUNDLE_SHA256" \
            > "$F27_PRIVATE_DIR/store-receipt.json"; then
            echo "::error::Storing the sealed prior-three bundle in the F27 Shared Drive root failed; nothing was deployed"
            exit 1
          fi
          node - "$F27_PRIVATE_DIR/store-receipt.json" <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (receipt.status !== 'PASS'
            || receipt.artifact_kind !== 'edge-source'
            || receipt.source_bundle_sha256 !== process.env.ROLLBACK_BUNDLE_SHA256
            || String(receipt.byte_length) !== process.env.ROLLBACK_BUNDLE_BYTE_LENGTH
            || receipt.independent_private_readback !== 'PASS') {
            throw new Error('private prior-three store receipt mismatch');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '- Sealed bundle stored content-addressed in the F27 Shared Drive root: PASS (independent readback)\n');
          NODE
          # The fetch below must read it back from Drive, not from this runner.
          rm -f -- "$F27_CAPTURED_BUNDLE"
          rmdir -- "$F27_PRIVATE_DIR/capture"

      # F27 artifacts live at the root of the "SyncView Backups" Shared Drive,
      # not in its "track-b-backups" weekly-snapshot child.
      - name: Fetch and independently verify the sealed prior-three source
        shell: bash
        env:
          F27_PRIVATE_SHARED_DRIVE_ROOT_ID: ${{ secrets.F27_PRIVATE_SHARED_DRIVE_ROOT_ID }}
          TRACK_B_BACKUP_GOOGLE_CREDENTIALS_JSON: ${{ secrets.TRACK_B_BACKUP_GOOGLE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          # The confirmation names the exact bundle this run will deploy against:
          # the given one, or the one sealed above.
          export F27_CONFIRM_PRIVATE_SNAPSHOT_FETCH="FETCH_PRIVATE_EDGE_SOURCE:$ROLLBACK_BUNDLE_SHA256"
          if [ -z "$F27_PRIVATE_SHARED_DRIVE_ROOT_ID" ] \
            || [ -z "$TRACK_B_BACKUP_GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error::The protected F27 Shared Drive root and credential secrets are not both configured"
            exit 1
          fi
          private_dir="${F27_PRIVATE_DIR:-}"
          if [ -z "$private_dir" ]; then
            private_dir="$(mktemp -d "$RUNNER_TEMP/f27-section4.XXXXXX")"
            chmod 700 "$private_dir"
            echo "F27_PRIVATE_DIR=$private_dir" >> "$GITHUB_ENV"
          fi
          bundle="$private_dir/prior-three.sourcebundle"
          echo "F27_PRIOR_THREE_BUNDLE=$bundle" >> "$GITHUB_ENV"
          if ! node operator/scripts/f27-private-snapshot-fetch.js \
            --artifact-kind edge-source \
            --destination "$bundle" \
            --expected-sha256 "$ROLLBACK_BUNDLE_SHA256" \
            --expected-byte-length "$ROLLBACK_BUNDLE_BYTE_LENGTH" \
            > "$private_dir/fetch-receipt.json"; then
            echo "::error::The sealed prior-three private fetch or independent round-trip failed"
            exit 1
          fi
          node - "$private_dir/fetch-receipt.json" <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (receipt.status !== 'PASS'
            || receipt.artifact_kind !== 'edge-source'
            || receipt.source_bundle_sha256 !== process.env.ROLLBACK_BUNDLE_SHA256
            || String(receipt.byte_length) !== process.env.ROLLBACK_BUNDLE_BYTE_LENGTH
            || receipt.folder_id_sha256 !== process.env.EXPECTED_F27_SHARED_DRIVE_ROOT_ID_SHA256
            || receipt.independent_private_readback !== 'PASS'
            || receipt.local_private_readback !== 'PASS') {
            throw new Error('private prior-three source receipt mismatch');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '- Sealed prior-three private fetch: PASS',
            `- F27 Shared Drive root ID SHA-256: \`${receipt.folder_id_sha256}\``,
            '',
          ].join('\n'));
          NODE

      - name: Inspect the exact sealed prior-three rollback set
        shell: bash
        working-directory: operator
        run: |
          set -euo pipefail
          # The reason, in the run log.
          #
          # Every provider readback below already writes its stderr to a file
          # under the private directory, and that directory is destroyed by the
          # cleanup step. On 2026-08-07 the final four-function verification
          # failed and the ONLY line published was "the capture failed" — the
          # cause went into the file and died with it, which cost an entire
          # diagnosis cycle against a production state that turned out correct.
          #
          # Both scripts prefix their own failures with a fixed formatter
          # (f27-edge-source-rollback: CODE: message, ef-fingerprint: message)
          # over an allowlisted vocabulary. Only those lines are echoed, capped
          # in length and count, so nothing else in the file can reach the log.
          public_failure() {
            [ -f "$1" ] || return 0
            grep -aoE '^(f27-edge-source-rollback|ef-fingerprint): .{0,200}' "$1" | head -3 || true
          }
          if ! node scripts/f27-edge-source-rollback.js inspect \
            --slugs=production-write,deliverable-write,batch-write \
            --bundle="$F27_PRIOR_THREE_BUNDLE" \
            --expected-bundle-sha256="$ROLLBACK_BUNDLE_SHA256" \
            > "$F27_PRIVATE_DIR/prior-inspect.json" \
            2> "$F27_PRIVATE_DIR/prior-inspect.error"; then
            public_failure "$F27_PRIVATE_DIR/prior-inspect.error"
            echo "::error::The sealed prior-three source set failed structural verification"
            exit 1
          fi
          node - "$F27_PRIVATE_DIR/prior-inspect.json" <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = [
            'batch-write',
            'deliverable-write',
            'production-write',
          ];
          const rows = Array.isArray(receipt.functions) ? receipt.functions : [];
          if (receipt.result !== 'PASS'
            || receipt.operation !== 'inspect'
            || receipt.rollback_standard !== 'source-exact-readback'
            || receipt.provider_source_exactness !== 'PASS'
            || receipt.function_count !== 3
            || receipt.sealed_bundle_sha256 !== process.env.ROLLBACK_BUNDLE_SHA256
            || String(receipt.sealed_bundle_byte_length) !== process.env.ROLLBACK_BUNDLE_BYTE_LENGTH
            || rows.length !== expected.length) {
            throw new Error('prior-three inspection receipt mismatch');
          }
          for (let index = 0; index < expected.length; index += 1) {
            const row = rows[index] || {};
            const slug = expected[index];
            if (row.slug !== slug
              || !/^[0-9]+$/.test(String(row.captured_version))
              || row.rollback_standard !== 'source-exact-readback'
              || typeof row.verify_jwt !== 'boolean'
              || !/^[0-9a-f]{64}$/.test(String(row.source_closure_sha256))
              || !/^[0-9a-f]{64}$/.test(String(row.entrypoint_sha256))
              || !/^[0-9a-f]{64}$/.test(String(row.function_manifest_sha256))
              || !Number.isSafeInteger(row.file_count) || row.file_count < 1
              || row.provider_source_file_count !== row.file_count) {
              throw new Error(`prior-three inspection mismatch for ${slug}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '- Prior source set: PASS (exactly 3 functions)',
            '- Prior JWT posture capture: PASS (3 exact boolean values)',
            ...rows.map(row => `- Prior \`${row.slug}\`: version \`${row.captured_version}\`, source \`${row.source_closure_sha256}\`, entrypoint hash \`${row.entrypoint_sha256}\`, JWT \`verify_jwt=${row.verify_jwt}\``),
            '',
          ].join('\n'));
          NODE

      - name: Check out exactly the reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          path: release
          persist-credentials: false

      - name: Verify the exact reviewed checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C release rev-parse HEAD)"
          if [ "$actual" != "$DEPLOY_COMMIT" ]; then
            echo "::error::Reviewed release checkout does not match commit_sha"
            exit 1
          fi
          if [ -n "$(git -C release status --porcelain)" ]; then
            echo "::error::Reviewed release checkout is not clean"
            exit 1
          fi

      - name: Install exact Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Verify exact Supabase CLI and Docker bundler
        shell: bash
        run: |
          set -euo pipefail
          cli_version="$(supabase --version 2>/dev/null | tr -d '\r\n')"
          if [ "$cli_version" != "$EXPECTED_CLI_VERSION" ]; then
            echo "::error::Supabase CLI version is not exactly 2.109.0"
            exit 1
          fi
          if ! docker info --format '{{.ServerVersion}}' > /dev/null 2>&1; then
            echo "::error::The local Docker bundler is unavailable"
            exit 1
          fi
          {
            echo "- Supabase CLI: \`$cli_version\`"
            echo "- Docker bundler: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      # The bundler image, pulled before any deploy and retried.
      #
      # A `--use-docker` deploy with CLI 2.109.0 runs
      # `docker run public.ecr.aws/supabase/edge-runtime:<tag> bundle ...`, and
      # docker pulls the image on first use, once, from that one registry. A
      # refused or throttled pull fails the deploy in about a second, after the
      # gates and before anything is bundled: the shape of run 38933979961
      # (2026-10-16, production-write failed in 1.6 s on a fresh runner whose
      # image had changed since the 2026-10-09 success, where the same step took
      # 24 s including the pull). public.ecr.aws answers anonymous reads with
      # 429 TOOMANYREQUESTS "Data limit exceeded" intermittently (measured
      # 2026-10-16: 13 of 15 manifest reads of this very tag). Pulling here, by
      # the pinned digest, with retries and then from the ghcr.io copy (the
      # same digest, so the same bytes), means the deploy finds the image
      # locally and never pulls. No secret is in this step.
      - name: Pre-pull the exact Edge Runtime bundler image (retried)
        if: inputs.operation == 'deploy-reviewed-release' || inputs.operation == 'restore-captured-prior-three'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_INTERNAL_IMAGE_REGISTRY:-}" ]; then
            echo "::error::SUPABASE_INTERNAL_IMAGE_REGISTRY would move the bundler image; it must be unset"
            exit 1
          fi
          if [ -e release/supabase/.temp/edge-runtime-version ]; then
            echo "::error::The reviewed checkout overrides the Edge Runtime version"
            exit 1
          fi
          cli_path="$(readlink -f "$(command -v supabase)")"
          named="$(grep -aoE '"edge-runtime":"[0-9][0-9.]*"' "$cli_path" | sort -u)"
          if [ "$named" != "\"edge-runtime\":\"${EXPECTED_EDGE_RUNTIME_TAG#v}\"" ]; then
            echo "::error::The installed Supabase CLI does not bundle with Edge Runtime $EXPECTED_EDGE_RUNTIME_TAG; re-derive EXPECTED_EDGE_RUNTIME_TAG"
            exit 1
          fi
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::The bundler image digest is pinned for linux/amd64 runners"
            exit 1
          fi
          image="public.ecr.aws/supabase/edge-runtime:$EXPECTED_EDGE_RUNTIME_TAG"
          pull_log="$RUNNER_TEMP/edge-runtime-pull.log"
          source_registry=""
          for registry in public.ecr.aws ghcr.io; do
            pinned="$registry/supabase/edge-runtime@$EXPECTED_EDGE_RUNTIME_AMD64_DIGEST"
            for delay in 0 10 30 60; do
              sleep "$delay"
              if docker pull --quiet "$pinned" > "$pull_log" 2>&1; then
                docker tag "$pinned" "$image"
                source_registry="$registry"
                break 2
              fi
              echo "Pull of the bundler image from $registry failed: $(tail -n 1 "$pull_log" | tr -d '\r' | cut -c1-200)"
            done
          done
          if [ -z "$source_registry" ] || ! docker image inspect "$image" > /dev/null 2>&1; then
            echo "::error::The Edge Runtime bundler image could not be pulled from either registry; nothing was deployed"
            exit 1
          fi
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          {
            echo "- Edge Runtime bundler image: \`$image\` pinned to \`$EXPECTED_EDGE_RUNTIME_AMD64_DIGEST\`, pulled from $source_registry"
            echo "  - Local image id: \`$image_id\`"
          } >> "$GITHUB_STEP_SUMMARY"

