      # moves. File count unchanged at 5.
      # Re-pinned 2026-09-01 (twenty-fifth release): ASSET ACCESS OPENS ACROSS
      # TEAMS. staffAssetReadAllowed no longer requires a creative's team to
      # match the row's, and `attachment` moves above the team match beside
