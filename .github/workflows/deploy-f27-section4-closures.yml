              || row.entrypoint_sha256 !== captured.entrypoint_sha256
              || row.function_manifest_sha256 !== captured.function_manifest_sha256
              || row.file_count !== captured.file_count
              || row.provider_source_file_count !== captured.provider_source_file_count
              || row.deployed_source_readback !== 'PASS'
              || !/^[0-9]+$/.test(String(row.restored_active_version))
              || String(finalRow.captured_version) !== String(row.restored_active_version)
              || finalRow.verify_jwt !== captured.verify_jwt
              || finalRow.source_closure_sha256 !== captured.source_closure_sha256
              || finalRow.entrypoint_sha256 !== captured.entrypoint_sha256
              || finalRow.file_count !== captured.file_count
              || finalRow.provider_source_file_count !== captured.provider_source_file_count) {
