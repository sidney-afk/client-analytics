      # migrations/2026-08-31-batch-asset-write.sql, without which the operation
      # answers 500 write_failed. File count unchanged at 5, so closure
      # membership did not move.
      # Re-pinned 2026-08-31 (twentieth release, folded into the nineteenth
      # before either shipped): two protected READS join batch_asset. The asset
      # snapshot falls back to the link on the card BOUND to a deliverable when
      # it carries no canonical file of its own, and reports which surface that
