            }
          }
          /*
           * WHAT IS RUNNING, not merely THAT IT PASSED.
           *
           * This receipt used to end at "PASS" for all four. The restore path
           * has always printed its per-slug versions and hashes; the forward
           * path did not, so after a deploy nothing in the repository or the
           * run log attested which version of each function was live.
           *
           * That is F51, and on 2026-08-05 it cost two full diagnosis cycles:
           * a stale `production-write` was assumed to match the repository, and
           * two separate defects (an unfollowed 303 on the artifact probe, and
           * an attribution stamp that turned out to be absent rather than
           * partial) were each investigated against source that was not the
           * source running. Both are the same missing fact.
           *
           * Every value below is public-safe: slug, integer version, source
           * closure hash, entrypoint hash, JWT posture, provider bundle hash.
           * Copy the ATTESTATION block into EXECUTION_LOG.md after the run.
           */
          const attestation = rows.map(row => ({
            slug: row.slug,
            active_version: String(row.version),
            source_closure_sha256: row.live_fingerprint,
            entrypoint_sha256: (expected.get(row.slug) || [])[2],
            provider_bundle_sha256: row.bundle_fingerprint,
            verify_jwt: row.verify_jwt,
          })).sort((a, b) => a.slug.localeCompare(b.slug));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '',
            '- Forward deployment: PASS',
            '- Deployed function count: `4`',
            '- Strict serial provider readbacks: PASS',
            '- Final four-function source/entrypoint/JWT/version/provider comparison: PASS',
            '',
            '### Deployed versions — record these in `EXECUTION_LOG.md`',
            '',
            '| function | active version | source closure SHA-256 | JWT |',
            '|---|---:|---|---|',
            ...attestation.map(row => `| \`${row.slug}\` | \`${row.active_version}\` | \`${row.source_closure_sha256}\` | \`verify_jwt=${row.verify_jwt}\` |`),
            '',
            `Deployed from commit \`${process.env.DEPLOY_COMMIT}\`.`,
            '',
            '```json',
            JSON.stringify({
              schema: 'syncview_f27_section4_deployed_versions_v1',
              deploy_commit: process.env.DEPLOY_COMMIT,
              github_run_id: process.env.GITHUB_RUN_ID,
              functions: attestation,
            }, null, 2),
            '```',
            '',
            'Any failed or ambiguous forward response must never be retried. Use the separately confirmed captured-prior restore operation.',
          ].join('\n') + '\n');
          NODE

      - name: Restore the exact captured prior four
        if: inputs.operation == 'restore-captured-prior-four'
        shell: bash
        working-directory: operator
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          F27_EDGE_ROLLBACK_CONFIRM: RESTORE_CAPTURED_SOURCE_SET:batch-write,deliverable-write,linear-outbound,production-write
        run: |
          set -euo pipefail
          # The reason, in the run log.
          #
          # Every provider readback below already writes its stderr to a file
