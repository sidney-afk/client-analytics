            "$F27_PRIVATE_DIR/restore-receipt.json" \
            "$F27_PRIVATE_DIR/final-restored-four-capture.json" <<'NODE'
          const fs = require('fs');
          const prior = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const restored = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const finalCapture = JSON.parse(fs.readFileSync(process.argv[4], 'utf8'));
          const priorRows = new Map((prior.functions || []).map(row => [row.slug, row]));
          const rows = Array.isArray(restored.functions) ? restored.functions : [];
          const finalRows = new Map((finalCapture.functions || []).map(row => [row.slug, row]));
          if (restored.result !== 'PASS'
            || restored.operation !== 'restore'
            || restored.rollback_standard !== 'source-exact-readback'
            || restored.function_count !== 4
            || restored.sealed_bundle_sha256 !== process.env.ROLLBACK_BUNDLE_SHA256
            || restored.deployed_source_readback !== 'PASS'
            || rows.length !== 4
            || finalCapture.result !== 'PASS' || finalCapture.operation !== 'capture'
            || finalCapture.function_count !== 4 || finalRows.size !== 4
            || finalCapture.aggregate_source_sha256 !== prior.aggregate_source_sha256) {
            throw new Error('captured-prior restore receipt mismatch');
          }
          for (const row of rows) {
            const captured = priorRows.get(row.slug);
