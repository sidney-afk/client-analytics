name: Deploy hiring-automation

# Deliberate exact-SHA release lane for the private n8n hiring bridge. The
# function rejects every request until its dedicated server-to-server key is
# configured, and it never enables the separate invitation flag.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA from main to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-hiring-automation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      PROJECT_REF: uzltbbrjidmjwwfakwve
      EXPECTED_CLI_VERSION: 2.109.0
      DEPLOY_COMMIT: ${{ inputs.commit_sha }}
    steps:
      - name: Validate the dispatched SHA is on main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require main ancestry
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_COMMIT="$(printf '%s' "$DEPLOY_COMMIT" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          echo "DEPLOY_COMMIT=$DEPLOY_COMMIT" >> "$GITHUB_ENV"
          if ! [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be one exact 40-character SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$DEPLOY_COMMIT" origin/main; then
            echo "::error::The dispatched SHA is not on main"
            exit 1
          fi

      - name: Check out the reviewed release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Run hiring automation contract
        shell: bash
        run: node test/hiring-automation-contract.js

      - name: Verify source stays server-to-server only
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'HIRING_AUTOMATION_KEY' supabase/functions/hiring-automation/index.ts
          grep -Fq 'hiring_capture_application_v1' supabase/functions/hiring-automation/index.ts
          grep -Fq 'hiring_record_invite_result_v1' supabase/functions/hiring-automation/index.ts

      - name: Deploy hiring-automation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured in the production Environment"
            exit 1
          fi
          supabase --version | grep -qx "$EXPECTED_CLI_VERSION"
          supabase functions deploy hiring-automation \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt --yes

      - name: Read back the deployed fingerprint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ef-fingerprint.js "$DEPLOY_COMMIT" \
            --slugs=hiring-automation --format=json > readback.json
          node - readback.json <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const row = (receipt.results || [])[0] || {};
          if (row.result !== 'PASS' || row.verify_jwt !== false
            || row.entrypoint_match !== true
            || row.expected_fingerprint !== row.live_fingerprint) {
            throw new Error('hiring-automation readback mismatch: ' + JSON.stringify({
              result: row.result,
              verify_jwt: row.verify_jwt,
              entrypoint_match: row.entrypoint_match,
            }));
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## hiring-automation deploy',
            `- Readback: PASS (deployed == reviewed at \`${process.env.DEPLOY_COMMIT}\`)`,
            `- Active version: \`${row.version}\``,
            `- Source closure SHA-256: \`${row.live_fingerprint}\``,
            '- JWT posture: `verify_jwt=false`; private automation key remains separately required.',
          ].join('\n') + '\n');
          NODE
          rm -f readback.json
