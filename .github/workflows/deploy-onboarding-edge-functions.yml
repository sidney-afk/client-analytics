name: Deploy staff-sensitive edge functions

# Auto-deploys onboarding, credentials, filming-plan, and SMM-report functions
# plus their shared role-key helper whenever they change on main, or on manual
# dispatch. The Track-B write/read set — linear-outbound, production-write,
# production-comments, production-archive — is manual-only: it must come from an
# exact commit already on main, and within the set the provider and the write
# gateway deploy BEFORE the comment/archive readers: the new reader emits
# can_edit/can_delete and unlocks the lifecycle UI, so a new reader running
# against the old production-write would let an edit be mis-handled as a create
# (silent duplicate comment). A normal merge/push must never deploy that set.
#
# Secret exposure is fenced by the release order, not just by the deploy step's
# own auth: main-ancestry validation runs FIRST, from the trusted default
# branch, with no repository script executed and no production secret in scope.
# Only after a dispatched commit is proven to be on main is its (now trusted)
# working tree checked out, and only the deploy/attestation steps that need it
# carry SUPABASE_ACCESS_TOKEN — the job never exposes it job-wide. The job also
# runs in the `production` GitHub Environment so a branch copy of this workflow
# cannot reach the production secret at all. Role keys and transition-only
# legacy passphrases live as Supabase function secrets, never in this repository.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/onboarding-list/**'
      - 'supabase/functions/ai-onboarding-list/**'
      - 'supabase/functions/legacy-onboarding-list/**'
      - 'supabase/functions/onboarding-full/**'
      - 'supabase/functions/client-credentials/**'
      - 'supabase/functions/filming-plans/**'
      - 'supabase/functions/smm-weekly-reports/**'
      - 'supabase/functions/key-verify/**'
      - 'supabase/functions/_shared/staff-role-auth.ts'
      - '.github/workflows/deploy-onboarding-edge-functions.yml'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA from main to deploy
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The production Environment gates the deploy secret: its deployment-branch
    # policy must be restricted to `main`, and SUPABASE_ACCESS_TOKEN must live in
    # the environment (not at repo level), so a branch copy of this workflow
    # cannot obtain the token even if it re-implements every step below.
    environment: production
    env:
      PROJECT_REF: uzltbbrjidmjwwfakwve
      DEPLOY_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
    steps:
      # 1. Validate FIRST, from the trusted default branch, with no secret in
      #    scope and no repository script from the dispatched ref executed. A
      #    malicious dispatched commit can therefore neither run code nor read a
      #    production secret before it is proven to be an ancestor of main.
      - name: Check out the trusted default branch for validation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Validate the dispatched commit is on main
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Manual deploys require an exact 40-character commit SHA"
              exit 1
            fi
            git fetch origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$DEPLOY_COMMIT" origin/main; then
              echo "::error::Manual deploy commit is not on origin/main"
              exit 1
            fi
            # Attestor presence is checked at the object level (git cat-file),
            # never by running the pinned commit's script, so validation stays
            # free of dispatched-ref code execution.
            if ! git cat-file -e "$DEPLOY_COMMIT:scripts/ef-fingerprint.js" 2>/dev/null; then
              echo "::error::Pinned commit predates the required Edge Function fingerprint attestor"
              exit 1
            fi
          fi
      # 2. Only now — after ancestry passed — materialize the validated commit.
      #    Proven to be on main, its working tree is trusted to execute.
      - name: Check out the validated deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}
          fetch-depth: 0
      - name: Verify the validated commit is checked out
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$DEPLOY_COMMIT" ]; then
            echo "::error::Checked out $actual instead of requested $DEPLOY_COMMIT"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/ef-fingerprint.js "$DEPLOY_COMMIT" --expected-only --format=json > /dev/null
          fi
          echo "Deploying Edge Functions from $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy push-safe staff-sensitive functions
        id: push_safe_deploy
        # The production secret is scoped to the deploy step only — never the job
        # env — so no validation/checkout step can observe it.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — add it to the production Environment (Settings -> Environments -> production -> Secrets)."
            exit 1
          fi
          for fn in onboarding-list ai-onboarding-list legacy-onboarding-list onboarding-full client-credentials filming-plans smm-weekly-reports key-verify; do
            echo "Deploying $fn…"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
      - name: Deploy pinned Track-B write/read functions
        id: track_b_deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Provider and write gateway first, comment/archive readers last.
          # production-comments (scoped canonical comment reader) and
          # production-archive (protected archive reader) join the set so the
          # whole comment-import window deploys from one pinned commit, never
          # local credentials. The readers deploy AFTER production-write because
          # the new reader emits can_edit/can_delete and unlocks the lifecycle
          # UI: a new reader against the old write gateway would let an edit be
          # mis-handled as a create (silent duplicate comment); the reverse
          # (new writer, old reader) stays safe because the old reader never
          # exposes those flags.
          for fn in linear-outbound production-write production-comments production-archive; do
            echo "Deploying $fn…"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
      - name: Attest pinned manual release
        # Gated on validation + deploy success (no always()): an attestation must
        # never be produced for a run whose ancestry check or deploy failed.
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          {
            echo "## Edge Function release attestation"
            echo
            echo "- Pinned SHA: \`$DEPLOY_COMMIT\`"
            echo "- Push-safe deploy step: \`${{ steps.push_safe_deploy.outcome }}\`"
            echo "- Track-B deploy step: \`${{ steps.track_b_deploy.outcome }}\`"
            echo "- Fingerprint scope: 12 functions deployed by this workflow"
            echo "- JWT posture: expected verify_jwt=false (each function self-authenticates); the attestation FAILs any function whose live posture differs"
            echo "- Drill outcome: \`PENDING\` (the separate service-only TEST drill does not run in this deploy job)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/ef-fingerprint.js "$DEPLOY_COMMIT" \
            --slugs=onboarding-list,ai-onboarding-list,legacy-onboarding-list,onboarding-full,client-credentials,filming-plans,smm-weekly-reports,key-verify,linear-outbound,production-comments,production-archive,production-write \
            --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
