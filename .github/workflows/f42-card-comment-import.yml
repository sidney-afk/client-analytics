name: F42 card-comment import

# The live F42 Calendar/Samples comment import as a guarded button-press, never
# an improvised local run. Manual-only (workflow_dispatch), pinned to an exact
# 40-character commit already on main, split into two dispatches:
#
#   mode: plan   — export a fresh two-surface snapshot from live source cards,
#                  run the source-only planner, and print the eligibility,
#                  per-surface counts, and the apply digest for owner review.
#                  Never writes to the canonical comment tables.
#   mode: apply  — re-export, re-derive, and only import when the operator typed
#                  the exact confirm token AND the re-derived apply digest still
#                  matches the reviewed plan's digest (live-data drift guard).
#                  Applies through the service-only production_comment_card_import
#                  RPC and verifies applied == planned against an independent
#                  count readback.
#
# Uses the repo's existing SUPABASE_SERVICE_ROLE_KEY Actions secret, held in the
# `production` GitHub Environment (restricted to main) so a branch copy of this
# workflow cannot reach it. It never uploads the snapshot or plan (they carry
# private comment bodies) and never prints identities: only body-free AGGREGATE
# counts and the apply digest reach the public run log. The full result JSON —
# which carries per-row receipts (canonical/native comment ids, deliverable
# ids) — is redirected to a file that stays on the runner, never teed to stdout.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA from main to run the import from
        required: true
        type: string
      mode:
        description: plan (review) or apply (live import)
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      import_run_id:
        description: Owner-approved import run id
        required: true
        type: string
      expected_apply_digest:
        description: apply — the apply digest from the reviewed plan run (drift guard)
        required: false
        type: string
      confirm:
        description: apply — type IMPORT_CARD_COMMENTS to authorize the live import
        required: false
        type: string

permissions:
  contents: read

jobs:
  f42-import:
    runs-on: ubuntu-latest
    # The production Environment gates SUPABASE_SERVICE_ROLE_KEY: restrict its
    # deployment branches to main and store the key in the environment (not at
    # repo level) so no branch copy of this workflow can obtain it.
    environment: production
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUN_COMMIT: ${{ inputs.commit_sha }}
      RUN_MODE: ${{ inputs.mode }}
      IMPORT_RUN_ID: ${{ inputs.import_run_id }}
      EXPECTED_APPLY_DIGEST: ${{ inputs.expected_apply_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify pinned commit is exactly on main
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$RUN_COMMIT" ]; then
            echo "::error::Checked out $actual instead of requested $RUN_COMMIT"
            exit 1
          fi
          if ! [[ "$RUN_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The import requires an exact 40-character commit SHA"
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RUN_COMMIT" origin/main; then
            echo "::error::The import commit is not on origin/main"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set."
            exit 1
          fi
      - name: Export the private two-surface snapshot from live source cards
        shell: bash
        run: |
          node scripts/f42-card-comment-export.js --output snapshot.json
          # Log only body-free shape; the snapshot file stays on the runner.
          node -e "const s=require('./snapshot.json');console.log('exported',s.surfaces.calendar.length,'calendar +',s.surfaces.sxr.length,'sxr cards')"
      - name: Plan (review only, no writes)
        if: inputs.mode == 'plan'
        shell: bash
        run: |
          set -o pipefail
          # Redirect (never tee) the full result to a runner-local file: it can
          # carry per-surface coverage detail and must not reach the public log.
          # Only aggregate counts + the digest are echoed below.
          node scripts/f42-card-comment-apply.js \
            --input snapshot.json --import-run-id "$IMPORT_RUN_ID" \
            > plan-summary.json
          node -e "const r=require('./plan-summary.json'); if(r.status!=='READY'){console.error('::error::plan not READY (see runner-local plan-summary.json); reasons count:',Array.isArray(r.reasons)?r.reasons.length:0);process.exit(2)}"
          {
            echo "## F42 import — PLAN"
            echo
            node -e "const r=require('./plan-summary.json');console.log('- status: '+r.status);console.log('- planned imports: '+Number(r.planned_imports||0));console.log('- conflicts: '+Number(r.conflicts||0));console.log('- apply digest: \`'+String(r.apply_digest||'')+'\`')"
            echo
            echo "Re-run this workflow with mode=apply, the same import_run_id, expected_apply_digest set to the digest above, and confirm=IMPORT_CARD_COMMENTS."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply (live import, owner-confirmed + digest-pinned)
        if: inputs.mode == 'apply'
        env:
          F42_CONFIRM_CARD_COMMENT_IMPORT: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -o pipefail
          if [ -z "$EXPECTED_APPLY_DIGEST" ]; then
            echo "::error::apply requires expected_apply_digest from the reviewed plan run"
            exit 1
          fi
          # Redirect (never tee) the full result to a runner-local file: the
          # APPLY result carries per-row receipts (canonical/native comment ids,
          # deliverable ids) that must never reach the public log. Only aggregate
          # counts + the digest are echoed below.
          node scripts/f42-card-comment-apply.js \
            --input snapshot.json --import-run-id "$IMPORT_RUN_ID" \
            --expect-apply-digest "$EXPECTED_APPLY_DIGEST" --apply \
            > apply-summary.json
          node -e "const r=require('./apply-summary.json'); if(r.status!=='APPLIED'){console.error('::error::apply not APPLIED (see runner-local apply-summary.json); status:',String(r.status||''));process.exit(2)}"
          {
            echo "## F42 import — APPLY"
            echo
            node -e "const r=require('./apply-summary.json');const c=(r.verification&&r.verification.checks)||{};console.log('- status: '+r.status);console.log('- applied: '+Number(r.applied_count||0));console.log('- apply digest: \`'+String(r.apply_digest||'')+'\`');console.log('- readback links/comments: '+Number(c.card_link_count||0)+' / '+Number(c.comment_count||0))"
          } >> "$GITHUB_STEP_SUMMARY"
