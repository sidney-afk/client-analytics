# Lane ticker: dispatches the frequent monitoring lanes on their real cadence.
#
# Why: GitHub's scheduler delivers this repo's 5/15/30-minute crons only every
# ~3-8 hours (measured 2026-09-28: native-notification-sender, cron */5, ran at
# 01:40, 07:38 and 15:58 UTC). The dead-man's switch then correctly reports
# those lanes stale. The retired Linear pager used to dispatch lanes on time;
# nothing replaced it. This ticker does, instead of widening any threshold.
#
# One long job loops for ~5h40m, dispatching each lane when its interval is
# due, then dispatches a fresh ticker before it ends. The hourly cron only
# restarts the chain if it ever breaks; a second ticker exits at once.
# Dispatches made with GITHUB_TOKEN do start workflow_dispatch runs.
# The two dormant censuses get scheduled_tick=true, so they stay dormant
# exactly as on a timer run.
name: Lane ticker

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Exit if another ticker is already running
        id: solo
        shell: bash
        run: |
          # A hand-over ticker starts while its predecessor is still finishing,
          # so wait up to 10 minutes for others to end before deciding.
          for i in $(seq 1 20); do
            others=$(gh run list --workflow lane-ticker.yml --status in_progress --json databaseId \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
            [ "$others" = "0" ] && break
            sleep 30
          done
          if [ "$others" != "0" ]; then echo "Another ticker is running; exiting."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - name: Dispatch lanes on cadence
        if: steps.solo.outputs.run == 'true'
        shell: bash
        run: |
          # lane file | interval minutes | extra dispatch fields
          LANES=(
            "native-notification-sender.yml|5|"
            "native-notification-monitor.yml|5|"
            "native-intake-completion.yml|15|"
            "native-intake-completion-monitor.yml|15|"
            "syncview-retirement-census.yml|30|-f scheduled_tick=true"
            "outbox-debt-census.yml|30|-f scheduled_tick=true"
            "card-calendar-status-drift.yml|60|"
          )
          declare -A last
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            now=$(date +%s)
            for entry in "${LANES[@]}"; do
              IFS='|' read -r file every extra <<< "$entry"
              prev=${last[$file]:-0}
              if [ $(( now - prev )) -ge $(( every * 60 )) ]; then
                # shellcheck disable=SC2086
                if gh workflow run "$file" --ref main $extra; then last[$file]=$now
                else echo "::warning::dispatch of $file failed; retrying next pass"; fi
              fi
            done
            sleep 60
          done

      - name: Hand over to a fresh ticker
        if: always() && steps.solo.outputs.run == 'true'
        run: gh workflow run lane-ticker.yml --ref main
