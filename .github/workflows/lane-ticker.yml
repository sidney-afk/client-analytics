# Lane ticker: dispatches the frequent monitoring lanes on their real cadence.
#
# Why: GitHub's scheduler delivers this repo's 5/15/30-minute crons only every
# ~3-8 hours (measured 2026-09-28: native-notification-sender, cron */5, ran at
# 01:40, 07:38 and 15:58 UTC). The dead-man's switch then correctly reports
# those lanes stale. The retired Linear pager used to dispatch lanes on time;
# nothing replaced it. This ticker does, instead of widening any threshold.
#
# One long job loops for ~5h40m, dispatching each lane when its interval is
# due, then dispatches a fresh ticker before it ends. Workflow concurrency
# keeps exactly one ticker running and at most one waiting (the hand-over);
# the hourly cron only restarts the chain if it ever breaks.
# Dispatches made with GITHUB_TOKEN do start workflow_dispatch runs.
#
# KILL SWITCH (one step): disable this workflow in the Actions tab. The
# running ticker checks that state before every pass and stops within a
# minute without handing over. Cancelling a run also skips the hand-over.
name: Lane ticker

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: lane-ticker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch lanes on cadence
        shell: bash
        run: |
          # lane file | interval minutes | extra dispatch fields
          LANES=(
            "native-notification-sender.yml|5|"
            "native-notification-monitor.yml|5|"
            "native-intake-completion.yml|15|"
            "native-intake-completion-monitor.yml|15|"
            "card-calendar-status-drift.yml|60|"
          )
          declare -A last
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            # `gh workflow view` has no --json flag, so the old check always read
            # "unknown" and stopped the ticker within seconds of every start.
            state=$(gh api "repos/$GH_REPO/actions/workflows/lane-ticker.yml" --jq .state || echo unknown)
            if [ "$state" != "active" ]; then echo "Ticker workflow is $state; stopping."; echo "stopped=true" >> "$GITHUB_ENV"; break; fi
            now=$(date +%s)
            for entry in "${LANES[@]}"; do
              IFS='|' read -r file every extra <<< "$entry"
              prev=${last[$file]:-0}
              if [ $(( now - prev )) -ge $(( every * 60 )) ]; then
                # shellcheck disable=SC2086
                if gh workflow run "$file" --ref main $extra; then last[$file]=$now
                else echo "::warning::dispatch of $file failed; retrying next pass"; fi
              fi
            done
            sleep 60
          done

      - name: Hand over to a fresh ticker
        if: success() && env.stopped != 'true'
        run: gh workflow run lane-ticker.yml --ref main
