name: Linear ⇄ deliverables reconcile v2

# Track B B3 measuring instrument. Compares every live deliverable against its
# Linear issue across the full field scope. Default is dry-run; healing requires
# an explicit workflow input and still routes through deliverable_write.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply Linear-authoritative corrections through deliverable_write'
        type: boolean
        default: false
      cap:
        description: 'Safety cap: abort applying if more than this many rows need correction'
        default: '15'
      team:
        description: 'Optional team filter: video or graphics'
        default: ''
      proof_only:
        description: 'Run the network-write-blocked bounded-reader equivalence proof'
        type: boolean
        default: false
      proof_expected_sha:
        description: 'Exact 40-character workflow SHA required by proof mode'
        default: ''
      proof_baseline_event_id:
        description: 'Reconciler summary event id retained as absolute-count evidence'
        default: ''
      alert_selftest:
        description: 'Send one labelled page through the real alert relay and report the receipt'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linear-deliverables-reconcile-v2
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_STATE_UUID_MAP: ${{ secrets.LINEAR_STATE_UUID_MAP }}
      SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
      # Lets the relay client turn webhook acceptance into a real terminal
      # delivery receipt instead of assuming HTTP 200 means "Sidney saw it".
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_BASE_URL: ${{ vars.N8N_BASE_URL || 'https://synchrosocial.app.n8n.cloud' }}
      APPLY: ${{ github.event.inputs.apply == 'true' }}
      CAP: ${{ github.event.inputs.cap || '15' }}
      RECONCILE_RUN_CLASS: ${{ github.event_name == 'schedule' && 'scheduled-monitor' || github.event.inputs.apply == 'true' && 'manual-apply' || 'manual-monitor' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require reconcile secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$LINEAR_API_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY or LINEAR_API_KEY; refusing to report a green reconcile."
            missing=1
          fi
          exit "$missing"

      - name: Reconcile
        env:
          PROOF_ONLY: ${{ inputs.proof_only }}
          PROOF_EXPECTED_SHA: ${{ inputs.proof_expected_sha }}
          PROOF_BASELINE_EVENT_ID: ${{ inputs.proof_baseline_event_id }}
        shell: bash
        run: |
          if [ "$PROOF_ONLY" = "true" ]; then
            node scripts/linear-deliverables-reconcile.js \
              --read-proof=true \
              --projection-source=actual \
              --expected-sha="$PROOF_EXPECTED_SHA" \
              --baseline-event-id="$PROOF_BASELINE_EVENT_ID"
            exit
          fi
          TEAM_ARG=""
          if [ -n "${{ github.event.inputs.team }}" ]; then
            TEAM_ARG="--team=${{ github.event.inputs.team }}"
          fi
          node scripts/linear-deliverables-reconcile.js "$TEAM_ARG"

      - name: Require non-n8n inbound pager secret
        id: inbound_pager_secret
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [ -z "$SLACK_ALERT_WEBHOOK" ]; then
            echo "::warning::SLACK_ALERT_WEBHOOK is not configured; skipping the optional non-n8n inbound pager. Reconcile failures still fail the run and use GitHub failed-run email."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Page persistent inbound diffs outside n8n
        if: github.event_name == 'schedule' && steps.inbound_pager_secret.outputs.configured == 'true'
        run: node scripts/linear-reconcile-inbound-pager.js

      # The pager only proves what it FOUND. These two steps prove it still
      # LOOKS: the heartbeat records that this lane ran, and the check pages if
      # any monitored lane has gone quiet. Running the check from here as well
      # as from monitoring-deadman.yml is deliberate — the two workflows watch
      # each other, so one dying is still audible.
      - name: Record reconciler pager heartbeat
        if: always() && github.event_name == 'schedule'
        run: node scripts/monitoring-watchdog.js --heartbeat=reconciler_pager --ok=${{ job.status == 'success' }}

      - name: Dead-man's switch — page on any lane without a fresh heartbeat
        if: always() && github.event_name == 'schedule' && steps.inbound_pager_secret.outputs.configured == 'true'
        run: node scripts/monitoring-watchdog.js --check

      - name: Prove the alert path reaches a human
        if: github.event_name == 'workflow_dispatch' && inputs.alert_selftest
        run: node scripts/monitoring-watchdog.js --selftest
