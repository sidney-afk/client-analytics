name: Linear exit isolated preparation

# No production credentials, deployment, dispatch, or provider calls.
# Each matrix job receives a separate disposable PG17 service.
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'test/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      # index.html is built from these, not committed (since 2026-10-15):
      - 'src/index/**'
      - 'scripts/build-index.js'
      - 'scripts/index-modules.js'
      - 'scripts/index-split.js'
      - 'scripts/index-minify.js'
      - '.github/actions/build-index/**'
      - '.gitattributes'
      - 'migrations/**'
      - 'docs/independence/**'
      - 'qa/linear-exit-rehearsal/**'
      - '.github/workflows/linear-exit-preparation-ci.yml'

permissions:
  contents: read

# A newer push to the same pull request replaces the run it supersedes (session
# Express, 2026-10-19: 154 runs in 3 days, none ever cancelled, each holding four
# runners while the account was full). Only pull requests run this workflow.
concurrency:
  group: linear-exit-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-preparation:
    name: Isolated PG17 ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [card-atomic-admission, retirement-switch, workload-native, sheets-mirror-roles]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: postgres
      PGSSLMODE: disable
      F63_REQUIRE_POSTGRES: '1'
      PROOF_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build index.html and js/ from src/index/ (build output, not committed)
        uses: ./.github/actions/build-index
      - name: Verify explicit routing and profile guard
        run: node test/test-suite-routing.js
      - name: Run the isolated profile
        env:
          PROOF_OUTPUT_ROOT: ${{ runner.temp }}/linear-exit-preparation
        run: node scripts/test-suite-routing.js --run-ci-profile '${{ matrix.lane }}'
      - name: State remaining proof scope
        if: always()
        run: echo 'Only this named isolated profile ran. Private-catalog and other release-required profiles remain separately required; this is not full installation or hosted acceptance.' >> "$GITHUB_STEP_SUMMARY"
