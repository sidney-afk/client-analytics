name: SyncView Linear outbound drain

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum outbox rows to inspect
        required: false
        default: "15"
      f2_owner_attestation:
        description: Owner-only F2 evidence intent; ordinary dispatchers leave this blank
        required: false
        default: ""
  repository_dispatch:
    types: [syncview-linear-outbound-drain]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: linear-outbound-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The approval gate applies to OWNER DISPATCH ONLY.
    #
    # This job is scheduled every 10 minutes. The lane ran fine until
    # 2026-08-06T15:15Z; then approval requirements landed on the production
    # environment, run 31120080907 stuck at "waiting", and — because
    # cancel-in-progress is false — every later run queued behind it and was
    # displaced by its successor. The retry lane executed zero times from that
    # moment until the stuck run was cancelled on 2026-08-08 (first green:
    # run 2939, 03:30Z). A correction for the record: an earlier version of
    # this comment claimed the schedule had NEVER executed — the deep run
    # history refutes that, and the wrong history survived review because it
    # was plausible and nobody paged back far enough (2026-08-08 audit).
    #
    # The gate was never protecting the write. A drained row is a write SyncView
    # already decided to send and already attempted; the drainer retries it. What
    # the gate blocked was recovery, not risk.
    #
    # `dispatchEligibility` (scripts/graphics-f2-evidence.js) already encodes
    # exactly this split and has since it was written: `schedule` returns via
    # SCHEDULE_ROUTE needing no attestation, while `workflow_dispatch` demands
    # the owner actor AND a matching GRAPHICS_F2_OWNER_DISPATCH_ATTESTATION. The
    # evidence lane was built expecting the schedule to run. Only the environment
    # gate stopped it.
    #
    # So the gate stays exactly where it earns its place — the owner-attested
    # route, which is also where the attestation secret has to be reachable — and
    # comes off every route that only ever retries.
    #
    # THE CONDITION IS THE ATTESTATION, NOT THE EVENT NAME. Gating on
    # `event_name == 'workflow_dispatch'` reads correct and is wrong: reading the
    # live n8n pager shows its `Trigger Outbound Drainer` node dispatching THIS
    # workflow every 15 minutes through `workflow_dispatch`, carrying only
    # `limit` and no attestation. An event-name gate would have left that path
    # exactly as stuck as before and fixed only the cron — half a fix that looks
    # whole. Gating on the attestation input instead lines the gate up with the
    # thing that actually needs the Environment: `dispatchEligibility` only ever
    # reads the secret on the route that supplies one, and refuses a
    # workflow_dispatch without it regardless of what happens here.
    #
    # `inputs` is null on schedule and repository_dispatch, so both resolve empty
    # and run ungated.
    #
    # SUPABASE_SERVICE_ROLE_KEY is a REPOSITORY secret, not an environment one:
    # six other workflows read it with no environment at all, including
    # production-write-drill.yml, which runs green daily. Ungated runs keep it.
    environment: ${{ inputs.f2_owner_attestation != '' && 'production' || '' }}
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PROJECT_REF: uzltbbrjidmjwwfakwve
      LIMIT: ${{ inputs.limit || github.event.client_payload.limit || '15' }}
      F2_EVIDENCE_DIR: /tmp/graphics-f2-drainer
      F2_CORRELATION_ID: graphics-f2:${{ github.sha }}:${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - name: Require service-role secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set"
            exit 1
          fi

      - name: Drain server-side outbox
        id: drainer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$F2_EVIDENCE_DIR"
          jq -cn \
            --argjson limit "$LIMIT" \
            --arg correlation_id "$F2_CORRELATION_ID" \
            '{limit:$limit,graphics_f2_correlation_id:$correlation_id}' \
            > "$F2_EVIDENCE_DIR/drainer-request.json"
          http_status="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              --header "Content-Type: application/json" \
              --header "X-Syncview-Correlation: $F2_CORRELATION_ID" \
              --data-binary "@$F2_EVIDENCE_DIR/drainer-request.json" \
              --dump-header "$F2_EVIDENCE_DIR/drainer-headers.txt" \
              --output "$F2_EVIDENCE_DIR/drainer-response.json" \
              --write-out '%{http_code}' \
              "https://$PROJECT_REF.supabase.co/functions/v1/linear-outbound"
          )"
          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          jq -e . "$F2_EVIDENCE_DIR/drainer-response.json" > /dev/null
          jq '{
            ok,
            event_id,
            mode,
            counts,
            backlog,
            authority,
            oldest_pending_minutes,
            oldest_pending_alert_threshold_minutes,
            oldest_pending_alert_teams,
            alerts
          }' "$F2_EVIDENCE_DIR/drainer-response.json"
          {
            echo "## SyncView Linear outbound"
            echo '```json'
            jq '{event_id, mode, counts, backlog, authority, oldest_pending_minutes, oldest_pending_alert_threshold_minutes, oldest_pending_alert_teams, alerts}' \
              "$F2_EVIDENCE_DIR/drainer-response.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out receipt builder after the drainer terminal
        id: receipt_source
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Build bounded F2 terminal artifact
        id: evidence
        if: >-
          always() &&
          steps.drainer.outcome == 'success' &&
          steps.receipt_source.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GRAPHICS_F2_OWNER_DISPATCH_ATTESTATION: ${{ secrets.GRAPHICS_F2_OWNER_DISPATCH_ATTESTATION }}
          F2_PROVIDED_OWNER_DISPATCH_ATTESTATION: ${{ inputs.f2_owner_attestation }}
        run: |
          set -euo pipefail
          jq -cn \
            --arg release_sha "${{ github.sha }}" \
            --arg repository "${{ github.repository }}" \
            --arg repository_owner "${{ github.repository_owner }}" \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg workflow_run_attempt "${{ github.run_attempt }}" \
            --arg workflow_event "${{ github.event_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg triggering_actor "${{ github.triggering_actor }}" \
            --arg owner_intent_attestation "$F2_PROVIDED_OWNER_DISPATCH_ATTESTATION" \
            --arg correlation_id "$F2_CORRELATION_ID" \
            --arg http_status "${{ steps.drainer.outputs.http_status }}" \
            '{
              release_sha:$release_sha,
              repository:$repository,
              repository_owner:$repository_owner,
              workflow_run_id:$workflow_run_id,
              workflow_run_attempt:$workflow_run_attempt,
              workflow_event:$workflow_event,
              actor:$actor,
              triggering_actor:$triggering_actor,
              owner_intent_attestation:$owner_intent_attestation,
              correlation_id:$correlation_id,
              http_status:$http_status
            }' > "$F2_EVIDENCE_DIR/context.json"
          node scripts/graphics-f2-evidence.js drainer-terminal \
            --context="$F2_EVIDENCE_DIR/context.json" \
            --headers="$F2_EVIDENCE_DIR/drainer-headers.txt" \
            --body="$F2_EVIDENCE_DIR/drainer-response.json" \
            --output="$F2_EVIDENCE_DIR/linear-outbound-terminal.json" \
            > /dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload bounded F2 terminal artifact
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linear-outbound-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/graphics-f2-drainer/linear-outbound-terminal.json
          if-no-files-found: error
          retention-days: 14

      - name: Require successful drainer terminal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.drainer.outputs.http_status }}" = "200"
          test "$(jq -r '.ok' "$F2_EVIDENCE_DIR/drainer-response.json")" = "true"
