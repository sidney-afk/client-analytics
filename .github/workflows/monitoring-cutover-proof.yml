name: TEST cleanup and roster coverage

# The Linear cutover drill, gap report and duplicate alert selftest were
# retired after the 2026-09-20 native handover and 2026-09-23 key revocation.
# Preserve the still-live, manual TEST residue cleanup and read-only roster
# coverage tools. Neither job runs without an explicit dispatch lane.
on:
  workflow_dispatch:
    inputs:
      lanes:
        description: 'roster (read-only) or cleanup (mutates TEST residue)'
        required: true
        type: choice
        options:
          - roster
          - cleanup
        default: roster
      dispose_outbox_ids:
        description: 'Cleanup only: comma-separated failed outbox row ids, verified before deletion'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: monitoring-cutover-proof
  cancel-in-progress: false

jobs:
  # MUTATES TEST DATA. Disposes of fixtures a previously CRASHED drill could not
  # clean up. Classifies first and refuses to act on an unexpected set.
  test-cleanup:
    if: >-
      inputs.lanes == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      B4_CONFIRM_TEST_MUTATIONS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Explicit dispatch input names rows to drop; the script verifies every
      # named row independently before deleting it.
      - name: Resolve any explicitly named outbox rows
        id: ids
        env:
          INPUT_IDS: ${{ inputs.dispose_outbox_ids }}
        shell: bash
        run: |
          ids="$INPUT_IDS"
          echo "named outbox ids: ${ids:-<none>}"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Classify the residue before touching anything
        run: node scripts/f203-test-residue-cleanup.js --collect-orphans --dispose-outbox-ids="${{ steps.ids.outputs.ids }}"

      - name: Dispose of exactly the classified residue
        run: node scripts/f203-test-residue-cleanup.js --apply --collect-orphans --dispose-outbox-ids="${{ steps.ids.outputs.ids }}"

  # Read-only. Answers "is the TEST client the only row whose second team was
  # never registered?" across the whole roster. Writes nothing and prints counts
  # and team keys only -- the script refuses to emit if any identifier would
  # reach its output, so the result is safe in a public run log.
  roster-coverage:
    if: >-
      inputs.lanes == 'roster'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove the report cannot print an identifier
        run: node test/f200-roster-project-coverage.js

      - name: Audit roster project coverage read-only
        run: |
          node scripts/f200-roster-project-coverage.js | tee artifacts-roster-coverage.json
          {
            echo '### Roster project coverage (counts only)'
            echo ''
            echo '```json'
            cat artifacts-roster-coverage.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
