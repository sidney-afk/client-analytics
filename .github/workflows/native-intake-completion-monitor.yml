name: Native intake completion monitor

# Independent read-only observer. It shares no mutator code path and reports
# unreadable summary data as a failure. GitHub schedule remains best-effort.
on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-intake-completion-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NATIVE_INTAKE_COMPLETION_ENABLED: ${{ vars.NATIVE_INTAKE_COMPLETION_ENABLED || 'false' }}
      NATIVE_INTAKE_COMPLETION_MAX_BACKLOG_AGE_SECONDS: ${{ vars.NATIVE_INTAKE_COMPLETION_MAX_BACKLOG_AGE_SECONDS || '3600' }}
      NATIVE_INTAKE_COMPLETION_MAX_REQUESTS_OWED: ${{ vars.NATIVE_INTAKE_COMPLETION_MAX_REQUESTS_OWED || '0' }}
      NATIVE_INTAKE_COMPLETION_MAX_MISSING_TERMINAL_RECEIPTS: '0'
      NATIVE_INTAKE_COMPLETION_MAX_IDENTITY_CONFLICTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bounded completion health
        shell: bash
        run: |
          if [ "$NATIVE_INTAKE_COMPLETION_ENABLED" != 'true' ]; then
            echo 'native intake completion monitor is DORMANT; protected activation has not been enabled.'
            exit 0
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo '::error::Missing SUPABASE_SERVICE_ROLE_KEY; refusing to report completion healthy.'
            exit 1
          fi
          node scripts/native-intake-completion/monitor.js
      - name: Record completion monitor heartbeat
        if: always()
        run: node scripts/monitoring-watchdog.js --heartbeat=native_intake_completion_monitor --ok=${{ job.status == 'success' }}
