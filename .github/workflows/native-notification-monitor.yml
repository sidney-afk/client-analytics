name: Native notification monitor

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    # The health action fails when blocked/unknown/expired-lease debt exists,
    # leaving an observable run failure. It has no mutation or provider call.
    if: always() && vars.NATIVE_NOTIFICATION_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report notification delivery debt
        env:
          NOTIFY_URL: ${{ secrets.NATIVE_NOTIFICATION_NOTIFY_URL }}
          NOTIFY_RUNNER_KEY: ${{ secrets.NATIVE_NOTIFICATION_RUNNER_KEY }}
        run: |
          test -n "$NOTIFY_URL" && test -n "$NOTIFY_RUNNER_KEY"
          curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "$NOTIFY_URL" \
            -H 'content-type: application/json' \
            -H "x-notify-runner-key: $NOTIFY_RUNNER_KEY" \
            --data '{"action":"health"}'
