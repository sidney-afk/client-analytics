name: Production write-UI shadow audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: production-write-ui-shadow-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      B4_CONFIRM_READ_ONLY_SHADOW: '1'
      APPLY: 'false'
      PRODUCTION_SHADOW_PUBLIC_JSON: artifacts/production-shadow-audit.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require read and telemetry credentials
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$LINEAR_API_KEY" ]; then
            echo "::error::Missing Supabase service role or Linear read credential."
            missing=1
          fi
          exit "$missing"

      - name: Run read-only full-roster shadow audit
        env:
          # runner.temp is a step-level context; naming it in the job env block
          # is invalid and made GitHub reject the whole file, logging an instant
          # failed run on EVERY push to EVERY branch since 2026-07-13 (and the
          # daily audit itself never ran).
          B4_SHADOW_PRIVATE_JSON: ${{ runner.temp }}/production-shadow-private.json
        run: node scripts/production-shadow-audit.js

      # Records that the audit RAN, pass or fail — the same step the write drill
      # has carried since it was wired up, and which this workflow never had.
      #
      # Until 2026-08-07 this lane was dark on BOTH axes. Nothing checked it had
      # run (no heartbeat here, and `production_shadow_audit` was absent from the
      # dead-man's switch lane list), and nothing checked it had passed (the
      # pager's three shadow-audit alerts live in a transform script that was
      # never applied to the live n8n workflow). A daily audit that silently
      # stopped being scheduled was indistinguishable from a daily audit that was
      # passing — which is exactly what happened to it once already: the invalid
      # `runner.temp` reference above meant it never ran at all from 2026-07-13,
      # and the only reason anyone found out was a human reading the file.
      - name: Record shadow-audit heartbeat
        if: always()
        run: node scripts/monitoring-watchdog.js --heartbeat=production_shadow_audit --ok=${{ job.status == 'success' }}

      - name: Upload public-safe aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-shadow-audit
          path: artifacts/production-shadow-audit.json
          if-no-files-found: ignore
          retention-days: 14
