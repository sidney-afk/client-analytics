name: Production write gateway TEST drill

on:
  workflow_dispatch:
    inputs:
      real_graphic_generation:
        description: >-
          F12 ONLY. Drill the submit-graphics path with REAL GRAPHIC_TITLE_*
          generation instead of the routine skip. Costs one live billed
          provider call. TEST fixture only. Leave off for every ordinary run.
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: production-write-gateway-test-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
      B4_CONFIRM_TEST_MUTATIONS: '1'
      PRODUCTION_WRITE_DRILL_REPORT: artifacts/production-write-drill.json
      # Both teams, every run. This is the only check that proves comments and
      # status changes still flow end to end for GRAPHICS as well as Video.
      PRODUCTION_WRITE_DRILL_TEAMS: video,graphics
      # `observe` while the description-mirroring Edge Function revision is
      # undeployed; flip to `enforce` after that deploy to re-arm the assertion.
      # See scripts/production-write-drill.js verifyFixture().
      PRODUCTION_WRITE_DRILL_DESCRIPTION_ROUNDTRIP: observe
      # Empty until the owner provisions it, which parks only the Graphics
      # `smm_approval` transition. Setting the repository variable is the whole
      # change — no code edit follows it. See
      # docs/ops/GRAPHICS_DRILL_ARTIFACT_SETUP.md.
      PRODUCTION_WRITE_DRILL_GRAPHICS_ARTIFACT_URL: ${{ vars.PRODUCTION_WRITE_DRILL_GRAPHICS_ARTIFACT_URL }}
      # F12's switch, and the reason F12 could not be closed by the plan written
      # for it. scripts/production-write-drill.js:23 has always read this name,
      # and :407 forces `skip_graphic_generation` whenever it is unset — but the
      # workflow never passed it and declared no inputs, so NEITHER the cron NOR
      # a dispatch could turn real generation on. GitHub does not inject
      # repository variables as env, so the 2026-07-28 plan ("set the repository
      # variable for that invocation only") would have produced another skipped
      # run that looked green: every artifact to date, including today's, reads
      # `graphic_generation_verified: false`.
      #
      # Wired as an explicit dispatch input rather than a `vars.` entry (unlike
      # the artifact URL above) because this one must be OFF by default and true
      # for exactly one authorized run: it spends a live billed provider call.
      # A schedule run resolves this to '' and skips generation exactly as
      # before, so the nightly lane is unchanged.
      PRODUCTION_WRITE_DRILL_REAL_GRAPHIC_GENERATION: ${{ inputs.real_graphic_generation && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require TEST-only drill configuration
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY LINEAR_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required TEST drill secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Exercise native create and field writes through production-write
        run: node scripts/production-write-drill.js

      # Records that the drill RAN, pass or fail. Without it, a drill that stops
      # being scheduled at all is indistinguishable from a drill that is passing.
      - name: Record write-drill heartbeat
        if: always()
        run: node scripts/monitoring-watchdog.js --heartbeat=production_write_drill --ok=${{ job.status == 'success' }}

      - name: Upload public-safe aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-write-drill
          path: artifacts/production-write-drill.json
          if-no-files-found: ignore
          retention-days: 14
