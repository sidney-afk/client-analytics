name: Rename propagation drain

# Backstop for migrations/2026-09-23-rename-propagation.sql. The browser pokes
# the drain after every rename; this run retries, finishes deferred rows and
# covers renames made with no browser open. GitHub cron is best-effort.
#
# DORMANT until Lighthouse applies the migration and sets the repository
# variable RENAME_PROPAGATION_DRAIN_ENABLED=true. Which directions actually
# propagate is decided by the `rename_propagation` runtime flag, not here.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rename-propagation-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RENAME_PROPAGATION_DRAIN_ENABLED: ${{ vars.RENAME_PROPAGATION_DRAIN_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Drain recorded renames
        shell: bash
        run: |
          if [ "$RENAME_PROPAGATION_DRAIN_ENABLED" != 'true' ]; then
            echo 'rename propagation drain is DORMANT; RENAME_PROPAGATION_DRAIN_ENABLED is not true.'
            exit 0
          fi
          node scripts/rename-propagation-drain.js
