name: Review-note back-fill

# Runs scripts/review-note-backfill.js (OPEN_REPAIRS 452/453) from GitHub
# Actions, where the production Environment holds SUPABASE_SERVICE_ROLE_KEY.
# Manual-only, pinned to an exact 40-character commit already on main, like the
# F42 import lane. The public log gets counts and card ids only: the script
# prints no note text and no names, and its output is not uploaded anywhere.
#
#   dry-run           read only; counts per card id
#   apply             adds the missing notes (idempotent); needs confirm
#   rollback-dry-run  lists what a rollback of run_id would delete or refuse
#   rollback-apply    deletes only that run's untouched rows; needs confirm

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA from main to run from
        required: true
        type: string
      mode:
        description: dry-run, apply, rollback-dry-run or rollback-apply
        required: true
        type: choice
        options: [dry-run, apply, rollback-dry-run, rollback-apply]
        default: dry-run
      since:
        description: Only notes created on or after this date (YYYY-MM-DD)
        required: false
        type: string
        default: '2026-10-01'
      exclude_card:
        description: Comma list of card ids to leave out
        required: false
        type: string
      run_id:
        description: rollback modes - the run id to roll back (review-note-backfill-YYYY-MM-DD)
        required: false
        type: string
      confirm:
        description: apply and rollback-apply - type IMPORT_CARD_COMMENTS
        required: false
        type: string

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUN_COMMIT: ${{ inputs.commit_sha }}
      RUN_MODE: ${{ inputs.mode }}
      SINCE: ${{ inputs.since }}
      EXCLUDE_CARD: ${{ inputs.exclude_card }}
      ROLLBACK_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify pinned commit is exactly on main
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$RUN_COMMIT" ]; then
            echo "::error::Checked out $actual instead of requested $RUN_COMMIT"
            exit 1
          fi
          if ! [[ "$RUN_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The back-fill requires an exact 40-character commit SHA"
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RUN_COMMIT" origin/main; then
            echo "::error::The commit is not on origin/main"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set."
            exit 1
          fi
      - name: Validate the inputs
        shell: bash
        run: |
          if ! [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::since must be YYYY-MM-DD"; exit 1
          fi
          if [ -n "$EXCLUDE_CARD" ] && ! [[ "$EXCLUDE_CARD" =~ ^[A-Za-z0-9_,-]+$ ]]; then
            echo "::error::exclude_card must be a comma list of card ids"; exit 1
          fi
          case "$RUN_MODE" in
            rollback-dry-run|rollback-apply)
              if ! [[ "$ROLLBACK_RUN_ID" =~ ^review-note-backfill-[0-9-]+$ ]]; then
                echo "::error::rollback modes need run_id like review-note-backfill-2026-10-01"; exit 1
              fi ;;
          esac
      - name: Run the back-fill script
        env:
          # Set ONLY for the two apply modes; the script refuses to write
          # without it, and dry-run modes never receive it.
          F42_CONFIRM_CARD_COMMENT_IMPORT: ${{ (inputs.mode == 'apply' || inputs.mode == 'rollback-apply') && inputs.confirm || '' }}
        shell: bash
        run: |
          set -o pipefail
          args=()
          case "$RUN_MODE" in
            dry-run) args+=(--since "$SINCE") ;;
            apply) args+=(--since "$SINCE" --apply) ;;
            rollback-dry-run) args+=(--rollback "$ROLLBACK_RUN_ID") ;;
            rollback-apply) args+=(--rollback "$ROLLBACK_RUN_ID" --apply) ;;
            *) echo "::error::unknown mode"; exit 1 ;;
          esac
          case "$RUN_MODE" in
            dry-run|apply) if [ -n "$EXCLUDE_CARD" ]; then args+=(--exclude-card "$EXCLUDE_CARD"); fi ;;
          esac
          node scripts/review-note-backfill.js "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
