name: Slice 5 TEST drills

# Owner-gated proof for all six drills still owed by
# docs/ops/SLICE5_APPLY_WINDOW.md section 3. This workflow is deliberately
# manual-only and accepts only an exact commit already reachable from main.
# The production Environment holds credentials, but every mutation remains
# hard-scoped by the runner to disposable drill-marked rows under the one active
# TEST client. This lane never changes runtime flags or dispatches production
# work for a real client/member.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact lowercase 40-character commit SHA already on main
        required: true
        type: string
      preflight_only:
        description: >-
          Run preflight checks only, then exit successfully. Creates nothing,
          writes nothing, starts no browser. Use this to debug a preconditon
          failure in ~60 seconds instead of a 1-3 hour full drill.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: slice5-test-drills
  cancel-in-progress: false

jobs:
  drills:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      # Anchor all later request and cleanup deadlines to the Actions job
      # clock, not to the much-later Node process start.
      - name: Start the bounded drill clock
        shell: bash
        run: printf 'SLICE5_JOB_STARTED_AT_MS=%s\n' "$(date +%s%3N)" >> "$GITHUB_ENV"

      # Start from the trusted default branch. Do not ask checkout to resolve
      # the operator-supplied object until its shape and ancestry have passed.
      - name: Check out trusted main for the provenance gate
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify requested commit is an exact ancestor of origin/main
        id: provenance
        shell: bash
        env:
          RUN_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if ! [[ "$RUN_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be exactly 40 lowercase hexadecimal characters"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git cat-file -e "$RUN_COMMIT^{commit}" 2>/dev/null; then
            echo "::error::commit_sha does not resolve to a commit on the trusted main history"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RUN_COMMIT" origin/main; then
            echo "::error::commit_sha is not an ancestor of origin/main"
            exit 1
          fi
          printf 'validated_commit=%s\n' "$RUN_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.provenance.outputs.validated_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reverify exact checked-out commit
        shell: bash
        env:
          RUN_COMMIT: ${{ steps.provenance.outputs.validated_commit }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$RUN_COMMIT" ]; then
            echo "::error::checkout does not match the verified commit"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This repository intentionally has no lockfile. Match its established
      # Playwright workflows without creating one on the runner.
      - name: Install browser test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the guarded TEST-only drill suite
        shell: bash
        env:
          SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ROLE_KEY_ADMIN: ${{ secrets.ROLE_KEY_ADMIN }}
          ROLE_KEY_SMM: ${{ secrets.ROLE_KEY_SMM }}
          ROLE_KEY_CREATIVE: ${{ secrets.ROLE_KEY_CREATIVE }}
          SLICE5_TEST_DRILLS_CONFIRM: 'SLICE5_TEST_ONLY'
          SLICE5_TEST_DRILLS_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          SLICE5_TEST_DRILLS_REPORT: artifacts/slice5-test-drills.json
          SLICE5_TEST_DRILLS_FAILURE_REPORT: artifacts/slice5-test-drills-failure.json
          SLICE5_TEST_DRILLS_PRIVATE_LOG: ${{ runner.temp }}/slice5-test-drills-private.json
        run: |
          missing=0
          for name in \
            SUPABASE_SERVICE_ROLE_KEY LINEAR_API_KEY \
            ROLE_KEY_ADMIN ROLE_KEY_SMM ROLE_KEY_CREATIVE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Slice 5 TEST-drill credential: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          mkdir -p artifacts
          if ! node scripts/slice5-test-drills.js \
            > "${RUNNER_TEMP}/slice5-test-drills-console.log" 2>&1; then
            # Surface WHICH gate refused. Both values are allowlisted enums
            # produced by the script — never a message, detail, stack, id or
            # slug. The console log stays on the ephemeral runner as before.
            stage=unavailable
            code=unavailable
            http=0
            if [ -f artifacts/slice5-test-drills-failure.json ]; then
              stage="$(node -e 'const r=require("./artifacts/slice5-test-drills-failure.json");process.stdout.write(String(r.stage||"unavailable"))' 2>/dev/null || echo unavailable)"
              code="$(node -e 'const r=require("./artifacts/slice5-test-drills-failure.json");process.stdout.write(String(r.failure_code||"unavailable"))' 2>/dev/null || echo unavailable)"
              http="$(node -e 'const r=require("./artifacts/slice5-test-drills-failure.json");process.stdout.write(String(r.http_status||0))' 2>/dev/null || echo 0)"
            fi
            # http_status is 0 when no HTTP call produced the failure. A numeric
            # status names the class of failure without describing any client,
            # issue, project or response body.
            echo "::error::Slice 5 TEST drills failed at stage=${stage} code=${code} http_status=${http}; private detail stayed on the ephemeral runner."
            exit 1
          fi
          echo "Slice 5 TEST drills passed; only the public-safe aggregate will be retained."

      # Runs on failure too: the failure-only report is the artifact a reviewer
      # reads when the drill step exits non-zero, so it must face the same
      # public-safety validator as the aggregate before it is uploaded.
      - name: Validate the public-safe aggregate
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const reportPaths = [
            'artifacts/slice5-test-drills.json',
            'artifacts/slice5-test-drills-failure.json',
          ].filter(p => fs.existsSync(p));
          if (!reportPaths.length) {
            console.log('no drill report was produced; nothing to validate');
            process.exit(0);
          }
          const forbiddenKey = /(?:^|_)(?:id|ids|slug|slugs|time|times|timestamp|timestamps|date|dates|error|errors|message|messages|stack|stacks|detail|details|url|urls|path|paths|name|names)(?:_|$)/i;
          const safeEnums = new Set([
            'pass',
            'passed',
            'fail',
            'not_run',
            'none',
            'test_only',
            'active_test_only',
            'synthetic_identity_shapes_only',
            'supervised_owner_session_required',
            'ready',
            'refused',
            'accepted',
            'degraded',
            'recovered',
            'no_personal_queue',
            'assignee_out_of_scope',
            'assignee_role_incompatible',
            'assignee_mapping_unavailable',
            'assignee_provider_inactive',
            'operation_forbidden',
            'preflight',
            'f94_negative',
            'f94_stale_picker',
            'f136_matrix',
            'f37_identity',
            'f95_convergence',
            'cleanup',
            'flag_invariant',
            'read_rebaseline',
            'report',
            // Public-safe failure codes (FAILURE_CODES in the script) — which
            // gate refused, never why in words. Kept in sync with the script;
            // test/slice5-test-drills.js asserts the two lists match exactly.
            'unclassified_failure',
            'confirm_token_missing',
            'config_invalid',
            'credential_missing',
            'budget_exhausted',
            'test_scope_violation',
            'linear_preflight_mismatch',
            'roster_precondition',
            'refusal_enum_mismatch',
            'zero_mutation_violated',
            'gateway_status_mismatch',
            'browser_close_timeout',
            'cleanup_incomplete',
            'flags_changed',
            'report_sanitize_failed',
            'browser_key_unavailable',
            'deadline_unresolved',
            'test_client_not_unique',
            'test_client_not_active_test',
            'write_target_out_of_scope',
            'write_target_client_drift',
            'run_ledger_payload_invalid',
            'synthetic_row_not_run_owned',
            'synthetic_row_marker_missing',
            'synthetic_row_already_exists',
            'rest_write_table_forbidden',
            'rest_write_shape_forbidden',
            'linear_query_not_read_only',
            'linear_read_failed',
            'linear_auth_failed',
            'linear_rate_limited',
            'linear_query_rejected',
            'runtime_flags_unavailable',
            'auth_mode_unrecognized',
            'roster_page_oversized',
            'roster_keyset_unordered',
            'roster_duplicate_ids',
            'roster_page_cap_exceeded',
            'roster_empty',
            'roster_snapshot_missing',
            'roster_changed_during_run',
            'job_clock_invalid',
            'supabase_url_mismatch',
            'role_key_missing',
            'fetch_unavailable',
            'policy_source_unavailable',
            'authority_not_linear',
            'test_project_unavailable',
            'linear_catalog_incomplete',
            'linear_project_unavailable',
            'linear_team_unavailable',
            'provider_pool_incomplete',
            'identity_plan_already_reserved',
            'run_ledger_conflict',
            'run_ledger_insert_failed',
            'identity_plan_mismatch',
            'synthetic_member_insert_incomplete',
            'fixture_plan_mismatch',
            'preflight_only_mutation_blocked',
            'preflight_only_browser_blocked',
            // Whether the provider-inactive negative case could be proven.
            'proven',
            'not_proven_no_inactive_provider',
          ]);
          function validate(value, keyPath) {
            if (typeof value === 'boolean') return;
            if (typeof value === 'number' && Number.isInteger(value) && value >= 0) return;
            if (typeof value === 'string' && safeEnums.has(value)) return;
            if (!value || typeof value !== 'object' || Array.isArray(value)) {
              throw new Error('unsafe_public_aggregate');
            }
            for (const [key, child] of Object.entries(value)) {
              if (forbiddenKey.test(key) && key !== 'error_code') {
                throw new Error('unsafe_public_aggregate');
              }
              validate(child, keyPath ? `${keyPath}.${key}` : key);
            }
          }
          let rejected = 0;
          for (const reportPath of reportPaths) {
            try {
              validate(JSON.parse(fs.readFileSync(reportPath, 'utf8')), '');
              console.log(`public-safe: ${reportPath}`);
            } catch (error) {
              // A rejected report must never be uploaded. Delete it here so the
              // if: failure() upload below cannot publish an unvalidated file,
              // then fail the step.
              rejected += 1;
              try { fs.unlinkSync(reportPath); } catch (_) {}
              console.log(`::error::rejected and deleted unvalidated report: ${reportPath}`);
            }
          }
          if (rejected) process.exit(1);
          NODE

      - name: Upload public-safe drill aggregate
        uses: actions/upload-artifact@v4
        with:
          name: slice5-test-drills
          path: artifacts/slice5-test-drills.json
          if-no-files-found: error
          retention-days: 14

      # Failure-only. Carries the validated {stage, failure_code} pair so a
      # failed dispatch is diagnosable without runner access.
      - name: Upload public-safe drill failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slice5-test-drills-failure
          path: artifacts/slice5-test-drills-failure.json
          if-no-files-found: warn
          retention-days: 14
