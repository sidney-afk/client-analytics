name: SyncView retirement admission census

# Automatic census work is dormant until SYNCVIEW_RETIREMENT_CENSUS_ENABLED
# is true. Manual dispatch remains explicit. Dormant schedules retain only the
# existing heartbeat; they do not query the retirement boundary. Once enabled,
# this monitor continues after retirement to check the SQL high-water.
on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncview-retirement-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://uzltbbrjidmjwwfakwve.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report dormant scheduled census
        if: github.event_name != 'workflow_dispatch' && vars.SYNCVIEW_RETIREMENT_CENSUS_ENABLED != 'true'
        run: echo 'Census is DORMANT; automatic census and its alerts are disabled. Existing host heartbeat remains active.'

      - name: Require census credentials
        if: github.event_name == 'workflow_dispatch' || vars.SYNCVIEW_RETIREMENT_CENSUS_ENABLED == 'true'
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY; refusing to report retirement healthy."
            exit 1
          fi
      - name: Check retirement admission boundary
        if: github.event_name == 'workflow_dispatch' || vars.SYNCVIEW_RETIREMENT_CENSUS_ENABLED == 'true'
        run: node scripts/syncview-retirement-census.js
      - name: Record retirement census heartbeat
        if: always()
        run: node scripts/monitoring-watchdog.js --heartbeat=syncview_retirement_census --ok=${{ job.status == 'success' }}
