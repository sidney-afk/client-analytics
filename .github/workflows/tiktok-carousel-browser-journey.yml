name: TikTok carousel browser journey

# Runs the hermetic Playwright journey for the TikTok Upload photo-carousel
# transport (docs/syncview-design/tests/tiktok-carousel-browser-journey.js).
# It is a standalone `node <path>` invocation, not an npm script, on purpose:
# package.json is fingerprinted by the leave-lifecycle evidence packet
# (test/leave-evidence-fingerprint-coupling.js), so this workflow reads the
# ALREADY-declared `playwright` devDependency rather than adding a script
# entry there. Scoped to a dedicated workflow (mirroring pto-ui-tests.yml)
# rather than folded into calendar-unit-tests.yml's `unit` job, which is
# documented there as reaching no live backend or browser.

on:
  pull_request:
    paths:
      # index.html is built from these, not committed (since 2026-10-15):
      - 'src/index/**'
      - 'scripts/build-index.js'
      - 'scripts/index-modules.js'
      - 'scripts/index-split.js'
      - 'scripts/index-minify.js'
      - '.github/actions/build-index/**'
      - 'docs/syncview-design/tests/tiktok-carousel-browser-journey.js'
      - '.github/workflows/tiktok-carousel-browser-journey.yml'
  push:
    branches:
      - main
    paths:
      # index.html is built from these, not committed (since 2026-10-15):
      - 'src/index/**'
      - 'scripts/build-index.js'
      - 'scripts/index-modules.js'
      - 'scripts/index-split.js'
      - 'scripts/index-minify.js'
      - '.github/actions/build-index/**'
      - 'docs/syncview-design/tests/tiktok-carousel-browser-journey.js'
      - '.github/workflows/tiktok-carousel-browser-journey.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiktok-carousel-browser-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build index.html and js/ from src/index/ (build output, not committed)
        uses: ./.github/actions/build-index
      - name: Install pinned browser-test dependencies
        run: npm install --no-package-lock
      # A fresh `--with-deps` install ran past this job's 10-minute limit on 2026-10-23 (runs
      # 40025111141 and 40033800766, cancelled inside "Install Chromium" before the journey
      # ran). The shared action installs from caches, never waiting on the apt mirror
      # (OPEN_REPAIRS 502).
      - name: Install Chromium and its system libraries
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - name: Run the TikTok carousel browser journey
        run: node docs/syncview-design/tests/tiktok-carousel-browser-journey.js
