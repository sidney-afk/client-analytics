<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expanded · New client draft</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111;font:16px/1.5 'Plus Jakarta Sans',sans-serif}html.dark body{background:#101113;color:#f5f5f3}button,input{font:inherit}header{padding:20px 18px;display:flex;justify-content:space-between;font-weight:800;font-size:27px}.veil{position:fixed;inset:0;background:#0005}.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px;max-height:88vh;overflow:auto}.dark .sheet{background:#191b1e}h2{margin:0;font-size:22px}.top{display:flex;justify-content:space-between;align-items:center}button{border:1px solid #dededc;background:#fff;color:inherit;border-radius:12px;min-height:44px;padding:10px 14px}.dark button,.dark input{background:#22252a;border-color:#42464d;color:inherit}.close{width:44px}p{font-size:14px;color:#5d6168}.dark p,.dark small{color:#b4bac4}label{display:block;font-size:14px;font-weight:700;margin-top:12px}input,.trigger{display:block;width:100%;border:1px solid #dededc;border-radius:12px;min-height:48px;padding:10px 12px;background:#fff;margin-top:6px}small{font-weight:400;color:#5d6168}.picker{position:relative}.trigger{display:flex;justify-content:space-between;text-align:left}.menu{position:absolute;top:calc(100% + 7px);left:0;right:0;z-index:2;background:#fff;border:1px solid #dededc;border-radius:14px;padding:6px;box-shadow:0 18px 48px #0002}.dark .menu{background:#191b1e;border-color:#42464d}.menu button{display:block;width:100%;border:0;text-align:left;background:transparent;font-size:16px;font-weight:500;border-radius:8px}.menu button:hover{background:#eee}.dark .menu button:hover{background:#30343a}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.primary{background:#111;color:white}.dark .primary{background:#f5f5f3;color:#111}
</style><header>Clients <button>Tabs ⌄</button></header><div class="veil"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="New client"><div class="top"><h2>New client</h2><button class="close" aria-label="Close">×</button></div><p>Sets the client up everywhere SyncView needs it, in one step. Nothing is made until you press Create client.</p><label>Client name<input placeholder="First and last name, as the team writes it"></label><label>Social media manager</label><div class="picker"><button class="trigger" onclick="menu.hidden=!menu.hidden" aria-haspopup="listbox">Pick a manager <span>⌄</span></button><div class="menu" id="menu" role="listbox"><button role="option" onclick="pick(this)">Example manager</button><button role="option" onclick="pick(this)">Example manager two</button></div></div><label>Email <small>optional, needed for Slack channels</small><input placeholder="name@example.com"></label><p>Type a name and pick a manager. SyncView will check it before anything is created.</p><div class="actions"><button>Cancel</button><button class="primary" disabled>Create client</button></div></section><script>function pick(n){document.querySelector('.trigger').firstChild.textContent=n.textContent;menu.hidden=true}if(new URLSearchParams(location.search).get('theme')==='dark')document.documentElement.classList.add('dark')</script></html>
