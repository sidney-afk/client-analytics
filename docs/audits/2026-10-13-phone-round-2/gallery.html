<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Phone round 2 comparisons</title><style>body{font:16px system-ui;margin:24px;background:Canvas;color:CanvasText}select{font:inherit;padding:10px;margin-right:12px}.pair{display:flex;gap:20px;flex-wrap:wrap}figure{margin:20px 0}img{width:390px;max-width:100%;height:auto;border-radius:12px}figcaption{margin-bottom:12px}a{color:LinkText}</style><h1>Phone round 2</h1><p>Native app captures at 390 px. All content is fictional.</p><label>Item <select id="item"><option value="01-change-client">1. Change client in Tabs</option><option value="02-more">2. More groups</option><option value="02-more-account">2. Account at the end</option><option value="03-status-vibrant">3. Vibrant status pills</option><option value="03-status-classic">3. Original status pills</option><option value="03-status-menu-vibrant">3. Vibrant status menu</option><option value="03-status-menu-classic">3. Original status menu</option><option value="04-sheet-handle">4. Tap and drag handle</option><option value="05-thumbnail">5. Natural thumbnail</option></select></label><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label><main class="pair"><figure><figcaption>Before</figcaption><a id="bl"><img id="b" alt="Before phone screenshot"></a></figure><figure><figcaption>After</figcaption><a id="al"><img id="a" alt="After phone screenshot"></a></figure></main><script>function show(){for(const [id,folder] of [["b","before"],["a","after"]]){const file=folder+"/"+item.value+"-"+theme.value+"-390.png";document.getElementById(id).src=file;document.getElementById(id+"l").href=file;}}item.onchange=theme.onchange=show;show();</script></html>
