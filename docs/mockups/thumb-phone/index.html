const backhead=(title,sub,to)=>`<header class="backhead">${btn('back','Back',to)}<div class="grow"><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${btn('more','More options','', 'icon')}</header>`;
const seg=()=>`<div class="segment"><button class="active" data-go="${mode}-grid">Sheet</button><button data-demo="Month / week calendar">Calendar</button><button data-demo="Review queue">Review <span>6</span></button></div>`;
const moreRow=(ic,label,action='',value='',cl='')=>`<button class="menu-row ${cl}" ${action?`data-go="${action}"`:`data-demo="${label}"`}>${icon(ic)}<span>${label}</span>${value?`<span class="value">${value}</span>`:icon('chevron').replace('<svg','<svg class="chev"')}</button>`;
const group=(label,body)=>`<section class="sheet-group"><h3>${label}</h3>${body}</section>`;
function collection(list=false){return `<div class="app">${head(mode==='samples'?'Samples':'Calendar','Studio demo',seg())}<main class="content"><div class="viewbar"><button class="row" data-demo="Month filter"><strong>October 2026</strong>${icon('down')}</button><div class="view-switch" aria-label="Sheet display"><button class="${!list?'active':''}" aria-label="Grid view" aria-pressed="${!list}" data-go="${mode}-grid">${icon('grid')}</button><button class="${list?'active':''}" aria-label="List view" aria-pressed="${list}" data-go="${mode}-list">${icon('list')}</button></div></div>${list?`<div class="list"><button class="legacy-card" data-card="0" aria-label="Open existing Sheet card"><img alt="Existing Sheet card layout, retained in List view" src="screenshots/current-${mode}-list-card-${theme}.png"></button></div>`:`<div class="grid">${titles.map((t,i)=>`<button class="tile art ${arts[i]}" data-card="${i}" aria-label="Open ${t}"><span class="number">${String(i+1).padStart(2,'0')}</span>${i%3===0?'<span class="marker"></span>':''}<span class="tile-art-title">${t.toUpperCase()}</span><span class="tile-info">${i%3===0?'Needs review':'In progress'}<span>Reel · Oct ${14+i*2}</span></span></button>`).join('')}</div>`}<p class="footer-note">9 ${mode==='samples'?'samples':'posts'} · Tap a ${list?'card':'thumbnail'} to open its details</p></main><footer class="bottom"><div><strong style="font-size:13px">6 ready for you</strong><br><small>Video, graphic & caption</small></div><button class="primary row" data-demo="Review queue">Review ${mode==='samples'?'samples':'posts'} ${icon('chevron')}</button></footer></div>`;}
function card(){const i=Number(params.get('card')||sessionStorage.getItem('thumb-card')||0);return `<div class="app">${backhead(mode==='samples'?'Sample '+(i+1):'Post '+(i+1),'Studio demo · Reel',returnScreen.endsWith('-list')?returnScreen:mode+'-grid')}<main class="content"><div class="hero art ${arts[i]}"><strong>${titles[i].toUpperCase()}</strong><button class="play" data-demo="Video preview" aria-label="Play video">${icon('play')}</button></div><div class="detail"><div class="row spread">${pill('Needs review','amber')}<button class="row muted" data-demo="Schedule">${icon('calendar')} Oct 14</button></div><h2>${titles[i]}</h2><section class="section"><h3>Production</h3>${['Video','Graphic','Caption'].map((x,i)=>`<div class="status-row"><span>${x}</span><button data-demo="${x} status">${pill(i===1?'Approved':'Needs review',i===1?'green':'amber')}${icon('down')}</button></div>`).join('')}</section><section class="section"><div class="row spread"><h3>Caption</h3><button style="color:var(--accent)" data-demo="Edit caption">Edit</button></div><p>A little more space. A little less rush.<br>Three small habits to make your mornings feel like yours again.</p></section><section class="section"><button class="secondary" data-demo="Card notes">${icon('chat')} Notes <span class="badge">3</span>${icon('chevron')}</button></section></div></main><footer class="bottom"><button class="secondary" data-demo="Request changes">Request changes</button><button class="primary" data-demo="Approve card">Approve</button></footer></div>`;}
function sheet(body,title,base){return `<div class="app">${base||collection().replace(/<div class="app">|<\/div>$/g,'')}</div><div class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><div class="sheet-head"><h2>${title}</h2>${btn('close','Close '+title,returnScreen||(title==='Tabs'?'messages-list':title==='Filter workload'?'workload-agenda':mode+'-grid'))}</div>${body}</section></div>`;}
function more(){return sheet(group('Work on content',moreRow('select','Select cards')+moreRow('caption','Write captions')+moreRow('share','Share with client','', '', 'featured'))+group('View & organize',moreRow('sort','Sort & filter','','Manual · All statuses')+moreRow('grid','Card size','','Comfortable')+moreRow('archive','Archived cards')+moreRow('profile','Open profile'))+group('Preferences',moreRow('moon','Appearance','','System')+moreRow('palette','Status colours','','Vibrant'))+group('Tools & account',moreRow('tools','Content tools & setup')+moreRow('clock','Time off')+moreRow('logout','Sign out')),`${mode==='samples'?'Samples':'Calendar'} options`);}
const week=()=>`<div class="weeknav"><h2>October 12–18</h2><div class="row">${btn('back','Previous week','')}${btn('chevron','Next week','')}</div></div><div class="daystrip">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<button class="${i===2?'active':''}" data-day="${i}">${d}<b>${12+i}</b>${i===2?'<span style="height:5px"></span>':'<span style="height:5px;width:5px;border-radius:50%;background:var(--muted)"></span>'}</button>`).join('')}</div>`;
const people=[['AE','Editor A','Video · 2 posts need changes','4','1 overdue'],['BE','Editor B','Video · 1 post in progress','3','Due today'],['CD','Designer C','Graphics · 2 ready for review','5','Due today']];
function agenda(){return `<div class="app">${head('Workload','All clients · All creatives')}<main class="content">${week()}<div class="summary"><span class="alert"><strong>1</strong>Overdue</span><span><strong>12</strong>Due today</span><span><strong>3</strong>Creatives</span><button class="secondary row" style="margin-left:auto" data-go="workload-filters">${icon('filter')} Filter</button></div><div class="agenda"><div class="group-title"><h3>Wednesday, October 14</h3><span class="pill">Today</span></div>${people.map((p,i)=>`<button class="person" data-go="workload-person"><span class="avatar">${p[0]}</span><span class="grow"><strong>${p[1]}</strong><p>${p[2]}</p></span><span class="counter">${p[3]}<small style="color:${i===0?'var(--red)':'var(--muted)'}">${p[4]}</small></span>${icon('chevron')}</button>`).join('')}<div class="group-title"><h3>Needs attention</h3></div><button class="post-row" data-go="workload-person"><span class="thumb art b"></span><span class="grow"><strong>A calmer start</strong><small>Studio demo · Editor A · Video</small>${pill('1 day overdue','red')}</span>${icon('chevron')}</button></div><p class="footer-note">Tap a creative to see work and plan the day.</p></main><nav class="subnav" aria-label="Workload views"><button class="active" data-go="workload-agenda">${icon('list')}Agenda</button><button data-demo="Week planning">${icon('calendar')}Week</button><button data-demo="Month planning">${icon('grid')}Month</button></nav></div>`;}
function person(){return `<div class="app">${backhead('Editor A','Video · Wednesday, Oct 14','workload-agenda')}<main class="content"><div class="row" style="padding:22px 18px"><span class="avatar" style="width:54px;height:54px">AE</span><div><h2 style="font-size:22px;letter-spacing:-.6px">Today’s queue</h2><p class="muted" style="font-size:13px">4 items · 1 overdue</p></div><button class="secondary" style="margin-left:auto" data-demo="Change day">${icon('calendar')}</button></div><div class="agenda"><div class="group-title"><h3>Overdue</h3></div><article class="queue-item">${pill('Due yesterday','red')}<h3>A calmer start</h3><p>Studio demo · Video · Changes requested</p><div class="row"><button class="secondary" data-demo="Open work item">Open item</button><button class="secondary" data-demo="Plan this item">Plan today</button></div></article><div class="group-title"><h3>Due today</h3><span class="muted">3 items</span></div>${titles.slice(1,4).map((t,i)=>`<article class="queue-item"><div class="row spread">${pill(i?'In progress':'Needs changes',i?'':'amber')}<small>Video</small></div><h3>${t}</h3><p>Studio demo · Due Oct 14</p><div class="row"><button class="secondary" data-demo="Open work item">Open item</button><button class="secondary" data-demo="Plan this item">${i?'Replan':'Plan today'}</button></div></article>`).join('')}</div></main></div>`;}
function filters(){return sheet(group('Team','<div class="filter-options"><button class="active" data-filter>All creatives</button><button data-filter>Video</button><button data-filter>Graphics</button></div>')+group('Work','<div class="filter-options"><button class="active" data-filter>All work</button><button data-filter>Overdue</button><button data-filter>Needs changes</button><button data-filter>In progress</button></div>')+group('Client',moreRow('profile','All clients'))+'<div class="row spread" style="padding-top:16px"><button data-demo="Reset filters">Reset</button><button class="primary" data-go="workload-agenda">Show 12 items</button></div>','Filter workload',agenda().replace(/<div class="app">|<\/div>$/g,''));}
const convs=[['Studio demo','A calmer start','Client: Could we shorten the opening?','9:41','2'],['Studio demo','Three small habits','Editor A: The updated cut is ready.','9:28','1'],['Studio demo','Make room for more','You: Looks good, thank you.','Yesterday',''],['Studio demo','The everyday edit','Designer C: I’ve added the new graphic.','Yesterday','']];
function messages(){return `<div class="app">${head('Messages','All conversations')}<main class="content"><label class="search">${icon('search')}<input type="search" aria-label="Search conversations" placeholder="Search conversations"></label><div class="inbox-tabs"><button class="active" data-inbox="all">All</button><button data-inbox="unread">Unread <span class="badge">3</span></button></div><div id="conversations">${convs.map((c,i)=>`<button class="conversation ${c[4]?'unread':''}" data-go="messages-thread"><span class="thumb art ${arts[i]}"></span><span class="grow"><span class="client">${c[0]}</span><p class="subject">${c[1]}</p><p class="preview">${c[2]}</p></span><span class="meta"><small>${c[3]}</small>${c[4]?`<span class="badge" aria-label="${c[4]} unread messages">${c[4]}</span>`:'<span style="height:19px"></span>'}</span></button>`).join('')}</div><p class="inbox-note">Conversations stay attached to their content.</p></main></div>`;}
function thread(){return `<div class="app">${backhead('Studio demo','A calmer start · Caption','messages-list')}<main class="content"><button class="context-card" data-go="calendar-card"><span class="thumb art"></span><span class="grow"><strong>A calmer start</strong><small>Open content card</small></span>${icon('chevron')}</button><div class="chat"><div class="date-label">Today, October 14</div><div class="message"><div class="byline"><span>Client · Caption</span><span>9:34</span></div><div class="bubble">The overall direction looks great. Could we make the first line a little shorter?</div></div><div class="message mine"><div class="byline"><span>You</span><span>9:36 · Sent</span></div><div class="bubble">Absolutely. I’ll tighten the opening and keep the rest as it is.</div></div><div class="new-divider">2 unread messages</div><div class="message"><div class="byline"><span>Client · Caption</span><span>9:40</span></div><div class="bubble">Thank you! Something that gets straight to the morning routine would work.</div></div><div class="message"><div class="byline"><span>Client · Caption</span><span>9:41</span></div><div class="bubble">Could we shorten the opening to “Make mornings yours”?</div></div></div></main><footer class="composer"><button class="audience" data-demo="Choose reply audience">${icon('chat')}Reply to client · Caption ${icon('down')}</button><div class="compose-row">${btn('plus','Attach file','')}<textarea aria-label="Reply to client" placeholder="Message…">${draft}</textarea><button class="primary" aria-label="Send reply" data-send>${icon('send')}</button></div></footer></div>`;}
function tabs(){return sheet(`<div class="tabs-grid">${[['calendar','Calendar','calendar-grid'],['grid','Samples','samples-grid'],['team','Workload','workload-agenda'],['chat','Messages','messages-list'],['sync','Sync',''],['notes','Today','']].map(t=>`<button class="tabtile ${t[1]==='Messages'?'active':''}" ${t[2]?`data-go="${t[2]}"`:`data-demo="${t[1]}"`}>${icon(t[0])}<span>${t[1]}</span>${t[1]==='Messages'?'<span class="badge">3</span>':''}</button>`).join('')}</div>`+group('Workspace',moreRow('profile','Change client','','Studio demo')),'Tabs',messages().replace(/<div class="app">|<\/div>$/g,''));}
const reasons={calendar:[['Three columns, with Grid / List in reach','Scan thumbnails quickly; switch to the existing editable card list for detailed work.'],['Review posts is the single primary action','An SMM’s next decision is content quality; bulk writing and selection are secondary tools.'],['Open profile moves into More','Keep the collection above the fold while preserving one-tap access from the sheet.'],['Work → organize → preferences → account','Frequent content actions lead; low-frequency settings no longer interrupt them.']],samples:[['The same grid, switch and card navigation','Learn Calendar once; use the same gestures and controls for Samples.'],['Review samples is the single primary action','Review quality first; keep bulk caption writing and selection in More.'],['The same grouped bottom sheet','Sharing, archive, profile and preferences live in predictable places.'],['Card details use a back arrow','Open one item at a time and return to the same collection and scroll position.']],workload:[['Agenda first, with a seven-day strip','Answer “what needs attention today?” without scanning a compressed planning grid.'],['Tap a creative → their queue → work item','Show responsibility, deadlines and actions one level at a time.'],['Week and Month stay in a local bottom bar','Keep deliberate planning available without squeezing every view into one page.'],['Filters in a bottom sheet; plan per item','Set scope together, then act on the selected work; avoid a vague global action.']],messages:[['List → thread, with a back arrow','Give each conversation the full phone width and preserve the list on return.'],['Composer docks above the keyboard','Keep the reply action reachable while the conversation scrolls independently.'],['Unread counts and a new-message divider','Distinguish unread conversations and the point where new replies begin.'],['Icon + Messages + badge in Tabs','The count supplements a stable navigation label instead of replacing it.']]};
const flows={calendar:['calendar-grid','calendar-list','calendar-card','calendar-more'],samples:['samples-grid','samples-list','samples-card','samples-more'],workload:['workload-agenda','workload-person','workload-filters'],messages:['messages-list','messages-thread','messages-tabs']};
const flowNames={'calendar-grid':'Grid','calendar-list':'List','calendar-card':'Card','calendar-more':'More','samples-grid':'Grid','samples-list':'List','samples-card':'Card','samples-more':'More','workload-agenda':'Agenda','workload-person':'Person’s queue','workload-filters':'Filters','messages-list':'Inbox','messages-thread':'Thread','messages-tabs':'Tabs'};
function gallery(){document.getElementById('root').innerHTML=`<main class="gallery"><p class="eyebrow">SyncView / Thumb / One proposal</p><h1>Less chrome.<br>More room for the work.</h1><p class="intro">One phone direction for Calendar, Samples, Workload and Messages. Familiar navigation, content first, and actions where your thumb expects them. Designed for 390–430px. Desktop stays as it is.</p><nav class="gallery-nav">${Object.keys(flows).map(a=>`<a href="#${a}">${a[0].toUpperCase()+a.slice(1)}</a>`).join('')}<button id="theme">${icon('moon')} ${theme==='light'?'Dark':'Light'} mode</button></nav><div class="review-note"><strong>Owner review · design only.</strong> Before views are the current app on offline fictional fixtures; after views are an interactive proposal. Try the view switch, a thumbnail, More, a creative, a conversation and Tabs. Controls beyond the shown design states display a prototype notice. No saves or live services are connected.</div>${Object.entries(flows).map(([area,screens],i)=>`<section class="area" id="${area}"><div class="area-head"><span class="eyebrow">0${i+1}</span><h2>${area[0].toUpperCase()+area.slice(1)}</h2></div><p class="rationale">${['A visual collection that opens into focused review.','A familiar workspace for the first round of content.','A useful day view, with planning one tap away.','One conversation at a time, with room to reply.'][i]}</p><div class="comparison"><div class="device-column"><div class="device-label"><strong>Before</strong><span>Current main · 390 × 844</span></div><div class="device"><img alt="Current ${area} phone screen" src="screenshots/before-${area}-${theme}.png"></div></div><div class="device-column"><div class="device-label"><strong>After</strong><span>Proposal · 390 × 844</span></div><div class="device"><iframe title="Proposed ${area} phone flow" src="?screen=${screens[0]}&theme=${theme}"></iframe></div><div class="flow-buttons">${screens.map((s,j)=>`<button class="${j===0?'active':''}" data-frame="${s}" data-area="${area}">${flowNames[s]}</button>`).join('')}</div></div></div><div class="decisions">${reasons[area].map(r=>`<p><strong>${r[0]}.</strong> ${r[1]}</p>`).join('')}</div></section>`).join('')}<div class="review-note"><strong>Implementation contract after approval.</strong> Phone only; preserve all current actions, permissions, routes, data owners and unsaved-work safeguards. Keep grid/list preference and scroll position. Sheets scroll within the viewport, lock the page, close on Escape or scrim tap, and return focus. Sticky headers and safe-area padding; 44px controls and 16px fields; keyboard-aware composer. Empty, loading, refused-save and retry states stay explicit. Calendar/Samples may share one PR; Workload gets its own. Messages is last, from fresh main after the concurrent rebuild merges. Each implementation PR needs all changed screens at 390px in both themes, 430px checks and exact desktop parity. Nothing is merged by Thumb.</div><footer>Baseline: df67f8c75e423451a92b033c8d139d53f54e1a9b · 2026-10-14 · Fictional demonstration content · Decision on primary action is a workflow inference, not a measured usage claim. Abstract artwork stands in for real thumbnails.</footer></main>`;document.getElementById('theme').onclick=()=>{params.set('theme',theme==='light'?'dark':'light');location.search=params;};}
function render(){mode=screen.startsWith('samples')?'samples':'calendar';let html;if(/^(calendar|samples)-(grid|list)$/.test(screen))html=collection(screen.endsWith('list'));else if(screen.endsWith('-card'))html=card();else if(screen.endsWith('-more'))html=more();else if(screen==='workload-agenda')html=agenda();else if(screen==='workload-person')html=person();else if(screen==='workload-filters')html=filters();else if(screen==='messages-list')html=messages();else if(screen==='messages-thread')html=thread();else if(screen==='messages-tabs')html=tabs();else return gallery();document.getElementById('root').innerHTML=html;}
function go(next){if(screen==='messages-thread')draft=document.querySelector('textarea')?.value||draft;returnScreen=screen;screen=next;render();}
document.addEventListener('click',e=>{const frame=e.target.closest('[data-frame]');if(frame){document.querySelector('#'+frame.dataset.area+' iframe').src='?screen='+frame.dataset.frame+'&theme='+theme;frame.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===frame));return;}const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return;}const card=e.target.closest('[data-card]');if(card){sessionStorage.setItem('thumb-card',card.dataset.card);go(mode+'-card');return;}if(e.target.classList.contains('scrim')){go(returnScreen||(screen==='messages-tabs'?'messages-list':screen==='workload-filters'?'workload-agenda':mode+'-grid'));return;}const filter=e.target.closest('[data-filter]');if(filter){filter.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===filter));return;}const day=e.target.closest('[data-day]');if(day){day.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===day));notice('Day selection preview; queue content is illustrative.');return;}const inbox=e.target.closest('[data-inbox]');if(inbox){inbox.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===inbox));document.querySelectorAll('.conversation').forEach(n=>n.hidden=inbox.dataset.inbox==='unread'&&!n.classList.contains('unread'));return;}if(e.target.closest('[data-send]')){notice('Reply preview only. Nothing was sent.');return;}const demo=e.target.closest('[data-demo]');if(demo)notice(demo.dataset.demo+' · prototype only.');});
function notice(text){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2500);}
document.addEventListener('input',e=>{if(e.target.matches('input[type=search]'))document.querySelectorAll('.conversation').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(e.target.value.toLowerCase()));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.scrim'))go(returnScreen||(screen==='messages-tabs'?'messages-list':screen==='workload-filters'?'workload-agenda':mode+'-grid'));});
render();
</script></body></html>
