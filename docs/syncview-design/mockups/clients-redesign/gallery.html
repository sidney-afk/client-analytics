<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients tab directions</title>
<!-- Phase 1 mockups for the Kasper › Clients redesign. FICTIONAL DATA ONLY:
     every client, handle, email and manager below is invented. The repo is
     public; never paste a real client or staff name into this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2;--white:#fff;--border:#e4e4e0;--border-light:#ededea;--surface-hover:#f8f8f6;--surface-subtle:#f3f3f1;
  --text-primary:#111110;--text-secondary:#6b6b67;--text-muted:#9a9a94;--focus-ring:#6c5ce7;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 8px 30px rgba(0,0,0,.12);--shadow-lg:0 12px 40px rgba(0,0,0,.18);
  --ig:#E1306C;--ig-light:#fdf0f5;--tt:#111;--tt-light:#f2f2f2;--yt:#e60000;--yt-light:#fff4f4;
  --slack:#4a154b;--slack-light:#f6eef6;--up:#16a34a;--up-bg:#f0fdf4;--warn:#b45309;--warn-bg:#fff7e6;
  --look:#7c5cff;--look-bg:#f4f1ff;--look-ink:#5a36e0;--edit:#2f7de1;--edit-bg:#eef5fe;--edit-ink:#1c5fb3;
  --music:#0e9f8e;--music-bg:#eafaf7;--music-ink:#0a6f63;--about:#d98a12;--about-bg:#fdf6ea;--about-ink:#8a5300;
  --asks:#d4509a;--asks-bg:#fcf0f7;--asks-ink:#a82c73;--know:#5b6b82;--know-bg:#f1f4f8;--know-ink:#45546b;
  --field-bg:#f3f3f1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101114;--white:#181a1f;--border:#343842;--border-light:#282c34;--surface-hover:#242730;--surface-subtle:#15171c;
  --text-primary:#f4f6f8;--text-secondary:#c2c7cf;--text-muted:#8e96a3;--focus-ring:#8b7cf6;
  --shadow-sm:0 1px 3px rgba(0,0,0,.35);--shadow-md:0 10px 34px rgba(0,0,0,.42);--shadow-lg:0 18px 54px rgba(0,0,0,.5);
  --ig:#ff5d9d;--ig-light:#351926;--tt:#f4f6f8;--tt-light:#1f2228;--yt:#ff6b6b;--yt-light:#351818;
  --slack:#d9a6db;--slack-light:#2c1a2d;--up:#4ade80;--up-bg:#14281c;--warn:#f6cc85;--warn-bg:#332713;
  --look:#a996ff;--look-bg:#221d38;--look-ink:#c3b5ff;--edit:#6aa8f5;--edit-bg:#172536;--edit-ink:#9cc6fa;
  --music:#43d1bf;--music-bg:#13302d;--music-ink:#7fe3d6;--about:#f0b454;--about-bg:#332713;--about-ink:#f6cc85;
  --asks:#f08cc4;--asks-bg:#361b2c;--asks-ink:#f6b4d9;--know:#9fb0c8;--know-bg:#1d2330;--know-ink:#c2cedd;--field-bg:#20242c;
}}
:root[data-theme="dark"]{
  --bg:#101114;--white:#181a1f;--border:#343842;--border-light:#282c34;--surface-hover:#242730;--surface-subtle:#15171c;
  --text-primary:#f4f6f8;--text-secondary:#c2c7cf;--text-muted:#8e96a3;--focus-ring:#8b7cf6;
  --shadow-sm:0 1px 3px rgba(0,0,0,.35);--shadow-md:0 10px 34px rgba(0,0,0,.42);--shadow-lg:0 18px 54px rgba(0,0,0,.5);
  --ig:#ff5d9d;--ig-light:#351926;--tt:#f4f6f8;--tt-light:#1f2228;--yt:#ff6b6b;--yt-light:#351818;
  --slack:#d9a6db;--slack-light:#2c1a2d;--up:#4ade80;--up-bg:#14281c;--warn:#f6cc85;--warn-bg:#332713;
  --look:#a996ff;--look-bg:#221d38;--look-ink:#c3b5ff;--edit:#6aa8f5;--edit-bg:#172536;--edit-ink:#9cc6fa;
  --music:#43d1bf;--music-bg:#13302d;--music-ink:#7fe3d6;--about:#f0b454;--about-bg:#332713;--about-ink:#f6cc85;
  --asks:#f08cc4;--asks-bg:#361b2c;--asks-ink:#f6b4d9;--know:#9fb0c8;--know-bg:#1d2330;--know-ink:#c2cedd;--field-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text-primary);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ── Gallery chrome ─────────────────────────────────────────── */
.g-top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.g-title{font-weight:800;font-size:16px;margin-right:auto}
.g-title small{display:block;font-weight:500;font-size:12px;color:var(--text-secondary)}
.g-seg{display:inline-flex;background:var(--white);border:1px solid var(--border);border-radius:99px;padding:3px}
.g-seg button{border:0;background:none;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer}
.g-seg button[aria-pressed="true"]{background:var(--text-primary);color:var(--white)}
.g-note{padding:14px 16px 0;max-width:980px;color:var(--text-secondary);font-size:13px}
.g-note b{color:var(--text-primary)}
.g-stage{padding:16px;overflow:hidden}
.g-frame-wrap{margin:0 auto;transform-origin:top left;}
.g-frame{display:block;border:1px solid var(--border);border-radius:14px;background:var(--bg);box-shadow:var(--shadow-md)}

/* ── App shell (shared by all three) ────────────────────────── */
.app{min-height:100vh}
.sv-bar{height:52px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--white)}
.sv-logo{font-weight:800;letter-spacing:-.02em}
.sv-tabs{display:flex;gap:4px;font-size:13px;color:var(--text-secondary)}
.sv-tabs span{padding:6px 10px;border-radius:8px}
.sv-tabs .on{background:var(--surface-subtle);color:var(--text-primary);font-weight:600}
.sv-sub{display:flex;gap:6px;padding:10px 24px;font-size:12.5px;color:var(--text-secondary);border-bottom:1px solid var(--border-light)}
.sv-sub span{padding:5px 10px;border-radius:99px}
.sv-sub .on{background:var(--text-primary);color:var(--white);font-weight:600}
.page{max-width:1240px;margin:0 auto;padding:28px 32px 120px}
.ph{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}

/* Search: the Filming Plans pill (.search-bar-pill) plus the shared client
   dropdown's keyboard behaviour. */
.sx{position:relative;flex:0 1 440px;min-width:0}
.sx-pill{display:flex;align-items:center;background:var(--white);border:1.5px solid var(--border);border-radius:99px;padding:0 6px 0 20px;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.07);transition:border-color .18s,box-shadow .18s}
.sx-pill:focus-within{border-color:#aaa;box-shadow:0 4px 18px rgba(0,0,0,.11)}
.sx-input{flex:1;border:0;outline:0;background:transparent;font:500 .85rem 'Plus Jakarta Sans',sans-serif;color:var(--text-primary);padding:11px 0;min-width:0}
.sx-input::placeholder{color:var(--text-muted);font-weight:400}
.sx-icon{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:0;background:var(--text-primary);color:var(--white);flex-shrink:0;cursor:pointer}
.sx-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:20;max-height:360px;overflow:auto}
.sx-pop[hidden]{display:none}
.sx-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer}
.sx-opt.on{background:var(--surface-subtle)}
.sx-opt .nm{font-weight:600}
.sx-opt .sub{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-opt mark{background:var(--look-bg);color:var(--look-ink);border-radius:3px;padding:0 1px}
.sx-hint{font-size:11.5px;color:var(--text-muted);padding:6px 10px 2px;display:flex;gap:12px}
.sx-hint kbd{font:inherit;border:1px solid var(--border);border-radius:4px;padding:0 4px}
.sx-none{padding:12px 10px;color:var(--text-secondary)}
.allbtn{border:1px solid var(--border);background:transparent;border-radius:99px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.allbtn:hover,.allbtn[aria-expanded="true"]{color:var(--text-primary);border-color:var(--text-secondary)}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;flex-shrink:0;color:#fff}
.btn{border:1px solid var(--border);background:var(--white);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--text-secondary)}
.btn.primary{background:var(--text-primary);color:var(--white);border-color:var(--text-primary)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--text-secondary)}
.btn.quiet:hover{color:var(--text-primary);background:var(--surface-subtle)}
.ico{width:16px;height:16px;flex-shrink:0}
.lnk{text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--text-muted);font-style:italic;font-weight:500}
.fold{border-top:1px solid var(--border-light);margin-top:4px}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 2px;color:var(--text-secondary);font-size:13px;font-weight:600}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'';width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.fold[open]>summary::before{transform:rotate(45deg)}
.fold>summary .tag{margin-left:auto;font-weight:500;font-size:11.5px;color:var(--text-muted)}
.fold-body{padding:0 2px 16px;color:var(--text-secondary)}
.fold-body dl{margin:0;display:grid;grid-template-columns:180px 1fr;gap:8px 16px}
.fold-body dt{color:var(--text-muted);font-size:12.5px}
.fold-body dd{margin:0;color:var(--text-primary)}
.adminpill{font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 7px;background:var(--know-bg);color:var(--know-ink)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps span{font-size:12px;border:1px solid var(--border);border-radius:99px;padding:3px 9px}
.steps span.ok{border-color:transparent;background:var(--up-bg);color:var(--up)}
.inp{width:100%;border:1.5px solid var(--border);background:var(--field-bg);border-radius:9px;padding:7px 10px;font:500 13.5px 'Plus Jakarta Sans',sans-serif;color:var(--text-primary)}
.inp:focus{outline:0;border-color:var(--text-primary);background:var(--white)}
.editbar{position:sticky;bottom:16px;margin-top:20px;display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:var(--shadow-md)}
.editbar .note{margin-right:auto;font-size:12.5px;color:var(--text-secondary)}
.prov{margin-top:24px;font-size:12px;color:var(--text-muted)}
.prov button{border:0;background:none;padding:0;color:var(--text-secondary);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text-primary);color:var(--white);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);z-index:60}
.hist{margin-top:10px;border:1px solid var(--border);border-radius:12px;background:var(--white);padding:6px 14px;font-size:12.5px}
.hist div{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border-light)}
.hist div:last-child{border:0}
.hist .w{color:var(--text-muted);width:110px;flex-shrink:0}

/* Landing (no client chosen): the search is the page. */
.land{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:30px 0}
.land h3{margin:0;font-size:15px;color:var(--text-secondary);font-weight:600}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--white);border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;font-weight:600;font-size:13px}
.recent .av{width:26px;height:26px;font-size:10.5px}

/* Manager picker (shared shape; each direction styles its trigger) */
.mp{position:absolute;z-index:40;width:300px;background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px}
.mp h5{margin:4px 8px 8px;font-size:12.5px;color:var(--text-secondary);font-weight:600}
.mp-opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:10px;cursor:pointer}
.mp-opt:hover,.mp-opt.on{background:var(--surface-subtle)}
.mp-opt .cnt{margin-left:auto;font-size:12px;color:var(--text-muted)}
.mp-opt .chk{width:16px;color:var(--up);font-weight:800}
.mp-foot{border-top:1px solid var(--border-light);margin-top:6px;padding:8px 8px 2px;font-size:11.5px;color:var(--text-muted)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:39}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--white);border-radius:18px 18px 0 0;padding:10px 12px 22px;box-shadow:var(--shadow-lg);max-height:80vh;overflow:auto}
.sheet::before{content:'';display:block;width:38px;height:4px;border-radius:9px;background:var(--border);margin:0 auto 10px}

/* ═══ Direction A: Dossier ═══════════════════════════════════ */
.dA .hero{position:relative;border-radius:20px;padding:28px 30px 24px;background:linear-gradient(120deg,var(--asks-bg),var(--look-bg) 55%,var(--edit-bg));border:1px solid var(--border-light)}
.dA .hero-top{display:flex;gap:20px;align-items:center}
.dA .hero-top>.av{width:68px;height:68px;font-size:22px;box-shadow:0 0 0 4px var(--white)}
.dA .hero h3{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.dA .hero .slug{color:var(--text-secondary);font-size:13px;margin-top:4px}
.dA .hero-actions{margin-left:auto;display:flex;gap:8px;align-self:flex-start}
.dA .mgr{display:inline-flex;align-items:center;gap:9px;margin-top:12px;background:var(--white);border:1px solid var(--border);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:600;font-size:13px}
.dA .mgr .av{width:26px;height:26px;font-size:10.5px;box-shadow:none}
.dA .mgr .lbl{color:var(--text-secondary);font-weight:500}
.dA .reach{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.dA .reach a{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:9px 14px;text-decoration:none;font-weight:600;font-size:13px}
.dA .reach a:hover{border-color:var(--text-secondary)}
.dA .reach a .k{color:var(--text-secondary);font-weight:500}
.dA .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.dA .card{border-radius:16px;padding:18px 20px;background:var(--white);border:1px solid var(--border-light);border-top:4px solid var(--c)}
.dA .card h4{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ci)}
.dA .row{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--border-light)}
.dA .row:first-of-type{border-top:0;padding-top:0}
.dA .row .k{font-size:12px;color:var(--text-muted)}
.dA .row .v{font-size:14px}
.dA .hs{margin-top:16px;border-radius:16px;padding:18px 20px;background:var(--about-bg);display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:24px;align-items:center}
.dA .hs h4{margin:0;font-size:13px;color:var(--about-ink)}
.dA .hs .st{display:flex;flex-direction:column;gap:3px}
.dA .hs .st .k{font-size:12px;color:var(--about-ink);opacity:.8}
.dA .hs .st .v{font-weight:700}
.dA .lower{margin-top:22px}
.dA .drop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:min(560px,92vw);background:var(--white);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:10px}
.dA .drop .dl{display:grid;grid-template-columns:1fr 1fr;gap:2px;max-height:420px;overflow:auto}
.dA .drop .hd{display:flex;justify-content:space-between;padding:4px 8px 10px;font-size:12px;color:var(--text-secondary)}

/* ═══ Direction B: Index ═════════════════════════════════════ */
.dB .layout{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
.dB .id{position:sticky;top:20px;background:var(--white);border:1px solid var(--border);border-radius:18px;padding:22px}
.dB .id>.av{width:56px;height:56px;font-size:19px;border-radius:16px}
.dB .id h3{margin:14px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dB .id .slug{color:var(--text-muted);font-size:12.5px}
.dB .id .lab{font-size:12px;color:var(--text-muted);margin:18px 0 6px}
.dB .mgr{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--border);background:var(--surface-subtle);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;font-weight:600}
.dB .mgr .chev{margin-left:auto;color:var(--text-muted)}
.dB .quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}
.dB .quick a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:12px;background:var(--surface-subtle);text-decoration:none;font-size:11.5px;font-weight:600;color:var(--text-secondary)}
.dB .quick a:hover{color:var(--text-primary);background:var(--surface-hover)}
.dB .quick a .ico{width:18px;height:18px;color:var(--text-primary)}
.dB .id .editrow{margin-top:18px;display:flex;justify-content:flex-end}
.dB .sec{background:var(--white);border:1px solid var(--border-light);border-radius:16px;padding:6px 20px 6px 0;margin-bottom:14px;display:grid;grid-template-columns:150px 1fr;position:relative;overflow:hidden}
.dB .sec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.dB .sec h4{margin:0;padding:16px 0 0 22px;font-size:13px;color:var(--ci);font-weight:700}
.dB .sec dl{margin:0}
.dB .kv{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-light)}
.dB .kv:last-child{border:0}
.dB .kv dt{color:var(--text-secondary);font-size:13px}
.dB .kv dd{margin:0;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dB .kv .go{font-size:12px;color:var(--text-muted);text-decoration:none;font-weight:600;padding:3px 8px;border-radius:6px}
.dB .kv .go:hover{background:var(--surface-subtle);color:var(--text-primary)}
.dB .track{display:flex;gap:0;padding:14px 0}
.dB .track .t{flex:1;position:relative;padding-top:18px;font-size:12.5px}
.dB .track .t::before{content:'';position:absolute;top:5px;left:0;right:0;height:2px;background:var(--border)}
.dB .track .t::after{content:'';position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--white);border:2px solid var(--border)}
.dB .track .t.ok::before{background:var(--about)}
.dB .track .t.ok::after{background:var(--about);border-color:var(--about)}
.dB .track .t b{display:block;font-size:13.5px}
.dB .track .t span{color:var(--text-secondary)}
.dB .drawer{position:fixed;top:0;bottom:0;left:0;width:340px;background:var(--white);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.dB .drawer .hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;font-weight:700}
.dB .drawer .bd{overflow:auto;padding:0 8px 16px}
.dB .drawer .letter{font-size:11.5px;color:var(--text-muted);padding:10px 10px 4px;font-weight:700}

/* ═══ Direction C: Launchpad ═════════════════════════════════ */
.dC .head{display:flex;align-items:flex-end;gap:18px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.dC .head h3{margin:0;font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1}
.dC .head .meta{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--text-secondary);font-size:13px;flex-wrap:wrap}
.dC .mgr{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--text-primary);color:var(--white);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px;cursor:pointer}
.dC .mgr .av{width:24px;height:24px;font-size:10px}
.dC .head .tools{margin-left:auto;display:flex;gap:8px}
.dC .grp{margin-top:26px}
.dC .grp h4{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--text-secondary)}
.dC .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dC .tile{position:relative;display:flex;flex-direction:column;gap:10px;min-height:120px;padding:16px;border-radius:16px;background:var(--tb);text-decoration:none;color:var(--text-primary);border:1px solid transparent;transition:border-color .15s,transform .15s}
a.tile:hover{border-color:var(--tc);transform:translateY(-1px)}
.dC .tile .gl{width:34px;height:34px;border-radius:10px;background:var(--tc);color:var(--white);display:inline-flex;align-items:center;justify-content:center}
.dC .tile .gl .ico{width:18px;height:18px}
.dC .tile .k{font-size:12px;color:var(--text-secondary)}
.dC .tile .v{font-weight:700;font-size:15px;word-break:break-all;margin-top:auto}
.dC .tile .open{position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:600;color:var(--text-secondary)}
.dC .tile.none{background:transparent;border:1.5px dashed var(--border)}
.dC .tile.none .gl{background:var(--border)}
.dC .hstiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dC .hst{padding:14px 16px;border-radius:14px;border:1px solid var(--border)}
.dC .hst .k{font-size:12px;color:var(--text-secondary)}
.dC .hst .v{font-weight:700;margin-top:4px;display:flex;align-items:center;gap:7px}
.dC .dot{width:8px;height:8px;border-radius:50%;background:var(--up)}
.dC .dot.w{background:var(--about)}
.dC .pal{position:fixed;inset:0;z-index:41;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px}
.dC .pal-box{width:min(920px,100%);background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);padding:18px;max-height:calc(100vh - 140px);overflow:auto}
.dC .pal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.dC .pal-grid button{display:flex;align-items:center;gap:10px;border:1px solid var(--border-light);background:var(--surface-subtle);border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.dC .pal-grid button:hover{border-color:var(--text-secondary)}
.dC .pal-grid .nm{font-weight:600;font-size:13px}
.dC .pal-grid .sub{font-size:11.5px;color:var(--text-secondary)}
.dC .mgrmodal{position:fixed;inset:0;z-index:41;display:flex;align-items:center;justify-content:center;padding:16px}
.dC .mgrmodal .box{width:min(460px,100%);background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);padding:20px}
.dC .mgrmodal h5{margin:0 0 4px;font-size:17px}
.dC .mgrmodal p{margin:0 0 14px;color:var(--text-secondary);font-size:13px}
.dC .mgrmodal .mp-opt{border:1px solid var(--border-light);margin-bottom:6px}
.dC .mgrmodal .bar{height:5px;border-radius:9px;background:var(--surface-subtle);width:80px;overflow:hidden}
.dC .mgrmodal .bar i{display:block;height:100%;background:var(--look)}

/* ── Phone (staff) ─────────────────────────────────────────── */
@media (max-width:600px){
  .sv-bar{padding:0 16px}.sv-tabs{display:none}
  .sv-sub{padding:8px 16px;overflow:auto}
  .page{padding:18px 16px 110px}
  .ph{gap:10px}.ph h2{font-size:21px;width:100%}
  .sx{flex:1 1 auto}
  .allbtn .t{display:none}.allbtn{padding:9px 11px}
  .fold-body dl{grid-template-columns:1fr}
  .editbar{bottom:10px}
  .dA .hero{padding:20px 18px}.dA .hero-top{flex-wrap:wrap;gap:14px}
  .dA .hero-top>.av{width:52px;height:52px;font-size:18px}
  .dA .hero h3{font-size:26px}
  .dA .hero-actions{position:absolute;top:16px;right:14px}
  .dA .reach{display:grid;grid-template-columns:1fr 1fr}
  .dA .reach a .k{display:none}
  .dA .grid{grid-template-columns:1fr}
  .dA .hs{grid-template-columns:1fr 1fr 1fr;gap:12px}.dA .hs h4{grid-column:1/-1}
  .dA .drop .dl{grid-template-columns:1fr}
  .dB .layout{grid-template-columns:1fr;gap:14px}
  .dB .id{position:static;padding:18px}
  .dB .sec{grid-template-columns:1fr;padding:0 16px 4px 0}
  .dB .sec h4{padding:14px 0 4px 18px}
  .dB .sec dl,.dB .sec .track{padding-left:18px}
  .dB .kv{grid-template-columns:1fr auto;gap:2px 10px}
  .dB .kv dt{grid-column:1/-1;font-size:12px}
  .dB .drawer{width:100%}
  .dC .head{flex-wrap:wrap}.dC .head h3{font-size:30px}
  .dC .head .tools{margin-left:0}
  .dC .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .dC .tile{min-height:104px;padding:13px}
  .dC .tile .v{font-size:13.5px}
  .dC .hstiles{grid-template-columns:1fr}
  .dC .pal{padding:0;align-items:stretch}.dC .pal-box{border-radius:0;max-height:none;height:100%}
  .dC .pal-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const SRC = '<!doctype html>' + document.documentElement.outerHTML;
// ── Fictional data (invented names only) ───────────────────────────────
const MANAGERS = [
  { id: 'm1', name: 'Rae Okafor', color: '#7c5cff' },
  { id: 'm2', name: 'Jonah Pike', color: '#0e9f8e' },
  { id: 'm3', name: 'Lena Hartwig', color: '#d4509a' },
  { id: 'm4', name: 'Tomas Ilves', color: '#2f7de1' },
];
const COLORS = ['#7c5cff', '#0e9f8e', '#d4509a', '#2f7de1', '#d98a12', '#5b6b82', '#e0445a'];
const RAW = [
  ['Marisol Vega', 'marisolvega', 'hello@marisolvega.example', 'marisol.moves', 'marisolmoves', 'UCq7mockMarisol', 'm1', 'Closed Won', 'Signed', 'Paid'],
  ['Theo Brandt', 'theobrandt', 'theo@brandtstudio.example', 'theobrandt.builds', 'theobuilds', '', 'm2', 'Closed Won', 'Signed', 'Paid'],
  ['Ottilie Marsh', 'ottiliemarsh', 'ottilie@marshkitchen.example', 'marsh.kitchen', '', 'UCq7mockMarsh', 'm3', 'Contract Signed', 'Signed', 'Waiting'],
  ['Desmond Achterberg', 'desmondach', 'des@achterberg.example', 'des.lifts', 'deslifts', '', 'm1', 'Closed Won', 'Signed', 'Paid'],
  ['Nayeli Corrigan', 'nayelicorrigan', 'nayeli@corrigancoach.example', 'nayeli.coaches', 'nayelicoach', 'UCq7mockNayeli', 'm1', 'Closed Won', 'Signed', 'Paid'],
  ['Bram Lindqvist', 'bramlindqvist', 'bram@lindqvist.example', 'bram.on.money', '', '', 'm1', 'Invoice Paid', 'Signed', 'Paid'],
  ['Cosima Ferreira', 'cosimaferreira', 'cosima@ferreira.example', 'cosima.skin', 'cosimaskin', '', 'm3', 'Closed Won', 'Signed', 'Paid'],
  ['Idris Vantongeren', 'idrisvt', 'idris@vtlaw.example', 'idris.explains', 'idrisexplains', 'UCq7mockIdris', 'm4', 'Next Steps Sent', 'Not sent', 'Not yet'],
  ['Juniper Oyelaran', 'juniperoye', 'june@oyelaran.example', 'juniper.grows', 'junipergrows', '', 'm1', 'Closed Won', 'Signed', 'Paid'],
  ['Kaspian Mertens', 'kaspianm', 'kaspian@mertensfit.example', 'mertens.fit', '', '', 'm2', 'Closed Won', 'Signed', 'Paid'],
  ['Liesel Abernathy', 'lieselab', 'liesel@abernathy.example', 'liesel.writes', 'lieselwrites', 'UCq7mockLiesel', 'm3', 'Closed Won', 'Signed', 'Paid'],
  ['Rafferty Quon', 'raffertyquon', 'raff@quonrealty.example', 'raff.homes', 'raffhomes', '', 'm2', 'Closed Won', 'Signed', 'Paid'],
];
const CLIENTS = RAW.map(([name, slug, email, ig, tt, yt, mgr, stage, contract, payment], i) => ({
  name, slug, email, ig, tt, yt, mgr, stage, contract, payment,
  color: COLORS[i % COLORS.length],
  slack: 'C0' + (7100 + i * 37) + 'MOCK', slackName: 'client-' + slug,
  creative: 'C0' + (8200 + i * 41) + 'MOCK', creativeName: 'creative-' + slug,
  uploadPost: i % 4 === 2 ? '' : slug, pfm: i % 5 === 3 ? '' : 'spc_mock' + (1000 + i * 7),
  research: { description: 'Short, warm explainers filmed at home; one idea per video.', keywords: 'routines, beginners, small wins', specific: 'morning reset, 10 minute plan', competitors: '@example.one, @example.two' },
  onboarding: [27, 27, 19, 27, 27, 24, 27, 6, 27, 27, 27, 27][i],
  version: 8 + i, updated: '3 Oct 2026', updatedBy: 'Kasper',
}));
const DIRS = {
  a: { name: 'A · Dossier', blurb: '<b>Dossier.</b> A coloured header with the name, the manager chip and one row of "reach" buttons (email, Slack, socials) so the most common jump is one click. The details sit in three colour-coded cards, like the editor brief. "All clients" drops a two-column list under the search.' },
  b: { name: 'B · Index card', blurb: '<b>Index card.</b> A calm, dense reference layout. A sticky identity card on the left (who, manager, three quick links, Edit); on the right every detail is a labelled row with an "Open" on the far edge, grouped by a coloured edge. "All clients" slides in a drawer from the left, grouped by letter.' },
  c: { name: 'C · Launchpad', blurb: '<b>Launchpad.</b> Every account is a big tile you click to open it, in its platform colour: built for "take me to their Instagram / Slack / dashboard". The manager picker is a small dialog that also shows how many clients each manager already has. "All clients" opens a full-screen grid.' },
};

// ── Helpers ─────────────────────────────────────────────────────────────
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => { const p = String(n).trim().split(/\s+/); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
const mgrOf = c => MANAGERS.find(m => m.id === c.mgr) || null;
const av = (name, color, cls = '') => `<span class="av ${cls}" style="background:${color}" aria-hidden="true">${esc(initials(name))}</span>`;
const I = {
  mail: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="13" height="10" rx="2"/><path d="m2 4 6 5 6-5"/></svg>',
  slack: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 2v8M10 6v8M2 10h8M6 6h8"/></svg>',
  brush: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10.5 2.5 13.5 5.5 7 12H4V9z"/><path d="M9 4l3 3"/></svg>',
  ig: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="3.5"/><circle cx="8" cy="8" r="2.8"/><circle cx="11.6" cy="4.4" r=".7" fill="currentColor" stroke="none"/></svg>',
  tt: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 2v8.2a2.4 2.4 0 1 1-2.4-2.4"/><path d="M9 2c.4 1.8 1.7 3 3.5 3.1"/></svg>',
  yt: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3.5" width="13" height="9" rx="2.5"/><path d="M7 6.2v3.6L10 8z" fill="currentColor" stroke="none"/></svg>',
  send: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M14 2 2 7l5 2 2 5z"/><path d="m7 9 7-7"/></svg>',
  up: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V3M4 7l4-4 4 4M3 14h10"/></svg>',
  search: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  list: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 4h9M5 8h9M5 12h9"/><circle cx="2" cy="4" r=".6" fill="currentColor"/><circle cx="2" cy="8" r=".6" fill="currentColor"/><circle cx="2" cy="12" r=".6" fill="currentColor"/></svg>',
  pen: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M11 2.5 13.5 5 5.5 13H3v-2.5z"/></svg>',
  x: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>',
  chev: '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>',
};
// Every value that can be a link is one. Slack opens the channel in the app
// (the real build needs the workspace id; see the PR notes).
const LINKS = {
  email: c => c.email && { href: 'mailto:' + c.email, text: c.email },
  ig: c => c.ig && { href: 'https://www.instagram.com/' + encodeURIComponent(c.ig) + '/', text: '@' + c.ig },
  tt: c => c.tt && { href: 'https://www.tiktok.com/@' + encodeURIComponent(c.tt), text: '@' + c.tt },
  yt: c => c.yt && { href: 'https://www.youtube.com/channel/' + encodeURIComponent(c.yt), text: c.yt },
  slack: c => c.slack && { href: 'https://app.slack.com/client/TMOCKTEAM/' + c.slack, text: '#' + c.slackName },
  creative: c => c.creative && { href: 'https://app.slack.com/client/TMOCKTEAM/' + c.creative, text: '#' + c.creativeName },
  pfm: c => c.pfm && { href: 'https://app.postforme.dev/', text: c.pfm },
  uploadPost: c => c.uploadPost && { href: 'https://app.upload-post.com/', text: c.uploadPost },
};
const FIELDS = {
  email: ['Email', I.mail], ig: ['Instagram', I.ig], tt: ['TikTok', I.tt], yt: ['YouTube', I.yt],
  slack: ['Slack channel', I.slack], creative: ['Creative channel', I.brush], pfm: ['Post for Me', I.send], uploadPost: ['Upload-Post', I.up],
};
const link = (c, k, inner) => { const l = LINKS[k](c); return l ? `<a class="lnk" href="${esc(l.href)}" target="_blank" rel="noopener">${inner || esc(l.text)}</a>` : '<span class="empty">Not set</span>'; };

// ── State ───────────────────────────────────────────────────────────────
const P = new URLSearchParams(window.__Q || location.search);
const S = { dir: P.get('d') || 'a', sel: P.get('c') || '', q: '', active: 0, popOpen: false, list: P.get('list') === '1', picker: P.get('picker') === '1', edit: P.get('edit') === '1', draft: {}, hist: false, toast: '' };
if (P.get('sel') === '1' && !S.sel) S.sel = CLIENTS[0].slug;
const phone = () => window.innerWidth <= 600;
const cur = () => CLIENTS.find(c => c.slug === S.sel) || null;
function matches(q) {
  q = q.trim().toLowerCase();
  if (!q) return CLIENTS.slice(0, 6);
  return CLIENTS.filter(c => [c.name, c.slug, c.ig, c.tt, c.email].some(v => String(v || '').toLowerCase().includes(q)));
}
const hi = (s, q) => { q = q.trim(); if (!q) return esc(s); const i = s.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };

// ── Shared pieces ───────────────────────────────────────────────────────
function searchHtml() {
  const res = matches(S.q);
  S.active = Math.min(S.active, Math.max(0, res.length - 1));
  const opts = res.length ? res.map((c, i) => `<button type="button" role="option" class="sx-opt${i === S.active ? ' on' : ''}" aria-selected="${i === S.active}" data-pick="${c.slug}">${av(c.name, c.color)}<span style="min-width:0"><span class="nm">${hi(c.name, S.q)}</span><span class="sub" style="display:block">${hi('@' + c.ig, S.q)} · ${hi(c.email, S.q)}</span></span></button>`).join('')
    : `<div class="sx-none">No client matches “${esc(S.q)}”.</div>`;
  return `<div class="sx" id="sx">
    <div class="sx-pill"><input class="sx-input" id="sxIn" type="text" role="combobox" aria-expanded="${S.popOpen}" aria-controls="sxPop" aria-label="Search clients" placeholder="Search a client by name, handle or email" value="${esc(S.q)}" autocomplete="off"><button class="sx-icon" type="button" tabindex="-1" aria-hidden="true">${I.search}</button></div>
    <div class="sx-pop" id="sxPop" role="listbox" ${S.popOpen ? '' : 'hidden'}>${S.q ? '' : '<div class="sx-hint">Recently opened</div>'}${opts}<div class="sx-hint"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div>
  </div>`;
}
const allBtn = () => `<button type="button" class="allbtn" id="allBtn" aria-expanded="${S.list}" title="All clients">${I.list}<span class="t">All clients</span></button>`;
function pageHead() {
  return `<div class="ph"><h2>Clients</h2>${searchHtml()}${allBtn()}</div>`;
}
function landing() {
  const recent = CLIENTS.slice(0, 5);
  return `<div class="land"><h3>Recently opened</h3><div class="recent">${recent.map(c => `<button type="button" data-pick="${c.slug}">${av(c.name, c.color)}${esc(c.name)}</button>`).join('')}</div></div>`;
}
function val(c, k) {
  if (S.edit) return `<input class="inp" data-f="${k}" aria-label="${esc(FIELDS[k][0])}" value="${esc(k in S.draft ? S.draft[k] : (c[k] || ''))}">`;
  return link(c, k);
}
function pickerOptions(c) {
  const counts = id => CLIENTS.filter(x => x.mgr === id).length;
  return MANAGERS.map(m => `<button type="button" class="mp-opt${m.id === c.mgr ? ' on' : ''}" data-mgr="${m.id}"><span class="chk">${m.id === c.mgr ? '✓' : ''}</span>${av(m.name, m.color)}<span>${esc(m.name)}</span><span class="cnt">${counts(m.id)} clients</span></button>`).join('');
}
function pickerHtml(c) {
  if (!S.picker) return '';
  const foot = '<div class="mp-foot">One manager per client. The change is saved with history, and the Sheet copy follows.</div>';
  if (phone()) return `<div class="scrim" data-close="picker"></div><div class="sheet" role="dialog" aria-label="Change social media manager"><div class="mp" style="position:static;width:auto;box-shadow:none;border:0"><h5>Social media manager for ${esc(c.name)}</h5>${pickerOptions(c)}${foot}</div></div>`;
  return `<div class="scrim" data-close="picker" style="background:transparent"></div><div class="mp" id="mp" role="dialog" aria-label="Change social media manager"><h5>Social media manager</h5>${pickerOptions(c)}${foot}</div>`;
}
function lowerHtml(c) {
  const steps = ['Contract', 'Invoice', 'Form', 'Slack channels', 'Drive folder', 'Post for Me', 'Kickoff call'];
  const done = Math.round(c.onboarding / 27 * steps.length);
  const r = c.research;
  return `<div class="lower">
    <details class="fold"${S.edit ? ' open' : ''}><summary>Content research<span class="tag">rarely needed</span></summary><div class="fold-body"><dl>
      <dt>Content description</dt><dd>${S.edit ? `<input class="inp" value="${esc(r.description)}">` : esc(r.description)}</dd>
      <dt>Keywords</dt><dd>${esc(r.keywords)}</dd><dt>Specific keywords</dt><dd>${esc(r.specific)}</dd><dt>Competitors</dt><dd>${esc(r.competitors)}</dd></dl></div></details>
    <details class="fold"><summary>Onboarding <span class="adminpill">Admin</span><span class="tag">${c.onboarding} of 27 steps done</span></summary><div class="fold-body"><div class="steps">${steps.map((s, i) => `<span class="${i < done ? 'ok' : ''}">${i < done ? '✓ ' : ''}${esc(s)}</span>`).join('')}<span>+ 20 more</span></div></div></details>
  </div>`;
}
function editBar() {
  if (!S.edit) return '';
  return `<div class="editbar"><span class="note">Saves only if nobody changed this client since you opened it. Every change is kept in the history.</span><button class="btn" type="button" id="cancelEdit">Cancel</button><button class="btn primary" type="button" id="saveEdit">Save changes</button></div>`;
}
function provHtml(c) {
  const h = S.hist ? `<div class="hist"><div><span class="w">3 Oct, 14:02</span><span>Kasper changed TikTok from <i>(empty)</i> to @${esc(c.tt || 'newhandle')}</span></div><div><span class="w">2 Oct, 20:00</span><span>Copied from the Clients Info sheet when SyncView became the main copy</span></div></div>` : '';
  return `<div class="prov">Last saved ${esc(c.updated)} by ${esc(c.updatedBy)} · version ${c.version} · <button type="button" id="histBtn">${S.hist ? 'Hide history' : 'See history'}</button>${h}</div>`;
}
const editBtn = (cls = 'btn quiet') => S.edit ? '' : `<button type="button" class="${cls}" id="editBtn">${I.pen}Edit</button>`;

// ── Direction A: Dossier ────────────────────────────────────────────────
function renderA(c) {
  const m = mgrOf(c);
  const card = (title, col, keys) => `<section class="card" style="--c:var(--${col});--ci:var(--${col}-ink)"><h4>${title}</h4>${keys.map(k => `<div class="row"><span class="k">${FIELDS[k][0]}</span><span class="v">${val(c, k)}</span></div>`).join('')}</section>`;
  const reach = ['email', 'slack', 'creative', 'ig', 'tt', 'yt'].map(k => { const l = LINKS[k](c); return l ? `<a href="${esc(l.href)}" target="_blank" rel="noopener">${FIELDS[k][1]}<span>${esc(FIELDS[k][0].replace(' channel', ''))}</span></a>` : ''; }).join('');
  return `<div class="hero">
      <div class="hero-top">${av(c.name, c.color)}<div><h3>${esc(c.name)}</h3><div class="slug">${esc(c.slug)}</div>
        <button type="button" class="mgr" id="mgrBtn" aria-haspopup="dialog">${m ? av(m.name, m.color) : ''}<span class="lbl">Managed by</span>${esc(m ? m.name : 'Nobody yet')}${I.chev}</button></div>
        <div class="hero-actions">${editBtn('btn')}</div></div>
      ${S.edit ? '' : `<div class="reach">${reach}</div>`}
    </div>
    <div class="grid">
      ${card('Contact and team', 'edit', ['email', 'slack', 'creative'])}
      ${card('Social accounts', 'asks', ['ig', 'tt', 'yt'])}
      ${card('Publishing', 'music', ['pfm', 'uploadPost'])}
    </div>
    <section class="hs"><h4>HubSpot</h4>
      <div class="st"><span class="k">Deal</span><span class="v">${esc(c.stage)}</span></div>
      <div class="st"><span class="k">Contract</span><span class="v">${esc(c.contract)}</span></div>
      <div class="st"><span class="k">First payment</span><span class="v">${esc(c.payment)}</span></div>
    </section>
    ${lowerHtml(c)}${editBar()}${provHtml(c)}`;
}
function listA() {
  if (!S.list) return '';
  return `<div class="scrim" data-close="list" style="background:transparent"></div><div class="drop" role="dialog" aria-label="All clients"><div class="hd"><span>${CLIENTS.length} clients</span><span>Show 3 archived</span></div><div class="dl">${CLIENTS.map(c => `<button type="button" class="sx-opt" data-pick="${c.slug}">${av(c.name, c.color)}<span style="min-width:0"><span class="nm">${esc(c.name)}</span><span class="sub" style="display:block">@${esc(c.ig)}</span></span></button>`).join('')}</div></div>`;
}

// ── Direction B: Index card ─────────────────────────────────────────────
function renderB(c) {
  const m = mgrOf(c);
  const sec = (title, col, keys) => `<section class="sec" style="--c:var(--${col});--ci:var(--${col}-ink)"><h4>${title}</h4><dl>${keys.map(k => { const l = LINKS[k](c); return `<div class="kv"><dt>${FIELDS[k][0]}</dt><dd>${S.edit ? val(c, k) : (l ? esc(l.text) : '<span class="empty">Not set</span>')}</dd>${!S.edit && l ? `<a class="go" href="${esc(l.href)}" target="_blank" rel="noopener">${k === 'email' ? 'Write' : 'Open'}</a>` : '<span></span>'}</div>`; }).join('')}</dl></section>`;
  const q = (k, label) => { const l = LINKS[k](c); return l ? `<a href="${esc(l.href)}" target="_blank" rel="noopener">${FIELDS[k][1]}${label}</a>` : ''; };
  const steps = [['Deal', c.stage, true], ['Contract', c.contract, c.contract === 'Signed'], ['First payment', c.payment, c.payment === 'Paid']];
  return `<div class="layout">
    <aside class="id">${av(c.name, c.color)}<h3>${esc(c.name)}</h3><div class="slug">${esc(c.slug)}</div>
      <div class="lab">Social media manager</div>
      <button type="button" class="mgr" id="mgrBtn" aria-haspopup="dialog">${m ? av(m.name, m.color) : ''}${esc(m ? m.name : 'Choose a manager')}<span class="chev">${I.chev}</span></button>
      <div class="quick">${q('email', 'Email')}${q('slack', 'Slack')}${q('creative', 'Creative')}</div>
      <div class="editrow">${editBtn()}</div>
    </aside>
    <div>
      ${sec('Contact', 'know', ['email'])}
      ${sec('Social accounts', 'asks', ['ig', 'tt', 'yt'])}
      ${sec('Team channels', 'edit', ['slack', 'creative'])}
      ${sec('Publishing', 'music', ['pfm', 'uploadPost'])}
      <section class="sec" style="--c:var(--about);--ci:var(--about-ink)"><h4>HubSpot</h4><div class="track">${steps.map(([k, v, ok]) => `<div class="t${ok ? ' ok' : ''}"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div></section>
      ${lowerHtml(c)}${editBar()}${provHtml(c)}
    </div></div>`;
}
function listB() {
  if (!S.list) return '';
  let last = '', out = '';
  CLIENTS.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
    const L = c.name[0];
    if (L !== last) { out += `<div class="letter">${L}</div>`; last = L; }
    out += `<button type="button" class="sx-opt${c.slug === S.sel ? ' on' : ''}" data-pick="${c.slug}">${av(c.name, c.color)}<span style="min-width:0"><span class="nm">${esc(c.name)}</span><span class="sub" style="display:block">${esc(mgrOf(c).name)}</span></span></button>`;
  });
  return `<div class="scrim" data-close="list"></div><aside class="drawer" role="dialog" aria-label="All clients"><div class="hd">All clients · ${CLIENTS.length}<button type="button" class="btn quiet" data-close="list" aria-label="Close">${I.x}</button></div><div class="bd">${out}</div></aside>`;
}

// ── Direction C: Launchpad ──────────────────────────────────────────────
function renderC(c) {
  const m = mgrOf(c);
  const tile = (k, color, bg) => {
    const l = LINKS[k](c), [label, icon] = FIELDS[k];
    if (S.edit) return `<div class="tile" style="--tc:${color};--tb:${bg}"><span class="gl">${icon}</span><span class="k">${label}</span>${val(c, k)}</div>`;
    if (!l) return `<div class="tile none" style="--tc:${color}"><span class="gl">${icon}</span><span class="k">${label}</span><span class="v empty">Not set</span></div>`;
    return `<a class="tile" style="--tc:${color};--tb:${bg}" href="${esc(l.href)}" target="_blank" rel="noopener"><span class="gl">${icon}</span><span class="open">${k === 'email' ? 'Write' : 'Open'} ↗</span><span class="k">${label}</span><span class="v">${esc(l.text)}</span></a>`;
  };
  return `<div class="head"><div><h3>${esc(c.name)}</h3><div class="meta"><button type="button" class="mgr" id="mgrBtn" aria-haspopup="dialog">${m ? av(m.name, m.color) : ''}${esc(m ? m.name : 'No manager')}${I.chev}</button><span>${esc(c.slug)}</span></div></div><div class="tools">${editBtn('btn')}</div></div>
    <div class="grp"><h4>Where they post</h4><div class="tiles">${tile('ig', 'var(--ig)', 'var(--ig-light)')}${tile('tt', 'var(--tt)', 'var(--tt-light)')}${tile('yt', 'var(--yt)', 'var(--yt-light)')}${tile('email', 'var(--know)', 'var(--know-bg)')}</div></div>
    <div class="grp"><h4>Where the team talks, and where we publish</h4><div class="tiles">${tile('slack', 'var(--slack)', 'var(--slack-light)')}${tile('creative', 'var(--slack)', 'var(--slack-light)')}${tile('pfm', 'var(--music)', 'var(--music-bg)')}${tile('uploadPost', 'var(--edit)', 'var(--edit-bg)')}</div></div>
    <div class="grp"><h4>HubSpot</h4><div class="hstiles">
      <div class="hst"><div class="k">Deal</div><div class="v"><span class="dot"></span>${esc(c.stage)}</div></div>
      <div class="hst"><div class="k">Contract</div><div class="v"><span class="dot${c.contract === 'Signed' ? '' : ' w'}"></span>${esc(c.contract)}</div></div>
      <div class="hst"><div class="k">First payment</div><div class="v"><span class="dot${c.payment === 'Paid' ? '' : ' w'}"></span>${esc(c.payment)}</div></div></div></div>
    <div style="margin-top:22px">${lowerHtml(c)}</div>${editBar()}${provHtml(c)}`;
}
function listC() {
  if (!S.list) return '';
  return `<div class="scrim" data-close="list"></div><div class="pal" data-close-self="list"><div class="pal-box" role="dialog" aria-label="All clients"><div style="display:flex;align-items:center;justify-content:space-between"><b>All clients · ${CLIENTS.length}</b><button type="button" class="btn quiet" data-close="list" aria-label="Close">${I.x}</button></div><div class="pal-grid">${CLIENTS.map(c => `<button type="button" data-pick="${c.slug}">${av(c.name, c.color)}<span style="min-width:0"><span class="nm" style="display:block">${esc(c.name)}</span><span class="sub">${esc(mgrOf(c).name)}</span></span></button>`).join('')}</div></div></div>`;
}
function pickerC(c) {
  if (!S.picker) return '';
  if (phone()) return pickerHtml(c);
  const max = Math.max(...MANAGERS.map(m => CLIENTS.filter(x => x.mgr === m.id).length));
  return `<div class="scrim" data-close="picker"></div><div class="mgrmodal" data-close-self="picker"><div class="box" role="dialog" aria-label="Change social media manager"><h5>Who manages ${esc(c.name)}?</h5><p>One manager per client. The bar shows how many clients each one already has.</p>${MANAGERS.map(m => { const n = CLIENTS.filter(x => x.mgr === m.id).length; return `<button type="button" class="mp-opt${m.id === c.mgr ? ' on' : ''}" data-mgr="${m.id}"><span class="chk">${m.id === c.mgr ? '✓' : ''}</span>${av(m.name, m.color)}<span>${esc(m.name)}</span><span class="cnt" style="display:flex;align-items:center;gap:8px"><span class="bar"><i style="width:${n / max * 100}%"></i></span>${n}</span></button>`; }).join('')}<div class="mp-foot">Saved with history; the Sheet copy follows.</div></div></div>`;
}

// ── Render + behaviour ──────────────────────────────────────────────────
function render() {
  if (P.get('bare') !== '1') return;
  const c = cur();
  const body = c ? ({ a: renderA, b: renderB, c: renderC })[S.dir](c) : landing();
  const list = ({ a: listA, b: listB, c: listC })[S.dir]();
  const picker = c ? (S.dir === 'c' ? pickerC(c) : pickerHtml(c)) : '';
  const hadFocus = document.activeElement && document.activeElement.id === 'sxIn';
  document.getElementById('root').innerHTML = `<div class="app d${S.dir.toUpperCase()}">
    <div class="sv-bar"><span class="sv-logo">SyncView</span><div class="sv-tabs"><span>Calendar</span><span>Production</span><span>Workload</span><span class="on">Kasper</span></div></div>
    <div class="sv-sub"><span>Review</span><span>Messages</span><span>Filming</span><span class="on">Clients</span></div>
    <main class="page">${pageHead().replace('<div class="sx"', '<div class="sx" style="position:relative"')}${body}</main>
    ${list}${picker}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}</div>`;
  // The list drop for A anchors under the search row.
  if (S.dir === 'a' && S.list) { const ph = document.querySelector('.ph'); const d = document.querySelector('.dA .drop'); ph.style.position = 'relative'; ph.appendChild(d); }
  if (S.picker && !phone() && S.dir !== 'c') { const b = document.getElementById('mgrBtn'), p = document.getElementById('mp'); if (b && p) { const r = b.getBoundingClientRect(); p.style.top = (r.bottom + window.scrollY + 6) + 'px'; p.style.left = Math.min(r.left, window.innerWidth - 316) + 'px'; } }
  if (hadFocus) { const i = document.getElementById('sxIn'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
function pick(slug) { S.sel = slug; S.q = ''; S.popOpen = false; S.list = false; S.edit = false; S.draft = {}; S.hist = false; render(); window.scrollTo(0, 0); }
function toast(t) { S.toast = t; render(); setTimeout(() => { S.toast = ''; render(); }, 1800); }
document.addEventListener('input', e => {
  if (e.target.id === 'sxIn') { S.q = e.target.value; S.active = 0; S.popOpen = true; render(); }
  else if (e.target.dataset.f) S.draft[e.target.dataset.f] = e.target.value;
});
document.addEventListener('focusin', e => { if (e.target.id === 'sxIn' && !S.popOpen) { S.popOpen = true; render(); } });
document.addEventListener('keydown', e => {
  if (e.target.id === 'sxIn') {
    const res = matches(S.q);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!res.length) return; S.popOpen = true; S.active = (S.active + (e.key === 'ArrowDown' ? 1 : -1) + res.length) % res.length; render(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (res[S.active]) pick(res[S.active].slug); }
    else if (e.key === 'Escape') { S.popOpen = false; render(); }
  } else if (e.key === 'Escape' && (S.list || S.picker)) { S.list = false; S.picker = false; render(); }
});
document.addEventListener('click', e => {
  const t = e.target;
  const p = t.closest('[data-pick]'); if (p) { pick(p.dataset.pick); return; }
  const mg = t.closest('[data-mgr]');
  if (mg) { const c = cur(), m = MANAGERS.find(x => x.id === mg.dataset.mgr); if (c.mgr !== m.id) { c.mgr = m.id; c.version++; S.picker = false; toast(m.name + ' now manages ' + c.name); } else { S.picker = false; render(); } return; }
  const cl = t.closest('[data-close]'); if (cl) { S[cl.dataset.close] = false; render(); return; }
  if (t.matches && t.matches('[data-close-self]')) { S[t.dataset.closeSelf] = false; render(); return; }
  if (t.closest('#allBtn')) { S.list = !S.list; S.popOpen = false; render(); return; }
  if (t.closest('#mgrBtn')) { S.picker = true; render(); return; }
  if (t.closest('#editBtn')) { S.edit = true; S.draft = {}; render(); return; }
  if (t.closest('#cancelEdit')) { S.edit = false; S.draft = {}; render(); return; }
  if (t.closest('#saveEdit')) { const c = cur(); Object.assign(c, S.draft); const n = Object.keys(S.draft).length; S.edit = false; S.draft = {}; if (n) { c.version++; c.updated = '7 Oct 2026'; } toast(n ? 'Saved' : 'Nothing changed'); return; }
  if (t.closest('#histBtn')) { S.hist = !S.hist; render(); return; }
  if (S.popOpen && !t.closest('#sx')) { S.popOpen = false; render(); }
});
window.addEventListener('resize', () => render());

// ── Gallery wrapper (only when not embedded) ────────────────────────────
if (P.get('bare') === '1') {
  if (P.get('theme')) document.documentElement.setAttribute('data-theme', P.get('theme'));
  if (P.get('q')) { S.q = P.get('q'); S.popOpen = true; }
  render();
  if (P.get('q')) document.getElementById('sxIn').focus();
} else {
  const G = { d: 'a', w: '1440', t: 'light', s: '1' };
  const seg = (k, opts) => `<div class="g-seg" role="group">${opts.map(([v, l]) => `<button type="button" data-g="${k}" data-v="${v}" aria-pressed="${G[k] === v}">${l}</button>`).join('')}</div>`;
  document.getElementById('root').innerHTML = `<div class="g-top"><div class="g-title">Clients tab: three directions<small>Fictional clients. Click around: search, All clients, the manager, Edit, the folded sections.</small></div><div id="gc"></div></div><div class="g-note" id="gn"></div><div class="g-stage" id="gs"><div class="g-frame-wrap" id="gw"><iframe class="g-frame" id="gf" title="Mockup"></iframe></div></div>`;
  const draw = () => {
    document.documentElement.setAttribute('data-theme', G.t);
    document.getElementById('gc').innerHTML = `<div style="display:flex;gap:10px;flex-wrap:wrap">${seg('d', [['a', 'A · Dossier'], ['b', 'B · Index card'], ['c', 'C · Launchpad']])}${seg('w', [['1440', 'Desktop 1440'], ['390', 'Phone 390']])}${seg('t', [['light', 'Light'], ['dark', 'Dark']])}${seg('s', [['1', 'A client open'], ['0', 'Start (nothing open)']])}</div>`;
    document.getElementById('gn').innerHTML = DIRS[G.d].blurb;
    const f = document.getElementById('gf'), w = +G.w, h = w === 390 ? 844 : 960;
    // Self-contained: the frame gets this same file, told which view to draw.
    const q = 'bare=1&sel=' + G.s + '&d=' + G.d + '&theme=' + G.t;
    if (f.dataset.q !== q) { f.dataset.q = q; f.srcdoc = SRC.replace('<script>', '<script>window.__Q=' + JSON.stringify(q) + ';</' + 'script><script>'); }
    f.style.width = w + 'px'; f.style.height = h + 'px';
    const avail = document.getElementById('gs').clientWidth - 32, s = Math.min(1, avail / (w + 2));
    const wrap = document.getElementById('gw');
    wrap.style.width = (w + 2) + 'px'; wrap.style.transform = `scale(${s})`; wrap.style.height = (h + 2) + 'px';
    document.getElementById('gs').style.height = ((h + 2) * s + 32) + 'px';
    wrap.style.marginLeft = s < 1 ? '0' : 'auto';
  };
  document.addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) { G[b.dataset.g] = b.dataset.v; draw(); } });
  window.addEventListener('resize', draw);
  draw();
}
</script>
</body>
</html>
